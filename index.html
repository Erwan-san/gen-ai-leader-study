v class=\"qans\">→ <strong>Model Monitoring<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Automate the whole pipeline from preprocessing to deployment<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Agent Platform Pipelines<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>The platform (Vertex AI / Agent Platform) simplifies ML through a unified platform, comprehensive tooling and <strong>MLOps<\/strong>.<\/p><\/div><\/section><\/div>"}]},{"id":"3.7","title":"The model layer","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · What is an AI model?","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Gap:<\/strong> the page ends with a \"standard workflow for creating models in Agent Platform\" click-through (Next button). Its steps weren't in the extracted text. Check them on the page.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>What is an AI model?<\/h2><div class=\"bi\"><ul>\n<li>The <strong>\"brain\"<\/strong> of any AI/ML system: sophisticated mathematical structures trained on massive data.<\/li>\n<li>They learn patterns and relationships to <strong>generate content, analyse data, classify information<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Agent Platform as a model hub: build or use existing<\/h2><h3>Use existing models: Model Garden<\/h3><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kv\">Most organisations <strong>don't need a new model<\/strong>. Fine-tune and reuse existing ones.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Model Garden<\/div><div class=\"kv\">(on Agent Platform) lets you <strong>discover, customise and deploy<\/strong> models from <strong>Google and Google partners<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Over 160 models<\/div><div class=\"kv\">Google, third-party and open-source. Customise with your data and deploy to your apps. Some pre-trained models work <strong>out of the box without tuning<\/strong>.<\/div><\/div><\/div><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Category<\/div><div class=\"kt\"><strong>First-party foundation models<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Examples named on the page<\/div><div class=\"kv\"><strong>Gemini<\/strong> (Pro, Flash…); <strong>Imagen<\/strong> (text-to-image); <strong>Veo<\/strong> (text-to-video, image-to-video); <strong>Chirp 2.0<\/strong> (speech-to-text)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Category<\/div><div class=\"kt\"><strong>First-party pre-trained APIs<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Examples named on the page<\/div><div class=\"kv\"><strong>Speech-to-Text<\/strong>, <strong>Natural Language Processing (NLP)<\/strong>, <strong>Translation<\/strong>, <strong>Vision<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Category<\/div><div class=\"kt\"><strong>Open models<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Examples named on the page<\/div><div class=\"kv\"><strong>Gemma 2<\/strong>, <strong>CodeGemma<\/strong>, <strong>PaliGemma<\/strong>, <strong>Meta Llama 3.1 / 3.2<\/strong>, <strong>Mistral AI<\/strong>, AI21, <strong>TII Falcon<\/strong>, BERT, FLAN-T5, ViT, EfficientNet<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Category<\/div><div class=\"kt\"><strong>Third-party models<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Examples named on the page<\/div><div class=\"kv\"><strong>Anthropic's Claude model family<\/strong> (partner foundation models)<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Build your own models","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agent Platform as a model hub: build or use existing<\/h2><h3>Build your own models<\/h3><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Fully custom training<\/div><div class=\"kv\">at scale with any ML framework: <strong>PyTorch, TensorFlow, scikit-learn, XGBoost<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Agent Platform AutoML<\/div><div class=\"kv\">create and train models with <strong>minimal technical knowledge and effort<\/strong>.<\/div><\/div><\/li><\/ol><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">AutoML data type<\/div><div class=\"kt\"><strong>Image<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Supported objectives<\/div><div class=\"kv\">Classification, object detection<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">AutoML data type<\/div><div class=\"kt\"><strong>Video<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Supported objectives<\/div><div class=\"kv\">Action recognition, classification, object tracking<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">AutoML data type<\/div><div class=\"kt\"><strong>Tabular<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Supported objectives<\/div><div class=\"kv\">Classification / regression, forecasting<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check (answer key)<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Translation for a global e-commerce platform; want a ready, high-performing option at a moderate budget<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Model Garden<\/strong> (existing model or pre-trained API).<\/div><\/div><div class=\"qa\"><div class=\"qq\">Expert researcher building cutting-edge protein-folding prediction; needs full control of architecture and training<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Build a custom model on Agent Platform<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>The model is the core. <strong>Model Garden<\/strong> offers a large repository of pre-built models; <strong>Agent Platform<\/strong> also supports custom models (custom training or AutoML).<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The 'over 160 models' figure changes often. Remember what Model Garden does, not the number.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"3.8","title":"Generative AI in action: A manufacturing use case (Cymbal Aerospace)","kind":"usecase","html":"","videos":["DjAP08D8vFQ"],"steps":[{"title":"Problem · Solution: a two-layered approach on Agent Platform","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Problem<\/h2><div class=\"bi\"><ul>\n<li><strong>Cymbal Aerospace<\/strong> makes critical <strong>jet engine components<\/strong>. It has a huge library of <strong>3D CAD models<\/strong>.<\/li>\n<li>Getting information out of them (<strong>material composition, dimensions, stress points, tolerances<\/strong>) was <strong>manual, slow, error-prone<\/strong>. That slowed design, analysis and manufacturing.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Solution: a two-layered approach on Agent Platform<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Agent Platform AutoML<\/div><div class=\"kv\">trains a specialised ML model to <strong>extract key metadata from CAD files<\/strong>, with no deep ML expertise needed. It acts as an \"intelligent interpreter\" of the files.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Gemini within Agent Platform<\/div><div class=\"kv\">, integrated through <strong>MLOps tools such as Agent Platform Pipelines:<\/strong> turns the raw metadata into <strong>clear natural-language summaries and answers<\/strong>.<ul>\n<li>Example question: <em>\"What is the tensile strength of the turbine blade?\"<\/em> → an immediate, accurate answer.<\/li>\n<\/ul><\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Platform benefits cited · Results (memorise)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Platform benefits cited<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Simplified model development<\/div><div class=\"kv\">AutoML handles training complexity.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Customised solutions<\/div><div class=\"kv\">a model trained on their own data.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Efficient scaling<\/div><div class=\"kv\">process large volumes of CAD files.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Streamlined deployment<\/div><div class=\"kv\"><strong>serverless<\/strong> infrastructure; Agent Platform handles MLOps (scaling, infrastructure).<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>Results (memorise)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Product development cycles 15% faster<\/div><div class=\"kv\">.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Design review time reduced 20%<\/div><div class=\"kv\">.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Manufacturing planning bottlenecks eliminated<\/div><div class=\"kv\">→ faster time-to-market and competitive advantage.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Combining <strong>AutoML (specialised extraction)<\/strong> with <strong>Gemini (natural-language understanding and summaries)<\/strong> on Agent Platform solves industry-specific problems.<\/p><\/div><\/section><\/div>"}]},{"id":"3.9","title":"The infrastructure layer","kind":"concept","html":"","videos":[],"steps":[{"title":"Definition · Scenario motivating it","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Definition<\/h2><div class=\"bi\"><ul>\n<li>The <strong>infrastructure layer<\/strong> = <strong>hardware + software<\/strong> providing <strong>compute, storage and networking<\/strong> to <strong>train, deploy and scale<\/strong> AI models.<\/li>\n<li>It's essential for massive datasets and computations, especially LLMs and gen AI. Google has invested heavily in AI infrastructure.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Scenario motivating it<\/h2><div class=\"bi\"><ul>\n<li>A bold gen AI project stalls: in-house servers lack processing power, training takes hours to days, launch is delayed, and scaling your own hardware costs too much.<\/li>\n<li>→ Use <strong>high-performance computing<\/strong> in the cloud.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"High-performance computing","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Components<\/h2><h3>High-performance computing<\/h3><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">GPUs and TPUs<\/div><div class=\"kv\">specialised processors that excel at <strong>parallel processing<\/strong>, crucial for training large neural networks.<ul>\n<li><strong>GPUs<\/strong> were originally for <strong>graphics rendering<\/strong> and are now used for general parallel compute in AI.<\/li>\n<li><strong>TPUs<\/strong> are <strong>Google's custom chips optimised for AI<\/strong>.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Hypercomputers<\/div><div class=\"kv\">a <strong>supercomputer built by linking many nodes<\/strong> (containing GPUs and TPUs) over high-speed networks into one massive unit, for the most demanding gen AI models.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"High-performance storage","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Components<\/h2><h3>High-performance storage<\/h3><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kv\">Gen AI is <strong>data hungry<\/strong> (often <strong>petabytes<\/strong> of text, images, code). Storage must give <strong>capacity and speed<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Large-scale storage systems<\/div><div class=\"kv\"><ul>\n<li><strong>high throughput<\/strong> (work done per period of time);<\/li>\n<li><strong>scalability<\/strong>;<\/li>\n<li>dense compute clusters for faster training and <strong>inference<\/strong>;<\/li>\n<li><strong>high reliability and durability<\/strong> (data loss would be catastrophic).<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Fast storage access<\/div><div class=\"kv\">fast read and write so training isn't bottlenecked.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Networking · Benefits of Google Cloud infrastructure","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Components<\/h2><h3>Networking<\/h3><div class=\"bi\"><ul>\n<li><strong>Google's global fiber network:<\/strong> <strong>high-bandwidth, low-latency<\/strong> links that coordinate processors in a cluster.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Benefits of Google Cloud infrastructure<\/h2><div class=\"bi\"><p><strong>Scalability, performance, cost-effectiveness.<\/strong><\/p><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><ul>\n<li>Q: At which stages do you need to consider infrastructure if you <strong>aren't<\/strong> on a platform that handles it?<\/li>\n<li>Options: deployment, refinement, training, monitoring, data collection.<\/li>\n<li>My answer key: <strong>all five<\/strong>. Every stage consumes compute and storage. (The page shows the official answer only after you submit.)<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Leaders must understand infrastructure to decide on <strong>resource allocation and scalability<\/strong>.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>Exam guide list of AI-optimised infrastructure: <strong>hypercomputer<\/strong>, Google's custom-designed <strong>TPUs<\/strong>, <strong>GPUs<\/strong>, <strong>data centres<\/strong>, <strong>cloud computing<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"3.10","title":"AI on the edge","kind":"concept","html":"","videos":[],"steps":[{"title":"Edge computing · Google edge tools","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Edge computing<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Edge computing<\/div><div class=\"kv\">= running AI on devices or servers <strong>closer to the data source or point of need<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Cloud isn't always ideal. A self-driving car or a drone avoiding obstacles <strong>can't wait for a cloud round trip<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Benefits<\/div><div class=\"kv\"><ul>\n<li><strong>real-time responsiveness<\/strong>;<\/li>\n<li><strong>increased data privacy<\/strong>;<\/li>\n<li><strong>less reliance on internet connectivity<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>Google edge tools<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Lite Runtime (LiteRT)<\/div><div class=\"kv\">Google's high-performance runtime that helps ML models <strong>run efficiently on-device<\/strong> (edge devices, phones).<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Gemini Nano<\/div><div class=\"kv\">Google's <strong>most efficient, compact<\/strong> model, built to run on the edge (smartphones, embedded systems). Part of the Gemini family; a miniature version of the data-centre AI.<ul>\n<li><strong>Benefits:<\/strong><ul>\n<li><strong>Privacy:<\/strong> data stays on the device.<\/li>\n<li><strong>Speed:<\/strong> no cloud round trip.<\/li>\n<li><strong>Offline access:<\/strong> works without internet.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Where it's used:<\/strong><ul>\n<li><strong>Pixel phones:<\/strong> <strong>Call Notes<\/strong> (summarises phone calls) and <strong>Pixel Recorder<\/strong> (summarises recordings).<\/li>\n<li><strong>Android:<\/strong> available to developers through the <strong>AI Edge SDK<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Agent Platform still matters for edge","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agent Platform still matters for edge<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Build, train, refine<\/div><div class=\"kv\">data prep, training, tuning, evaluation, collaboration, MLOps.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Deploy to the edge<\/div><div class=\"kv\"><ol>\n<li><strong>Convert models<\/strong> to <strong>LiteRT<\/strong>.<\/li>\n<li><strong>Package and deploy<\/strong> models plus dependencies in <strong>containers<\/strong> for various edge hardware.<\/li>\n<li><strong>Manage and monitor<\/strong> edge deployments and gather insights to improve.<\/li>\n<\/ol><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: edge or cloud?<\/h2><div class=\"bi\"><div class=\"tw rtable\"><table>\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th>Answer<\/th>\n<th>Reason<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Medical device giving real-time feedback during surgery<\/td>\n<td><strong>Edge<\/strong><\/td>\n<td>Cloud latency unacceptable<\/td>\n<\/tr>\n<tr>\n<td>E-commerce chatbot handling millions of queries a day<\/td>\n<td><strong>Cloud<\/strong><\/td>\n<td>Needs scale and robustness<\/td>\n<\/tr>\n<tr>\n<td>Self-driving car making instant decisions<\/td>\n<td><strong>Edge<\/strong><\/td>\n<td>Split-second, on-device<\/td>\n<\/tr>\n<tr>\n<td>Smart-city traffic-flow optimisation<\/td>\n<td><strong>Cloud<\/strong><\/td>\n<td>Centralised, high-capacity analysis<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Edge = local, real-time, more data control. Tools: <strong>LiteRT, Gemini Nano<\/strong>. Use <strong>Agent Platform<\/strong> to build and refine.<\/p><\/div><\/section><\/div>"}]},{"id":"3.11","title":"Gen AI project resources: People, cost, and time","kind":"concept","html":"","videos":["vx9E4Oh4Dng"],"steps":[{"title":"Video: build vs use existing","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Video: build vs use existing<\/h2><div class=\"bi\"><ul>\n<li>True: sometimes gen AI should run <strong>at the edge or locally<\/strong>, not in the cloud. Every situation differs.<\/li>\n<li>To decide between using an existing app and building a custom solution, assess <strong>needs and resources<\/strong>:<ul>\n<li><strong>Scale:<\/strong> individual, team, company, or millions of customers?<\/li>\n<li><strong>Customisation:<\/strong> what makes it unique? Will <strong>grounding or fine-tuning<\/strong> do, or is a <strong>new model<\/strong> needed?<\/li>\n<li><strong>Interaction:<\/strong> how, where and when users interact, which affects <strong>latency and connectivity<\/strong>.<\/li>\n<li><strong>Resources:<\/strong> <strong>time, people, budget<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"People: roles across the stack","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>People: roles across the stack<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Role<\/div><div class=\"kt\"><strong>Business leaders<\/strong> (business users)<\/div><div class=\"kf\"><div class=\"kl\">Typical interaction<\/div><div class=\"kv\">Use <strong>pre-built<\/strong> gen AI solutions to improve operations and customer experience, e.g. <strong>Google Workspace with Gemini<\/strong> for content creation, data analysis, document summarisation<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Role<\/div><div class=\"kt\"><strong>Developers<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Typical interaction<\/div><div class=\"kv\">Build and deploy <strong>custom agents<\/strong>; integrate AI into existing apps. Use <strong>AI Applications<\/strong> (custom agents, AI code generation, AI-driven data processing), <strong>pre-trained APIs<\/strong> (fast integration), or <strong>Agent Platform<\/strong> (build and deploy agents with tools for <strong>orchestration, grounding and action<\/strong>)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Role<\/div><div class=\"kt\"><strong>AI practitioners<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Typical interaction<\/div><div class=\"kv\"><strong>Customise, deploy and optimise<\/strong> gen AI models with Agent Platform tools. Scale workloads, <strong>integrate models with BigQuery<\/strong>, implement responsible-AI measures such as <strong>bias detection<\/strong> and <strong>adversarial testing<\/strong><\/div><\/div><\/div><\/div><p>Ensure you have the <strong>right expertise<\/strong> before building.<\/p><\/div><\/section><\/div>"},{"title":"Three things you pay for · Pricing models for using models","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Cost<\/h2><h3>Three things you pay for<\/h3><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Training<\/div><div class=\"kv\">the model.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Deploying<\/div><div class=\"kv\">the model to an <strong>endpoint<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Using<\/div><div class=\"kv\">the model for predictions.<\/div><\/div><\/li><\/ol><p>Training and deploying usually cost <strong>compute time<\/strong> plus <strong>storage<\/strong> (training data, outputs).<\/p><\/div><\/section><section class=\"blk sec\"><h2>Pricing models for using models<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Usage-based<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">Pay for what you use, often by <strong>tokens or characters<\/strong> (common for APIs such as Google's PaLM &amp; Gemini APIs)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Subscription-based<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">Recurring fee, often tiered by usage limits or features<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Licensing fees<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">One-time or recurring, especially for commercial use or embedding in products<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Free tiers<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">Limited free use for experimentation or non-commercial purposes<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Usage pricing metrics · Factors that drive cost","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Cost<\/h2><h3>Usage pricing metrics<\/h3><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Tokens<\/div><div class=\"kv\">a token is a piece of text, a word or part of a word.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Characters<\/div><div class=\"kv\">some providers, <strong>like Google<\/strong>, charge per character processed.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Requests<\/div><div class=\"kv\">per call, regardless of complexity or volume.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Compute time<\/div><div class=\"kv\">processing time, especially for heavy tasks.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>Factors that drive cost<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Model size and complexity<\/div><div class=\"kv\">bigger, more capable models cost more.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Context window<\/div><div class=\"kv\">larger windows can cost more.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Features<\/div><div class=\"kv\">fine-tuning and embeddings may be <strong>priced separately<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Deployment<\/div><div class=\"kv\">where you deploy affects compute costs.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Time","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Time<\/h2><div class=\"bi\"><ul>\n<li>More custom = more time and resources:<ul>\n<li><strong>Pre-built app:<\/strong> <strong>seconds<\/strong>.<\/li>\n<li><strong>Custom agent with AI Applications:<\/strong> <strong>much less time<\/strong> than fully custom.<\/li>\n<li><strong>Fully custom solution with a custom model:<\/strong> <strong>months<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li>Check that the timeline is realistic against the requirements.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Allocate the <strong>right mix of business users, developers and AI practitioners<\/strong>, understand <strong>cost<\/strong> drivers, and match <strong>timelines<\/strong> to complexity.<\/p><\/div><\/section><\/div>"}]},{"id":"3.12","title":"Gen AI solution needs","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · 1. Scale","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Assess needs before starting: align ambitions with capabilities.<\/p><\/div><\/section><section class=\"blk sec\"><h2>1. Scale<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Small scale<\/div><div class=\"kv\">(individual or small team): go far with <strong>pre-built tools<\/strong> and existing gen AI apps.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Large scale<\/div><div class=\"kv\">(millions of customers): needs a more <strong>robust, customised<\/strong> solution with <strong>scalability and security<\/strong>. Factor in <strong>infrastructure cost, data storage, latency<\/strong>.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>2. Customisation<\/h2><div class=\"bi\"><p>Foundation models keep improving, so <strong>custom model development is less often necessary<\/strong>.\n- <strong>Start with existing models:<\/strong> pre-trained models via <strong>APIs or open-source libraries<\/strong>; <strong>fine-tune<\/strong> on your data.\n- <strong>Identify unique needs:<\/strong> specialised knowledge, complex tasks, or a unique UX determine the customisation level.\n- <strong>Consider data specificity:<\/strong> specialised domains (<strong>law, medicine<\/strong>) → fine-tune with domain data or use domain-trained models.\n- <strong>Consider task complexity:<\/strong> simple (summarisation) vs intricate (code generation, creative writing) affects model choice and training.<\/p><\/div><\/section><\/div>"},{"title":"3. User interaction · 4. Privacy","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>3. User interaction<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">UI<\/div><div class=\"kv\">integrate into existing workflows: a dedicated interface (e.g. a <strong>chatbot widget<\/strong>) or embedded in current apps.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">UX<\/div><div class=\"kv\">user-friendly; conversational, informative or task-oriented? How much guidance and feedback do users need?<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>4. Privacy<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Data security<\/div><div class=\"kv\">protect data in processing and storage (<strong>encryption, access controls, secure data centres<\/strong>).<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Compliance<\/div><div class=\"kv\">regulations such as <strong>GDPR, HIPAA<\/strong>.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>5. Other considerations<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Latency<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Question<\/div><div class=\"kv\">Acceptable response time?<\/div><\/div><div class=\"kf\"><div class=\"kl\">Tip<\/div><div class=\"kv\">If real time isn't critical, you have more flexibility in model and infrastructure<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Connectivity<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Question<\/div><div class=\"kv\">Always online?<\/div><\/div><div class=\"kf\"><div class=\"kl\">Tip<\/div><div class=\"kv\">Plan <strong>offline<\/strong> functionality if needed (→ edge)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Accuracy<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Question<\/div><div class=\"kv\">How crucial? What error tolerance?<\/div><\/div><div class=\"kf\"><div class=\"kl\">Tip<\/div><div class=\"kv\">Defines model selection, training data, evaluation metrics<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Explainability<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Question<\/div><div class=\"kv\">Need the reasoning behind decisions?<\/div><\/div><div class=\"kf\"><div class=\"kl\">Tip<\/div><div class=\"kv\">Use explainable models or techniques, especially in <strong>healthcare and finance<\/strong><\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><ul>\n<li>Scenario: realistic images from text for a marketing campaign; some coding skills; <strong>short on time<\/strong>.<\/li>\n<li>Options: pre-trained API / build from scratch / fine-tune a Model Garden text-to-image model.<\/li>\n<li>My answer key: <strong>use a pre-trained API<\/strong>, the fastest path. Building from scratch is clearly wrong. Fine-tuning costs time you don't have.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Assess <strong>scale, customisation, user interaction, privacy<\/strong>, plus <strong>latency, connectivity, accuracy, explainability<\/strong>.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>For specialised domains: fresh or proprietary <strong>facts<\/strong> → RAG/grounding; domain <strong>style, format or behaviour<\/strong> → fine-tuning.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"3.13","title":"Choosing and maintaining your gen AI solution","kind":"concept","html":"","videos":[],"steps":[{"title":"Comparing providers and models","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Comparing providers and models<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Evaluate model capabilities<\/div><div class=\"kv\">use <strong>benchmarks<\/strong> and comparisons for quality and performance.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Compare pricing structures<\/div><div class=\"kv\">estimate costs from your expected usage and each provider's pricing metrics.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Factor in additional costs<\/div><div class=\"kv\">data storage, API calls, fine-tuning.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Read the fine print<\/div><div class=\"kv\">usage limits, data privacy policies, terms of service.<\/div><\/div><\/li><\/ol><p><strong>Where to compare:<\/strong>\n- provider <strong>pricing pages<\/strong>;\n- <strong>research papers and independent benchmarks<\/strong>;\n- <strong>community forums and discussions<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"Maintenance: \"a journey, not a destination\"","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Maintenance: \"a journey, not a destination\"<\/h2><div class=\"bi\"><ul>\n<li>Plan it <strong>from the start<\/strong>: who maintains it, with what resources, and what the specific needs are.<\/li>\n<li><strong>Google Cloud's fully managed environment<\/strong> lets developers focus on <strong>agent development<\/strong>, not infrastructure. The platform handles deployment and model improvement, which maximises ROI and avoids costly issues.<\/li>\n<\/ul><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Maintenance area<\/div><div class=\"kt\"><strong>Model monitoring and retraining<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What to plan<\/div><div class=\"kv\">Continuous performance monitoring; periodic retraining with updated data<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Maintenance area<\/div><div class=\"kt\"><strong>Data updates<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What to plan<\/div><div class=\"kv\">New sources, cleaning, adapting to changing formats<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Maintenance area<\/div><div class=\"kt\"><strong>Software updates and bug fixes<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What to plan<\/div><div class=\"kv\">Keep the platform, libraries and frameworks current for performance and security<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Maintenance area<\/div><div class=\"kt\"><strong>Hardware and infrastructure<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What to plan<\/div><div class=\"kv\">Server maintenance, security updates, <strong>capacity planning<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Maintenance area<\/div><div class=\"kt\"><strong>Security and compliance<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What to plan<\/div><div class=\"kv\">Review and update against evolving threats; follow changing privacy regulations<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Course 3 wrap-up","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Course 3 wrap-up<\/h2><div class=\"bi\"><p>You covered the gen AI <strong>layers<\/strong>, Google Cloud options, and the business factors. Leaders must plan to <strong>adapt, update and optimise<\/strong> over time to keep delivering value.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]}]},{"id":"4","title":"Gen AI Apps: Transform Your Work","lessons":[{"id":"4.1","title":"Introduction to Gen AI Apps: Transform Your Work","kind":"concept","html":"","videos":["sHcrA7Vs4U8"],"steps":[{"title":"Overview · Video points","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Recommended: complete Courses 1–3 first.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Video points<\/h2><div class=\"bi\"><ul>\n<li>The best way to grasp gen AI is <strong>hands-on with existing apps<\/strong>, chatbots included. They don't show every capability but they spark ideas.<\/li>\n<li>While experimenting, ask two questions:<ol>\n<li><strong>Is this use case repeatable?<\/strong> Would I, or my team, use it again?<\/li>\n<li><strong>Is gen AI falling short because it lacks customisation?<\/strong> It misunderstands my specific needs, or the output is \"a bit off\".<\/li>\n<\/ol>\n<\/li>\n<li>When either happens, <strong>write it down and raise it with the team<\/strong>. These are the use cases with the biggest organisational impact (they lead to Gems, Gemini Notebook, and custom agents in C5).<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Questions this course answers","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Questions this course answers<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\">How can gen AI fit into your <strong>daily workflow<\/strong>?<\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">What techniques <strong>improve prompting<\/strong>?<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\">Which Google gen AI products need <strong>no development expertise<\/strong>?<\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\">How can you build <strong>more automated workflows<\/strong> for your team?<\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"4.2","title":"Google Workspace with Gemini","kind":"concept","html":"","videos":["uhRXxp2L9hM"],"steps":[{"title":"Overview · Video anecdotes","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Naming: formerly <strong>\"Gemini for Google Workspace\"<\/strong>, rebranded <strong>Google Workspace with Gemini<\/strong> (same features).<\/p><\/div><\/section><section class=\"blk sec\"><h2>Video anecdotes<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Gemini in Google Docs<\/div><div class=\"kv\">a phrase sounded too formal. Select it → Gemini icon → \"make more casual\". That was too casual, so she used <strong>rephrase<\/strong> instead.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Gemini in Google Drive side panel<\/div><div class=\"kv\">asked \"what is the definition of Project Horizon?\". Gemini returned the definition <strong>and pointed to the source document<\/strong>. It saved roughly 5 minutes of searching and a colleague's time.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Two reasons the course covers Workspace:<ol>\n<li>It shows the <strong>same underlying gen AI technology<\/strong> looking different in different workflows.<\/li>\n<li>The tools are genuinely useful.<\/li>\n<\/ol>\n<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Key facts","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Key facts<\/h2><div class=\"bi\"><ul>\n<li><strong>Google Workspace<\/strong> = cloud productivity and collaboration tools: <strong>Gmail, Docs, Sheets, Meet, Slides<\/strong>.<\/li>\n<li>Gemini is a <strong>model<\/strong> used in many apps. Workspace with Gemini puts it <strong>inside Workspace apps<\/strong>.<\/li>\n<li>The features available depend on your <strong>Workspace edition<\/strong>.<\/li>\n<li><strong>Business and enterprise licences<\/strong> add <strong>enterprise-grade data protection<\/strong>. It extends to Workspace with Gemini features and the Gemini app (with Gemini Advanced), plus <strong>admin features<\/strong> to manage usage and access.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Features by app","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Features by app<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Feature<\/div><div class=\"kt\"><strong>Gemini side panel<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Summarise, analyse, generate using your emails and docs <strong>without switching apps or tabs<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">A new hire asks Drive: \"summarize the goals and current status of Project Phoenix\"<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Feature<\/div><div class=\"kt\"><strong>Gemini in Gmail<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Write and refine emails<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">HR drafts a company-wide email about a new benefit (eligibility, effective date)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Feature<\/div><div class=\"kt\"><strong>Gemini in Docs<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Create, refine, proofread in the document<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">Marketing generates taglines and 3 social posts for an athletic shoe campaign<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Feature<\/div><div class=\"kt\"><strong>Gemini in Slides<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Generate <strong>photorealistic images<\/strong> for presentations<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">Describe subject, setting, style<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Feature<\/div><div class=\"kt\"><strong>Gemini in Sheets<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\"><strong>Generate formulas<\/strong> from plain language<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">\"find cell C1 in range D:G and output the value in column G\"<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Feature<\/div><div class=\"kt\"><strong>Gemini in Meet<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\"><strong>Real-time transcription and translation<\/strong> for multilingual meetings; <strong>automated summaries and action items<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">Global teams<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Beyond the core apps","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Beyond the core apps<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Google Vids<\/div><div class=\"kv\">online video creation and editing for Workspace users. <strong>\"Help me Create\"<\/strong> generates a first draft video. E.g. a PM shares updates, timelines and insights more effectively than an email or report.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">AppSheet<\/div><div class=\"kv\">a <strong>no-code app builder<\/strong> included in Workspace <strong>enterprise<\/strong> editions. <strong>Gemini in AppSheet<\/strong> builds an app structure (tables, columns, links) from a natural-language description (e.g. \"Manage inspections of my facility\"). You review and edit it in the AppSheet editor.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>These features bring <strong>AI-enhanced workflows<\/strong> into daily work for productivity and effectiveness.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The exam guide still uses the name <strong>Gemini for Google Workspace<\/strong>; the course and current product name is <strong>Google Workspace with Gemini<\/strong>. Same thing.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"4.3","title":"Use case: AI-enhanced workflows in Google Workspace (Understood.org)","kind":"usecase","html":"","videos":["xkG5_oHXTSk"],"steps":[{"title":"Facts","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Facts<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Understood.org<\/div><div class=\"kv\">is a social-impact organisation supporting people with <strong>learning and thinking differences<\/strong> (e.g. ADHD, dyslexia), which affect <strong>70M+ Americans<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Used <strong>Google Workspace with Gemini<\/strong> and the <strong>Gemini app<\/strong> to:<ul>\n<li><strong>surface trends<\/strong>;<\/li>\n<li><strong>build donor profiles<\/strong>;<\/li>\n<li><strong>tailor communications<\/strong> for fundraising.<\/li>\n<\/ul>\n<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Workflow<\/div><div class=\"kv\"><ol>\n<li>The research team (a \"power user\") asks Gemini trend questions and has it <strong>cite its sources<\/strong>.<\/li>\n<li>The team <strong>verifies<\/strong> the outputs and <strong>exports them to a Google Doc<\/strong>.<\/li>\n<li>They hand off to the partnerships team.<\/li>\n<li>Partnerships uses Gemini to write <strong>personalised messages<\/strong> to donors and partners, edited and sent with confidence.<\/li>\n<\/ol><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Results (memorise)<\/div><div class=\"kv\"><ul>\n<li><strong>~10 hours saved per research project<\/strong>;<\/li>\n<li>partnerships team saves <strong>~2 hours per day<\/strong>.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Accessibility and cognitive load<\/div><div class=\"kv\">the CMO (who has learning differences himself) uses Gemini to stay organised and reduce the cognitive load of context switching.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">They also <strong>migrated to Google Meet<\/strong> to explore Gemini for meeting productivity and accessibility.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Key benefit<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>saving time on repetitive tasks and personalising communications<\/strong>.<\/div><\/div><div class=\"qnote\">Not: eliminating humans. Not: one-off email writing.<\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Workspace with Gemini is more than content generation. It boosts <strong>organisational efficiency and customisation<\/strong>. Note that <strong>humans verify<\/strong> outputs (HITL).<\/p><\/div><\/section><\/div>"}]},{"id":"4.4","title":"Prompting techniques","kind":"concept","html":"","videos":[],"steps":[{"title":"Prompting with examples (exam core)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Prompting with examples (exam core)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Technique<\/div><div class=\"kt\"><strong>Zero-shot<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Definition<\/div><div class=\"kv\">Task with <strong>no examples<\/strong>; relies on existing knowledge<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mnemonic<\/div><div class=\"kv\">\"Just tell it what you want.\"<\/div><\/div><div class=\"kf\"><div class=\"kl\">Online clothing-store example<\/div><div class=\"kv\">Customer asks about returns; the LLM answers from general knowledge without company-specific training<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Technique<\/div><div class=\"kt\"><strong>One-shot<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Definition<\/div><div class=\"kv\"><strong>One example<\/strong> to learn from and apply to similar cases<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mnemonic<\/div><div class=\"kv\">\"Guide it with a single example.\"<\/div><\/div><div class=\"kf\"><div class=\"kl\">Online clothing-store example<\/div><div class=\"kv\">One sample inquiry (shipping times); output follows it and tags similar questions<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Technique<\/div><div class=\"kt\"><strong>Few-shot<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Definition<\/div><div class=\"kv\"><strong>Multiple examples<\/strong> for better task understanding and performance<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mnemonic<\/div><div class=\"kv\">\"Show, don't tell.\"<\/div><\/div><div class=\"kf\"><div class=\"kl\">Online clothing-store example<\/div><div class=\"kv\">Several inquiries with good responses; output follows them (e.g. a discount code for delayed delivery, return instructions for damaged items)<\/div><\/div><\/div><\/div><p>You can <strong>combine<\/strong> techniques.<\/p><\/div><\/section><\/div>"},{"title":"Hands-on: \"Help desk hero\"","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Hands-on: \"Help desk hero\"<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Categories<\/div><div class=\"kv\">Billing Issue · Account Management · Technical Support · Feature Request · Refund Request.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Tricky ticket<\/div><div class=\"kv\">the customer upgraded but still sees basic-plan features; logging out and in didn't fix it.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Exercise<\/div><div class=\"kv\"><ul>\n<li>Classify it with zero-shot, then one-shot (e.g. \"I can't reset my password\" → Account Management), then few-shot. Few-shot examples: charged twice → Billing Issue; need last month's invoice → Account Management; new feature not working → Technical Support.<\/li>\n<li>Reflect on how the <strong>number of examples<\/strong> changes the prompt and the result, and on the trade-offs of each technique.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kv\">(No official answer given. The ticket arguably straddles Account Management, Technical Support and Billing, which is the point of the exercise.)<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"4.5","title":"Role prompting","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · Definition","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Partial gap:<\/strong> the \"Prompt 1 / Prompt 2\" comparison outputs are behind interactive buttons and weren't in the extracted text.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>Definition<\/h2><div class=\"bi\"><ul>\n<li><strong>Role prompting:<\/strong> guiding an LLM by assigning a <strong>specific role or persona<\/strong> (a business analyst, a Shakespearean actor, a helpful customer-service agent…).<\/li>\n<li>It shapes the <strong>style, tone and focus<\/strong> of responses.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Example prompts on the page<\/h2><div class=\"bi\"><ul>\n<li>\"You are a <strong>customer service agent<\/strong> for a telecommunications company with <strong>ten years of experience<\/strong>. A customer is asking about a bill higher than expected.\"<\/li>\n<li>\"You are a <strong>marketing copywriter<\/strong> for a new athletic-wear line. Write a running-shoe product description emphasising comfort and performance.\"<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Exercise","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Exercise<\/h2><div class=\"bi\"><ul>\n<li>Template: <strong>\"You are a [persona]. Please write a [task].\"<\/strong><\/li>\n<li>Bonus: rerun the same task with a different persona and compare.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>A role makes the model act as an <strong>expert or character<\/strong>, so content is tailored. Role prompting is also the recommended way to write <strong>Gem instructions<\/strong> (4.8).<\/p><\/div><\/section><\/div>"}]},{"id":"4.6","title":"Prompt chaining","kind":"concept","html":"","videos":[],"steps":[{"title":"Definition","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Definition<\/h2><div class=\"bi\"><ul>\n<li><strong>Prompt chaining:<\/strong> each response <strong>builds on the previous one<\/strong>, like a conversation, to reach more complex and nuanced results.<\/li>\n<li>In a chatbot like Gemini, <strong>earlier prompts affect later ones<\/strong> (shared context).<\/li>\n<li>Method:<ol>\n<li>Start with a <strong>broad initial prompt<\/strong>.<\/li>\n<li>Follow up with clarifying questions, more specifics, or a <strong>different format<\/strong>.<\/li>\n<li>Refine <strong>incrementally<\/strong> until the goal is met, rather than doing everything in one request.<\/li>\n<\/ol>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Exercise: \"The chain reaction\"","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Exercise: \"The chain reaction\"<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Set a goal<\/div><div class=\"kv\">a business proposal, a business-trip itinerary, a multi-element marketing image.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Start the chain<\/div><div class=\"kv\">e.g. a 5-day Tokyo business trip in August to meet clients and attend <strong>Google Cloud Next Tokyo<\/strong>, plus landmarks if there's time.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Build the chain<\/div><div class=\"kv\">follow-ups such as hotels near the conference centre with business amenities, or adding day trips.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Observe and analyse<\/div><div class=\"kv\">how each step builds on the last.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Reflect and share.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>General definition: prompt chaining splits a task into a sequence of prompts where each output feeds the next step. A chat conversation is one way to do it.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"4.7","title":"Reusing prompts with Gemini and Gems","kind":"concept","html":"","videos":["2DdGLeBlsdg"],"steps":[{"title":"Overview · Video","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Partial gap:<\/strong> the interactive \"prompt chaining scenario\" (marketing manager, organic skincare campaign) is a click-through dialogue that wasn't captured as text.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>Video<\/h2><div class=\"bi\"><ul>\n<li>After experimenting you'll know where the tools shine and where you need something <strong>more tailored<\/strong>. Examples: you're tired of retyping long prompts, or you need gen AI in a more complex workflow.<\/li>\n<li>You can <strong>customise and automate without writing code<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"1. Prompt templates","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Levels of reuse (simple → more tailored)<\/h2><h3>1. Prompt templates<\/h3><div class=\"bi\"><p>Save reusable prompts in a <strong>Google Doc or Sheet<\/strong>. Templates by role on the page:\n- <strong>Marketing manager:<\/strong> social post for [platform] promoting [product], highlighting [benefits], with a call to action.\n- <strong>Content writer:<\/strong> a [content type] about [topic] for [audience], in a [tone], including [keywords].\n- <strong>Customer support:<\/strong> reply to [email], empathetic, addressing [issue], with a solution in line with [company policy].\n- <strong>Software developer:<\/strong> Python code to [task] using [libraries], following [style guidelines].<\/p><\/div><\/section><\/div>"},{"title":"2. Prompt chaining in one thread · 3. Gemini Advanced","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Levels of reuse (simple → more tailored)<\/h2><h3>2. Prompt chaining in one thread<\/h3><div class=\"bi\"><ul>\n<li>Keep working in the <strong>same conversation<\/strong> so history carries over.<\/li>\n<li>Gemini lets you <strong>name and pin chats<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>3. Gemini Advanced<\/h2><div class=\"bi\"><ul>\n<li>An upgraded Gemini, more capable for complex tasks: <strong>coding, logical reasoning, nuanced instructions, creative collaboration<\/strong>.<\/li>\n<li>You can set <strong>data retention<\/strong> and <strong>delete conversation history<\/strong> at any time.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>4. Saved info<\/h2><div class=\"bi\"><ul>\n<li>Persistent facts that Gemini <strong>always uses across all chats<\/strong>. Set in <strong>Settings<\/strong>.<\/li>\n<li>Use it when you want context remembered <strong>without the full conversation history<\/strong> influencing answers.<\/li>\n<li><strong>Examples:<\/strong><ul>\n<li>A <strong>sales rep<\/strong> saves \"I'm a sales rep\" and practises pitches without feedback being skewed by earlier sessions.<\/li>\n<li>A <strong>sales team leader<\/strong> saves targets, <strong>KPIs<\/strong> and report format for weekly reports.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"5. Gems","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Levels of reuse (simple → more tailored)<\/h2><h3>5. Gems<\/h3><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Task-specific<\/div><div class=\"kv\">context when Saved info (which applies to <strong>all<\/strong> chats) is too broad.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Like agents, they process information and reason <strong>within the context of a chosen task<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Examples<\/div><div class=\"kv\"><ul>\n<li><strong>Creative writing Gem:<\/strong> your style, tone, resources; brainstorming and feedback.<\/li>\n<li><strong>Coding Gem:<\/strong> favourite libraries, conventions, documentation; debugging and snippets.<\/li>\n<li><strong>Marketing Gem:<\/strong> audience demographics, competitor info, campaign data; ideas, copy, performance analysis.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: prompt chaining vs Saved info vs Gem (my answer key)<\/h2><div class=\"bi\"><div class=\"tw rtable\"><table>\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th>Best strategy<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Social media manager needing a consistent brand voice across platforms<\/td>\n<td><strong>Gem<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sales rep practising pitches, wanting independent feedback each time<\/td>\n<td><strong>Saved info<\/strong> (matches the page's own example)<\/td>\n<\/tr>\n<tr>\n<td>Developer who only wants snippets in one specific language<\/td>\n<td><strong>Gem<\/strong> (or Saved info if it applies to all their chats; the page frames Gems as task-specific)<\/td>\n<\/tr>\n<tr>\n<td>Writer brainstorming a creative project and getting feedback<\/td>\n<td><strong>Prompt chaining<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Dog groomer wanting all self-care questions answered about dogs<\/td>\n<td><strong>Saved info<\/strong> (applies to every chat)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Reuse well-crafted prompts. Use <strong>chaining<\/strong> for in-conversation context, <strong>Saved info<\/strong> for global persistent context, <strong>Gems<\/strong> for task-specific assistants.<\/p><\/div><\/section><\/div>"}]},{"id":"4.8","title":"How do Gems work?","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · Gems = personalised AI assistants inside Gemini","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Partial gap:<\/strong> the example Gem with its inputs (\"View instructions\" and + buttons) is a graphic. Its exact field text wasn't extracted.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>Gems = personalised AI assistants inside Gemini<\/h2><div class=\"bi\"><p>Three benefits:\n1. <strong>Personalised responses:<\/strong> tailored instructions and information make answers more relevant to that use case.\n2. <strong>Streamlined workflows:<\/strong> templates, prompts or guided interactions for repetitive tasks.\n3. <strong>Reset context:<\/strong>\n      - Set the Gem's context once (background, instructions).\n      - Then start <strong>multiple separate chats<\/strong> with it. Each keeps its own focus and <strong>nothing spills over<\/strong> between chats.\n      - Like different conversations with the same expert.<\/p><\/div><\/section><\/div>"},{"title":"Building Gems","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Building Gems<\/h2><div class=\"bi\"><ul>\n<li>Use <strong>Google's pre-made Gems<\/strong> for common tasks, or <strong>create a custom Gem<\/strong>.<\/li>\n<li>A custom Gem's instructions <strong>prompt the agent on how to act<\/strong>: \"prompting to build your agents\".<\/li>\n<li><strong>Role prompting<\/strong> fits well here (e.g. \"act as an air traffic controller\").<\/li>\n<li><strong>Attach documents and resources<\/strong> for a focused knowledge base, e.g. a \"code reviewer\" Gem with the project's style guide and best practices, so feedback is <strong>grounded<\/strong> in your requirements.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Best practices","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Best practices<\/h2><div class=\"bi\"><ul>\n<li>Be <strong>clear and specific<\/strong>. Provide <strong>examples<\/strong> of the desired outcome.<\/li>\n<li><strong>Refine instructions over time<\/strong> as you use the Gem.<\/li>\n<li>Think about <strong>how users will interact<\/strong> with it and what information they'll need to provide.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Gems turn well-crafted prompts into <strong>reusable assistants<\/strong> using role prompting and a focused knowledge base.<\/p><\/div><\/section><\/div>"}]},{"id":"4.9","title":"Grounding and RAG","kind":"concept","html":"","videos":[],"steps":[{"title":"Grounding (no-code)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Grounding (no-code)<\/h2><div class=\"bi\"><ul>\n<li><strong>Grounding<\/strong> = the AI model's ability to <strong>connect its output to verifiable, specific sources<\/strong>. It's critical for <strong>trust and reliability<\/strong>.<\/li>\n<li>You already do it without code when you <strong>attach resources to a Gem<\/strong>, or <strong>attach documents in Gemini app prompts<\/strong> (with Gemini Advanced).<\/li>\n<li><strong>Example:<\/strong> give Gemini your company <strong>style guide<\/strong> (in the prompt or as an upload) so it edits text to your organisation's standards.<\/li>\n<li>Richer context → more accurate, insightful results.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"RAG (retrieval-augmented generation)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>RAG (retrieval-augmented generation)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Retrieve<\/div><div class=\"kv\">relevant information from a knowledge base (database, documents, even the whole web). This is often powered by <strong>semantic search<\/strong> or <strong>vector databases<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Generate<\/div><div class=\"kv\">the output using what was retrieved.<\/div><\/div><\/li><\/ol><div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Model only (no RAG)<\/th>\n<th>Model with RAG<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flow<\/td>\n<td>User prompt → model output<\/td>\n<td>Query goes to a <strong>backend retrieval system<\/strong> (vector DB or search engine); relevant information is <strong>embedded in the prompt<\/strong> → model output<\/td>\n<\/tr>\n<tr>\n<td>Knowledge<\/td>\n<td>No external knowledge; possibly <strong>outdated<\/strong><\/td>\n<td><strong>Latest external knowledge<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Hallucination risk<\/td>\n<td><strong>Higher<\/strong><\/td>\n<td><strong>Much lower<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"RAG benefits (memorise the three) · No-code RAG","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>RAG benefits (memorise the three)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Improved accuracy and relevance.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Improved explainability and transparency<\/div><div class=\"kv\">shows the <strong>specific sources<\/strong>, so claims can be checked.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Extending LLM capabilities<\/div><div class=\"kv\">can <strong>constrain<\/strong> the output to the provided context.<\/div><\/div><\/li><\/ol><p>RAG lets models go beyond memorising to <strong>accessing and using external knowledge<\/strong>.<\/p><\/div><\/section><section class=\"blk sec\"><h2>No-code RAG<\/h2><div class=\"bi\"><p><strong>Gemini Notebook<\/strong> (next lesson) is a way to use RAG <strong>without coding or database development<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The exam guide distinguishes grounding with <strong>first-party enterprise data<\/strong> (your own data), <strong>third-party data<\/strong> (external datasets) and <strong>world data<\/strong> (public knowledge, e.g. Google Search).<\/li>\n<li>Google Cloud grounding offerings: <strong>pre-built RAG with Agent Search<\/strong>, <strong>RAG APIs<\/strong>, <strong>Grounding with Google Search<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"4.10","title":"Gemini Notebook","kind":"concept","html":"","videos":["1Ke8hpJwzYM"],"steps":[{"title":"What it is · Editions","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>What it is<\/h2><div class=\"bi\"><ul>\n<li>An <strong>AI-first notebook grounded in your own documents<\/strong>, built on <strong>Gemini models<\/strong>. It works as a <strong>virtual research assistant<\/strong>.<\/li>\n<li>You ground it in <strong>documents, presentations, audio and video files<\/strong>. It <strong>only uses those sources<\/strong> to answer and summarise.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Editions<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Edition<\/div><div class=\"kt\"><strong>Gemini Notebook<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Adds<\/div><div class=\"kv\">Core product<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Edition<\/div><div class=\"kt\"><strong>Gemini Notebook Plus<\/strong> (subscription)<\/div><div class=\"kf\"><div class=\"kl\">Adds<\/div><div class=\"kv\"><strong>More capacity<\/strong>, <strong>customisable response length and style<\/strong>, <strong>usage analytics<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Edition<\/div><div class=\"kt\"><strong>Gemini Notebook Enterprise<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Adds<\/div><div class=\"kv\">Everything in Plus, plus <strong>compliance and admin<\/strong> features: extra privacy and security, sharing <strong>only with chosen collaborators<\/strong>, access managed with predefined <strong>IAM roles<\/strong><\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"How it works · Gemini Notebook vs Gemini and Gems","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>How it works<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Create a notebook<\/div><div class=\"kv\">a container per project or topic. Title it and upload sources.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Chat interface<\/div><div class=\"kv\">one ongoing chat per notebook. Answers come <strong>only from that notebook's sources<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Save insights as notes<\/div><div class=\"kv\">keep valuable responses as an organised set of notes.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Share and collaborate<\/div><div class=\"kv\"><strong>shared notebooks<\/strong> with the same sources, shared questions and shared notes.<\/div><\/div><\/li><\/ol><\/div><\/section><section class=\"blk sec\"><h2>Gemini Notebook vs Gemini and Gems<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Gems<\/div><div class=\"kv\">general tasks and workflows.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Gemini Notebook<\/div><div class=\"kv\"><strong>deep understanding of a specific set of information<\/strong>.<ul>\n<li><strong>Hyper-focused knowledge:<\/strong> only your sources, not a broad knowledge base.<\/li>\n<li><strong>Interactive learning:<\/strong> questions, different summaries, <strong>quizzes<\/strong>.<\/li>\n<li><strong>Source-based answers:<\/strong> traceable with <strong>citations<\/strong>. If the sources don't cover a question, it <strong>says it can't answer<\/strong>. It doesn't invent or speculate.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Use cases","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Use cases<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Training materials and onboarding<\/div><div class=\"kv\">a shared notebook with the handbook, product docs and training decks for new hires.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Researching a new topic<\/div><div class=\"kv\">articles and videos → summaries and Q&amp;A.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Audio Overviews<\/div><div class=\"kv\">a <strong>podcast-like<\/strong> discussion between <strong>two AI hosts<\/strong>, downloadable.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Presentation prep<\/div><div class=\"kv\">generate speaker notes and practice questions from slides.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Summarise documentation<\/div><div class=\"kv\">investment and legal teams upload financial statements, legal documents and market research to find key information and <strong>flag risks or inconsistencies<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Project proposals and plans<\/div><div class=\"kv\">a shared notebook keeps everyone aligned.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Demo video","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Demo video<\/h2><div class=\"bi\"><ul>\n<li>Click <strong>Create new<\/strong>. Add sources in the left panel.<\/li>\n<li><strong>Supported sources:<\/strong> <strong>PDFs, text files, Markdown, audio (e.g. MP3)<\/strong>, <strong>Google Drive<\/strong> documents, <strong>website and YouTube links<\/strong>, pasted text.<\/li>\n<li>Demo sources: McKinsey's \"The economic potential of generative AI: The next productivity frontier\" and Google Cloud's \"Building an Effective AI Strategy\" whitepaper.<\/li>\n<li>It returns summaries <strong>with citations<\/strong>.<\/li>\n<li><strong>Studio panel:<\/strong> <strong>Audio Overviews, Flashcards, Quizzes<\/strong> and more. For Audio Overviews you can set <strong>format, language, length<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Suggested practice resources (from the page)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Suggested practice resources (from the page)<\/h2><div class=\"bi\"><ul>\n<li>\"How to build an effective AI strategy\" (Google Cloud blog)<\/li>\n<li>\"The executive's guide to generative AI\"<\/li>\n<li>\"The ROI of generative AI\"<\/li>\n<li>\"Secure AI framework approach\"<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Gemini Notebook = <strong>grounded, source-only<\/strong> research assistant. Its answers are accurate, relevant and <strong>traceable<\/strong> to your materials.<\/p><\/div><\/section><\/div>"}]},{"id":"4.11","title":"Gemini Notebook in action","kind":"usecase","html":"","videos":["ip0kVYK9AZk"],"steps":[{"title":"Overview · Scenario (VC firm investing in early-stage tech)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Note: the page intro mentions a \"retail marketing team\", but the video's scenario is a <strong>venture capital firm<\/strong>.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Scenario (VC firm investing in early-stage tech)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Data<\/div><div class=\"kv\">market research on emerging tech, startup financial statements, economic forecasts, competitor portfolio and funding strategies.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Problems<\/div><div class=\"kv\"><ul>\n<li>too much data to sift;<\/li>\n<li>risk of missing insights;<\/li>\n<li>documents <strong>scattered across departments and platforms<\/strong> → <strong>information silos<\/strong>.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Solution<\/div><div class=\"kv\">upload everything into a <strong>shared Gemini Notebook workspace<\/strong> → a <strong>single source of truth<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">What they can then do<\/div><div class=\"kv\"><ul>\n<li><strong>Targeted questions:<\/strong> e.g. projected growth of the AI-powered healthcare sector; key risk factors for a startup.<\/li>\n<li><strong>Analyse specific aspects:<\/strong> e.g. summarise startup X's financials with a focus on <strong>user acquisition costs<\/strong>.<\/li>\n<li><strong>Uncover hidden connections:<\/strong> e.g. correlation between early adoption and long-term success.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Outcome<\/div><div class=\"kv\">they identified a promising startup in <strong>AI-driven medical diagnostics<\/strong>, got faster decisions and better outcomes, and strengthened their data-driven reputation.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Benefits of shared notebooks","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Benefits of shared notebooks<\/h2><div class=\"bi\"><ul>\n<li>Build understanding together.<\/li>\n<li>Produce <strong>collaborative summaries and reports<\/strong>.<\/li>\n<li>Spot <strong>connections and contradictions<\/strong> across perspectives.<\/li>\n<li>Stay <strong>up to date<\/strong>.<\/li>\n<li>A collective \"brain\" and a culture of shared learning.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: true or false (answer key)<\/h2><div class=\"bi\"><div class=\"tw rtable\"><table>\n<thead>\n<tr>\n<th>Statement<\/th>\n<th>Answer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Grounding connects AI responses to specific sources<\/td>\n<td><strong>True<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Gemini Notebook can use information from the entire internet<\/td>\n<td><strong>False<\/strong>: only your sources<\/td>\n<\/tr>\n<tr>\n<td>Gemini Notebook can create quizzes from your documents<\/td>\n<td><strong>True<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Gemini Notebook is best for creative stories or poems<\/td>\n<td><strong>False<\/strong>: it's for understanding your sources<\/td>\n<\/tr>\n<tr>\n<td>Grounding is exclusive to Gemini Notebook<\/td>\n<td><strong>False<\/strong>: also Gems, Gemini prompts, RAG systems…<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"4.12","title":"Gemini for Google Cloud","kind":"concept","html":"","videos":["BeUny7a_YTI"],"steps":[{"title":"Context · Enterprise data protection (exam favourite)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Context<\/h2><div class=\"bi\"><ul>\n<li>Google (AI-first) built Gemini into Google Cloud too, not just Workspace. It's most useful for cloud, software and data engineering roles, but a good source of ideas for everyone.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Enterprise data protection (exam favourite)<\/h2><div class=\"bi\"><ul>\n<li><strong>Gemini for Google Cloud does NOT use your prompts or Gemini's responses to train models.<\/strong> Standard Google Cloud <strong>enterprise protections<\/strong> apply.<\/li>\n<li>Further reading: \"Creating trust through transparency\".<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"The portfolio","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The portfolio<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Product<\/div><div class=\"kt\"><strong>Gemini Cloud Ass
