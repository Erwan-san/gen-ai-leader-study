ist<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">An AI expert that helps <strong>design, manage and optimise<\/strong> apps on Google Cloud. <strong>Application lifecycle management<\/strong> assistance. Analyses your environment, deployed resources, <strong>metrics and logs<\/strong> for tailored, actionable insights<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Product<\/div><div class=\"kt\"><strong>Gemini in BigQuery<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Easier data analysis: write code, understand data, auto-generate insights <strong>regardless of SQL experience<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Product<\/div><div class=\"kt\"><strong>Gemini Code Assist<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">An <strong>AI pair programmer<\/strong>: code suggestions, code blocks, explanations. <strong>20+ programming languages<\/strong>, plus many editors and developer platforms<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Product<\/div><div class=\"kt\"><strong>Gemini in Colab Enterprise<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Helps write <strong>Python<\/strong> in Colab Enterprise notebooks (suggestions as you type, code from descriptions), for data analysis and ML workflows<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Product<\/div><div class=\"kt\"><strong>Gemini in Databases<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Helps developers and DBAs: build apps with <strong>natural language<\/strong>; manage a <strong>fleet of databases from one interface<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Product<\/div><div class=\"kt\"><strong>Gemini in Looker<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Intelligent assistant: understand data, <strong>create visualisations<\/strong>, generate reports<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Product<\/div><div class=\"kt\"><strong>Gemini in Security<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Detect, contain and stop threats. <strong>Near-instant analysis<\/strong> of findings and <strong>attack paths<\/strong>. Summarises threat actors' <strong>tactics, techniques and procedures (TTPs)<\/strong> for timely threat intelligence<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Flashcard answers<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Key benefit of Gemini in BigQuery<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ easier, accessible analysis <strong>regardless of SQL experience<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">How Code Assist boosts productivity<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>AI pair programmer<\/strong>: suggestions, code blocks, explanations.<\/div><\/div><div class=\"qa\"><div class=\"qq\">What's unique about data handling<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>prompts and responses aren't used to train models<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"4.13","title":"Use case: Gemini in action (Cymbal Retail, BigQuery)","kind":"usecase","html":"","videos":["_2fbpA-LLzA"],"steps":[{"title":"Problem · Solution","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Problem<\/h2><div class=\"bi\"><ul>\n<li>Business users lack the SQL or database skills to get at data.<\/li>\n<li><strong>Cymbal Retail's<\/strong> marketing team (demographics, purchasing patterns, campaign performance) depends on the <strong>data analytics team<\/strong>. That creates a <strong>bottleneck<\/strong> and delays insights.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Solution<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Gemini in BigQuery with function calling<\/div><div class=\"kv\">, wrapped in a <strong>user-friendly app<\/strong>, so marketers query in <strong>natural language<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Gemini <strong>translates the question into SQL<\/strong>, retrieves the data and presents it understandably.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Example questions<\/div><div class=\"kv\"><ul>\n<li>top-selling products in the Northeast;<\/li>\n<li>demographics for the latest campaign;<\/li>\n<li>holiday promotions vs last year.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Results (the three named benefits) · Course 4 wrap-up","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Results (the three named benefits)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Increased agility<\/div><div class=\"kv\">direct data access means faster decisions and campaign adjustments.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Improved collaboration<\/div><div class=\"kv\">analysts are freed from routine extraction for <strong>strategic<\/strong> work.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Enhanced data literacy<\/div><div class=\"kv\">business users understand their data better, which leads to more insight and innovation.<\/div><\/div><\/li><\/ol><\/div><\/section><section class=\"blk sec\"><h2>Course 4 wrap-up<\/h2><div class=\"bi\"><p>Personal productivity with gen AI apps, prompting techniques, and the key levers that influence AI behaviour.\n- <strong>Theme:<\/strong> \"democratise data access\".<\/p><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Primary benefit<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ marketers ask <strong>natural-language questions and get data without writing complex SQL<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Distractors map to other products: fleet management<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ Gemini in Databases; Python/ML → Colab Enterprise; threat containment → Gemini in Security.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]}]},{"id":"5","title":"Gen AI Agents: Transform Your Organization","lessons":[{"id":"5.1","title":"Introduction to Gen AI Agents: Transform Your Organization","kind":"concept","html":"","videos":["aQGaMqfQX6M"],"steps":[{"title":"Overview · Video points","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Recommended: complete Courses 1–4 first.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Video points<\/h2><div class=\"bi\"><ul>\n<li>To transform an organisation, a standard app usually <strong>isn't enough<\/strong>. You need <strong>custom solutions connected to company systems and processes<\/strong>.<\/li>\n<li>Custom does <strong>not<\/strong> mean building from the ground up.<\/li>\n<li>Recap of the 5 layers: <strong>infrastructure, models, platform, agents, gen AI powered applications<\/strong>. This course focuses on <strong>agents<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Questions this course answers<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\">What are the <strong>components of gen AI agents<\/strong> and how do they work together?<\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">How do you keep gen AI systems <strong>grounded in reliable information<\/strong>?<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\">Which <strong>Google Cloud products<\/strong> support agent building?<\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\">How do you <strong>plan ahead<\/strong> to implement gen AI for organisational transformation?<\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"5.2","title":"A brief history of agents","kind":"concept","html":"","videos":["ZM8NYl7FraQ"],"steps":[{"title":"Two kinds of agents","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Two kinds of agents<\/h2><div class=\"bi\"><div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Deterministic<\/strong> (traditional)<\/th>\n<th><strong>Generative<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Basis<\/td>\n<td><strong>Predefined paths and actions<\/strong>; workflow-based, <strong>event-driven<\/strong><\/td>\n<td>Gen AI model (LLM) understanding of meaning and <strong>intent<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Behaviour<\/td>\n<td><strong>Same input → same output<\/strong>. High <strong>control and predictability<\/strong><\/td>\n<td>Some randomness and creativity; may answer the same input differently<\/td>\n<\/tr>\n<tr>\n<td>Build effort<\/td>\n<td>Tedious: teams hand-design every step, decision trees, logic<\/td>\n<td>Far less scripting<\/td>\n<\/tr>\n<tr>\n<td>Weakness<\/td>\n<td>Fails on <strong>atypical questions<\/strong> (\"speak to a live agent!\")<\/td>\n<td>Needs grounding for relevance and freshness<\/td>\n<\/tr>\n<tr>\n<td>Example<\/td>\n<td>IVR phone menus (\"press 1 for scheduling…\")<\/td>\n<td>Modern conversational agents<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Evolution (exam: order these)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Evolution (exam: order these)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Deterministic agents<\/div><div class=\"kv\"><ul>\n<li><strong>Reasoning loop + tools only, no gen AI model.<\/strong><\/li>\n<li>They often still used <em>non-generative<\/em> AI: speech-to-text, <strong>keyword-based intent matching<\/strong>, text-to-speech.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Generative agents without RAG<\/div><div class=\"kv\"><ul>\n<li>Add the <strong>model<\/strong>, which brings natural-language understanding, so roundabout questions still work.<\/li>\n<li>But the architecture meant models <strong>couldn't integrate tool data into their knowledge<\/strong>. Outputs were less tailored and <strong>not up to date<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Generative agents with RAG<\/div><div class=\"kv\"><ul>\n<li><strong>RAG<\/strong> connects model and tools: it accesses <strong>external data sources<\/strong>, giving <strong>dynamic, up-to-date, grounded<\/strong> answers.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Today: hybrid agents.<\/div><div class=\"kv\">The most complex agents <strong>combine deterministic and generative capabilities<\/strong>: deterministic reasoning logic and tooling plus generative abilities.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Modern definition · The three components of an agent (exam core)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Modern definition<\/h2><div class=\"bi\"><p>A gen AI agent <strong>achieves a goal by observing the world and acting on it with its tools<\/strong>. It understands intent, accesses relevant information, and interacts naturally.<\/p><\/div><\/section><section class=\"blk sec\"><h2>The three components of an agent (exam core)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Component<\/div><div class=\"kt\"><strong>Foundational model<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">The underlying LLM (small or large; Gemini or another provider's). Choose one whose <strong>training data is relevant to the use case<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Component<\/div><div class=\"kt\"><strong>Tools<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">Let the agent interact with the outside world: <strong>extensions<\/strong> (APIs), <strong>functions<\/strong> (mock API calls), <strong>data stores<\/strong> (e.g. <strong>vector databases<\/strong>). They let it <strong>observe and act<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Component<\/div><div class=\"kt\"><strong>Reasoning loop<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">The core decision-maker: iterates over goal, tools and gathered information. Frameworks like <strong>ReAct (Reason and Act)<\/strong> guide it<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><p>Order oldest → newest: <strong>Deterministic → Generative without RAG → Generative with RAG<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"5.3","title":"Using models (sampling parameters)","kind":"concept","html":"","videos":["E7DZmkImL5s"],"steps":[{"title":"Context · The parameters (exam core)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Context<\/h2><div class=\"bi\"><ul>\n<li>Models are the <strong>brains<\/strong> of agents. Even after training and tuning, you can improve results by adjusting <strong>parameters and settings<\/strong>.<\/li>\n<li><strong>Sampling parameters<\/strong> are the \"knobs and dials\" you send with your prompt to shape output: more creative, more concise, a given tone.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>The parameters (exam core)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Parameter<\/div><div class=\"kt\"><strong>Token count<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\"><strong>Tokens<\/strong> are the model's text building blocks (word, part of a word, space, punctuation). Models have <strong>token limits<\/strong>; more tokens = longer conversations but more processing<\/div><\/div><div class=\"kf\"><div class=\"kl\">Rule of thumb<\/div><div class=\"kv\"><strong>1 token ≈ 4 English characters<\/strong>; <strong>100 tokens ≈ 60–80 words<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Parameter<\/div><div class=\"kt\"><strong>Temperature<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Controls <strong>randomness / \"creativity\"<\/strong> of word choice<\/div><\/div><div class=\"kf\"><div class=\"kl\">Rule of thumb<\/div><div class=\"kv\"><strong>Low<\/strong> = focused, deterministic, repeatable (good for Q&amp;A and summaries). <strong>High<\/strong> = random, diverse, unexpected (creative)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Parameter<\/div><div class=\"kt\"><strong>Top-p (nucleus sampling)<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Samples from the <strong>smallest set of most-likely tokens whose cumulative probability ≥ p<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Rule of thumb<\/div><div class=\"kv\"><strong>Lower<\/strong> = more focused. <strong>Higher<\/strong> = more diversity (includes lower-probability tokens)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Parameter<\/div><div class=\"kt\"><strong>Top-k<\/strong> (video)<\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\">Samples randomly from the <strong>top k most-likely<\/strong> tokens<\/div><\/div><div class=\"kf\"><div class=\"kl\">Rule of thumb<\/div><div class=\"kv\">Gives other high-scoring words a chance. Can behave oddly when the distribution is <strong>highly skewed<\/strong>, which motivates top-p<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Parameter<\/div><div class=\"kt\"><strong>Safety settings<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\"><strong>Filter harmful or inappropriate<\/strong> content; adjustable filtering level<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Parameter<\/div><div class=\"kt\"><strong>Output length<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it does<\/div><div class=\"kv\"><strong>Maximum length<\/strong> of the generated text (words or characters), or let it stop naturally<\/div><\/div><\/div><\/div><p><strong>Recipes:<\/strong>\n- Concise, factual → <strong>lower temperature + shorter output length<\/strong>.\n- Creative, open-ended → <strong>raise temperature and top-p<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"Explainer video in my words","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Explainer video in my words<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kv\">The model outputs a <strong>probability distribution<\/strong> over possible next words.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Always picking the top word → dull, repetitive text. Sampling fully at random → odd, unlikely words.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Temperature<\/div><div class=\"kv\">narrows (low) or widens (high) the range of candidates.<ul>\n<li>The video's example: low temperature favours \"flowers\" (typical); high temperature can pick \"bugs\" (unusual).<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Top-k<\/div><div class=\"kv\">e.g. k = 2 picks randomly from the 2 most likely words (\"flowers\", \"trees\").<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Top-p<\/div><div class=\"kv\">e.g. p = 0.75 picks from the smallest set whose combined probability reaches 0.75 (\"flowers\", \"trees\", \"herbs\"). The set <strong>grows or shrinks dynamically<\/strong> with the distribution.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"How to access parameters","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>How to access parameters<\/h2><div class=\"bi\"><ul>\n<li>They vary by provider and access route. Often through <strong>APIs (application programming interfaces)<\/strong>: a way for software systems to <strong>communicate and exchange information<\/strong>, \"like a messenger\".<ul>\n<li>Example: a weather app calling a weather service.<\/li>\n<\/ul>\n<\/li>\n<li>In gen AI, your app sends the <strong>prompt plus parameters<\/strong> via the API and receives the response.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Tune <strong>temperature, token count, top-p<\/strong> (and top-k, safety, output length) to steer model behaviour.<\/p><\/div><\/section><\/div>"}]},{"id":"5.4","title":"Google's generative AI APIs (Google AI Studio vs Agent Studio)","kind":"concept","html":"","videos":["7eA_GcSwuB0"],"steps":[{"title":"Google's gen AI APIs · Two places to experiment","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Google's gen AI APIs<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Pre-trained LLMs<\/div><div class=\"kv\">that can be <strong>fine-tuned<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Capabilities<\/div><div class=\"kv\"><strong>text completion, multi-turn chat, code generation, image generation<\/strong>. E.g. the <strong>Nano Banana API<\/strong> generates and customises images.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>Two places to experiment<\/h2><div class=\"bi\"><div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Attribute<\/th>\n<th><strong>Google AI Studio<\/strong><\/th>\n<th><strong>Agent Studio<\/strong> (on Gemini Enterprise Agent Platform; formerly Vertex AI Studio)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>What<\/td>\n<td><strong>Web-based<\/strong> tool to try Gemini models and start building with the <strong>Gemini Developer API<\/strong><\/td>\n<td><strong>Google Cloud console<\/strong> tool to <strong>rapidly prototype and test<\/strong> gen AI models: test with prompt samples, <strong>design and save prompts<\/strong>, <strong>tune foundation models<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Focus<\/td>\n<td>Streamlined, easy interface: explore Gemini, experiment with parameters, creative text<\/td>\n<td><strong>Comprehensive, robust<\/strong> environment to build, train and deploy ML models (part of Agent Platform)<\/td>\n<\/tr>\n<tr>\n<td>Users<\/td>\n<td><strong>Beginners, hobbyists, early-stage<\/strong> development (incl. non-technical users)<\/td>\n<td><strong>Professionals, researchers, developers<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Access<\/td>\n<td><strong>Standard Google account<\/strong><\/td>\n<td><strong>Through Google Cloud<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Limitations<\/td>\n<td><strong>Usage limits<\/strong> (queries, requests and tokens per minute). For <strong>prototyping and small-scale<\/strong> use, not production<\/td>\n<td><strong>Service charge based on usage<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Advantages<\/td>\n<td>Simple and easy to start<\/td>\n<td><strong>More flexible quotas<\/strong> (can be raised on request); <strong>enterprise-grade security and compliance<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><p><strong>Rule:<\/strong> starting out → <strong>Google AI Studio<\/strong>. Scalable, professional, production → <strong>Agent Studio<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"Google AI Studio demo (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Google AI Studio demo (video)<\/h2><div class=\"bi\"><ul>\n<li>Explore Gemini models or <strong>\"vibe code\" apps<\/strong>. Prompt as in the Gemini app.<\/li>\n<li>Add <strong>system instructions<\/strong> to set the agent's overall tone and style.<\/li>\n<li><strong>Right pane:<\/strong><ul>\n<li>choose the model or agent;<\/li>\n<li>set sampling parameters: <strong>temperature, thinking level, top-P<\/strong>;<\/li>\n<li><strong>safety settings<\/strong>;<\/li>\n<li>tools: <strong>function calling<\/strong>, <strong>structured output<\/strong>, <strong>grounding with Google Search<\/strong>.<\/li>\n<li>Options vary by model.<\/li>\n<\/ul>\n<\/li>\n<li>Test by trying prompts.<\/li>\n<li>It's also a prototyping environment that <strong>builds apps from natural-language descriptions<\/strong>.<\/li>\n<li><strong>Get code<\/strong> to run in your own app. This requires creating an <strong>API key<\/strong>.<\/li>\n<li>Generated code is for <strong>small-scale projects and prototypes<\/strong>. For large enterprise projects use <strong>Agent Studio<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p><strong>AI Studio<\/strong> and <strong>Agent Studio<\/strong> let developers and non-technical users experiment with gen AI APIs and customise models.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The APIs are interfaces; the models behind them are pre-trained (and tunable).<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.5","title":"Parameter playground","kind":"lab","html":"","videos":[],"steps":[{"title":"Steps in Google AI Studio","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Steps in Google AI Studio<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Open Google AI Studio<\/div><div class=\"kv\">log in with a Google account, accept the terms, select <strong>Playground<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Write a creative prompt<\/div><div class=\"kv\">a pitch to convince investors in a fictional product. Example: an on-campus food-delivery app for students. Press <strong>Run<\/strong> and review the response.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Experiment with temperature<\/div><div class=\"kv\">in <strong>settings<\/strong>, move the slider.<ul>\n<li><strong>Lower<\/strong> → more <strong>formal, factual<\/strong> tone.<\/li>\n<li><strong>Higher<\/strong> → more <strong>passion and enthusiasm<\/strong>.<\/li>\n<li>Rerun the same prompt.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">More parameters<\/div><div class=\"kv\">open <strong>Advanced settings<\/strong>.<ul>\n<li>Change <strong>Output length<\/strong> and rerun.<\/li>\n<li>Change <strong>Top P<\/strong>: lower → <strong>focused, concise<\/strong>; higher → <strong>elaborate, varied<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Observe and analyse<\/div><div class=\"kv\">confident and authoritative? Concise or detailed? Does it evoke the desired emotion?<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Hands-on tuning of <strong>temperature, top-p and output length<\/strong> is the best way to learn to control <strong>tone, style and creativity<\/strong>.<\/p><\/div><\/section><\/div>"}]},{"id":"5.6","title":"Adding prompt engineering to your reasoning loops","kind":"concept","html":"","videos":["khU4ECECX7M"],"steps":[{"title":"Video points","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Video points<\/h2><div class=\"bi\"><ul>\n<li>What you built in AI Studio is a <strong>very basic agent<\/strong>: no tools, and a reasoning loop that just passes input to the model and returns output.<\/li>\n<li>You level it up by adding <strong>reasoning and logic<\/strong>, usually called <strong>prompt engineering<\/strong>.<ul>\n<li>It's an <strong>agent layer before the end-user application<\/strong> where prompting logic lives.<\/li>\n<li>It's \"engineering\" in a <strong>logical/building<\/strong> sense, not software. <strong>Anyone who can prompt can prompt-engineer.<\/strong><\/li>\n<\/ul>\n<\/li>\n<li><strong>Example: a module-summary writer agent.<\/strong><ul>\n<li>You could prompt Gemini or make a Gem. But for a <strong>scalable product that transforms the organisation<\/strong>, build the prompting logic <strong>into the agent<\/strong>.<\/li>\n<li>E.g. <strong>role prompting<\/strong> (a Google course developer) plus clear directions and <strong>few-shot<\/strong> examples.<\/li>\n<li>End users then only supply the course script.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Metaprompting:<\/strong> pros often use <strong>gen AI to generate their prompts<\/strong> (\"prompting to get a prompt\").<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"The reasoning loop","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The reasoning loop<\/h2><div class=\"bi\"><ul>\n<li>The component that governs how the agent <strong>takes in information, reasons internally, and decides its next action<\/strong>.<\/li>\n<li>It's <strong>iterative and introspective<\/strong> and runs until the goal or a stopping point. Complexity varies.<\/li>\n<\/ul><p>Four aspects:\n1. <strong>Iterative process:<\/strong> a cycle of evaluating progress and choosing the next best action. It includes steps for <strong>action, tool selection, observation<\/strong>.\n2. <strong>Internal reasoning:<\/strong> the <strong>language model<\/strong> supplies the reasoning and logic to think through the steps.\n3. <strong>Decision making:<\/strong> choose the next action, <strong>which tools<\/strong>, and their <strong>inputs<\/strong>.\n4. <strong>Reasoning frameworks:<\/strong> prompt-engineering frameworks guide reasoning and planning (→ 5.7).<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"5.7","title":"Prompt engineering techniques: ReAct and chain-of-thought","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · ReAct (\"reasoning and acting\")","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Partial gap:<\/strong> the \"Italian restaurant\" ReAct walkthrough (Think / Act / Observe / Respond) is a click-through. Only its step names were captured. The generic definitions below come from the page.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>ReAct (\"reasoning and acting\")<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Definition<\/div><div class=\"kv\">a prompting framework that lets the model <strong>reason AND take action<\/strong> on a user query, <strong>with or without in-context examples<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Analogy: it gives the LLM \"a brain and a pair of hands\". A step up from passive text generation.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Loop: Think → Act → Observe → Respond<\/div><div class=\"kv\">(thought–action–observation):<ul>\n<li><strong>Think:<\/strong> produce a thought about the problem (like CoT).<\/li>\n<li><strong>Act:<\/strong> choose an action (web search, database, a tool) and <strong>specify its input<\/strong> (query, command).<\/li>\n<li><strong>Observe:<\/strong> receive the result (search results, database rows).<\/li>\n<li><strong>Respond:<\/strong> answer the user, act further, or form a new thought for the next iteration.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kv\">Mechanically, the agent asks the model for the next step, which can contain a <strong>thought, action (tool choice), action input, observation<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Why it matters<\/div><div class=\"kv\"><ul>\n<li><strong>Dynamic problem solving<\/strong> with external resources and new information;<\/li>\n<li><strong>reduced hallucination<\/strong> (reasoning grounded in real data);<\/li>\n<li><strong>increased trustworthiness<\/strong> (visible reasoning and source interaction).<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Applications<\/div><div class=\"kv\"><ul>\n<li><strong>question answering<\/strong> with external knowledge;<\/li>\n<li><strong>fact verification<\/strong> by searching for evidence;<\/li>\n<li><strong>decision making<\/strong> in interactive environments.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Chain-of-thought (CoT)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Chain-of-thought (CoT)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Definition<\/div><div class=\"kv\">guide the model through problem-solving with <strong>examples that include intermediate reasoning steps<\/strong>, so it learns a structured, logical approach. \"Teaching the LLM to think out loud.\"<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Related to prompt chaining, but done <strong>behind the scenes<\/strong> for the user.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Why it matters<\/div><div class=\"kv\"><ul>\n<li><strong>improved reasoning<\/strong> on logic-heavy problems;<\/li>\n<li><strong>better accuracy<\/strong> by breaking problems into steps;<\/li>\n<li><strong>enhanced explainability<\/strong> (trust and transparency).<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Variants<\/div><div class=\"kv\"><ul>\n<li><strong>Self-consistency:<\/strong> generate several solutions and choose the most consistent.<\/li>\n<li><strong>Active-prompting:<\/strong> the LLM asks <strong>clarifying questions<\/strong> or requests more information.<\/li>\n<li><strong>Multimodal CoT:<\/strong> combine text with images or video.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Applications<\/div><div class=\"kv\"><ul>\n<li>complex reasoning (math word problems, logic puzzles);<\/li>\n<li><strong>explanation generation<\/strong>;<\/li>\n<li><strong>multi-step planning<\/strong> (a story, a trip, debugging code).<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Choosing","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Choosing<\/h2><div class=\"bi\"><ul>\n<li><strong>CoT = internal reasoning. ReAct = external interaction<\/strong> (gather information, take actions).<\/li>\n<li>They can be <strong>combined<\/strong> for deep reasoning plus dynamic interaction. Many other frameworks exist; choose per use case.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check (my answer key)<\/h2><div class=\"bi\"><div class=\"tw rtable\"><table>\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th>Technique<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Find a highly rated Italian restaurant near the current location<\/td>\n<td><strong>ReAct<\/strong> (needs external search and location)<\/td>\n<\/tr>\n<tr>\n<td>Summarise a long article on AI history<\/td>\n<td><strong>CoT<\/strong> (internal reasoning on the given text)<\/td>\n<\/tr>\n<tr>\n<td>Brainstorm new product ideas<\/td>\n<td><strong>CoT<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Search for research papers on a topic<\/td>\n<td><strong>ReAct<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The course lists explainability as a CoT benefit, and the exam may too. Caveat: visible reasoning steps aren't a guaranteed account of how the model actually reached its answer.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.8","title":"Adding in tooling","kind":"concept","html":"","videos":["PrsNiWteqEs"],"steps":[{"title":"Video · Four types of agent tools (exam core)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Video<\/h2><div class=\"bi\"><ul>\n<li>A model plus reasoning logic <strong>can't act in the real world by itself<\/strong>.<\/li>\n<li><strong>Tools are the bridge<\/strong> between the agent and the real world. They broaden tasks and improve accuracy and reliability.<\/li>\n<li>Examples: adjust smart-home settings, update calendars, fetch user information from a database, send emails.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Four types of agent tools (exam core)<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Extensions (APIs)<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Definition<\/div><div class=\"kv\">Bridge agent ↔ <strong>external APIs<\/strong> (rule sets for how software interacts) in a <strong>standardised way<\/strong>, whatever the API's design<\/div><\/div><div class=\"kf\"><div class=\"kl\">Example from the course<\/div><div class=\"kv\">A travel agent uses an extension for a travel company's API to find and book flights<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Functions<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Definition<\/div><div class=\"kv\"><strong>Specific actions<\/strong> the agent can perform. The reasoning system picks the right one. Encapsulate logic; reusable<\/div><\/div><div class=\"kf\"><div class=\"kl\">Example from the course<\/div><div class=\"kv\"><code>calculate_price(flight details, passenger info)<\/code> → total cost<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Data stores<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Definition<\/div><div class=\"kv\"><strong>Access to information<\/strong>: real-time, historical, knowledge bases. Keep answers accurate, relevant, current<\/div><\/div><div class=\"kf\"><div class=\"kl\">Example from the course<\/div><div class=\"kv\">Weather, stock prices, a customer database<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Plugins<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Definition<\/div><div class=\"kv\"><strong>Add new skills or integrations<\/strong>: specific services, specialised tools, platforms<\/div><\/div><div class=\"kf\"><div class=\"kl\">Example from the course<\/div><div class=\"kv\">A calendar plugin to schedule; a <strong>payment-gateway<\/strong> plugin to process transactions<\/div><\/div><\/div><\/div><p><strong>Matching quiz:<\/strong>\n- connect to external services via APIs → <strong>Extensions<\/strong>;\n- define specific actions → <strong>Functions<\/strong>;\n- access information → <strong>Data stores<\/strong>;\n- add new skills and integrations → <strong>Plugins<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"How the reasoning loop uses tools (ReAct cycle) · Worked example: scheduling a garden consultation","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>How the reasoning loop uses tools (ReAct cycle)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Reasoning (tool selection)<\/div><div class=\"kv\">analyse the task and pick from the available extensions, functions and data stores.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Acting (tool execution)<\/div><div class=\"kv\">call the API, function or query with the needed inputs.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Observation<\/div><div class=\"kv\">the tool output becomes the observation.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Iteration<\/div><div class=\"kv\">reason about next steps, perhaps different tools or more information. Repeat until done.<\/div><\/div><\/li><\/ol><\/div><\/section><section class=\"blk sec\"><h2>Worked example: scheduling a garden consultation<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Reasoning<\/div><div class=\"kv\">pick the <strong>scheduling plugin<\/strong> linked to the gardener's calendar.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Acting<\/div><div class=\"kv\">check next week's availability (30 minutes, weekdays). Pull the client's name and contact from the <strong>customer database (data store)<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Observation<\/div><div class=\"kv\">a list of open slots.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Iteration<\/div><div class=\"kv\"><ul>\n<li>Offer the slots. If the client's choice is taken, use a <strong>function<\/strong> to suggest alternatives or a waitlist.<\/li>\n<li>On confirmation, book through the plugin and <strong>email both parties<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Tooling lets agents <strong>act<\/strong>: databases, purchases, social media, smart home, scheduling, travel booking.<\/p><\/div><\/section><\/div>"}]},{"id":"5.9","title":"Google's agent tooling","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · Options","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Partial gap:<\/strong> the \"Meeting location planner\" click-through only exposed step 1 (Document AI) in the extracted text. Later steps (location analysis with the Google Maps API, recommendation) are implied by the scenario description.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>Options<\/h2><div class=\"bi\"><ul>\n<li>Custom-build tools, use <strong>third-party<\/strong> tools, or use <strong>Google Cloud<\/strong>.<\/li>\n<li>Many Google Cloud tools work <strong>even if the core agent logic is built outside Google Cloud<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Key Google Cloud services for agent tooling","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Key Google Cloud services for agent tooling<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Service<\/div><div class=\"kt\"><strong>Cloud Storage<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Use as a tool<\/div><div class=\"kv\">Highly scalable, durable <strong>object storage<\/strong> for the data agents need<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Service<\/div><div class=\"kt\"><strong>Databases: Cloud SQL, Spanner, Firestore<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Use as a tool<\/div><div class=\"kv\">Store and retrieve information, user data, track agent progress<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Service<\/div><div class=\"kt\"><strong>Cloud Run functions<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Use as a tool<\/div><div class=\"kv\"><strong>Serverless functions<\/strong> as specialised tools: connect to databases, call external APIs, do calculations. Triggered by the agent, <strong>auto-scale<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Service<\/div><div class=\"kt\"><strong>Cloud Run<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Use as a tool<\/div><div class=\"kv\"><strong>Serverless platform for stateless containers<\/strong>, for complex custom tools with specific dependencies or more control<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Service<\/div><div class=\"kt\"><strong>Agent Platform<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Use as a tool<\/div><div class=\"kv\"><strong>Agents can use other agents as tools.<\/strong> Create models or agents that other agents call<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Pre-built AI APIs","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Pre-built AI APIs<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Speech-to-Text<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\">Speech → text (meetings, support calls, video)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Text-to-Speech<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\">Text → natural speech (voice UIs, personalised communication)<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Translation<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\">Text, documents, websites, even audio and video, into <strong>135+ languages<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Document Translation<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\">Translates formatted documents <strong>keeping the layout<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Document AI<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\"><strong>Extract data<\/strong> from documents (invoices, contracts, medical records); automate capture and processing; can <strong>summarise large documents with gen AI<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Cloud Vision<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\">Detect objects, faces, landmarks; <strong>OCR<\/strong>. Image tagging, content moderation, visual search<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Cloud Video Intelligence<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\">Find objects, actions and events in video; transcribe speech. Recommendations, video search, media analysis<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Natural Language<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\"><strong>Sentiment<\/strong>, content classification, <strong>entity extraction<\/strong> (people, places, events); multilingual<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">API<\/div><div class=\"kt\"><strong>Other<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Capability<\/div><div class=\"kv\">The <strong>API Library<\/strong>: Google Maps, Workspace, YouTube, Google Photos and more<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Example: meeting location planner","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Example: meeting location planner<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Scenario<\/div><div class=\"kv\">a user uploads a meeting invitation or a list of venues and asks for the most convenient location.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Flow<\/div><div class=\"kv\"><ol>\n<li><strong>Document AI<\/strong> extracts the addresses.<\/li>\n<li>The <strong>Google Maps API<\/strong> analyses the locations.<\/li>\n<li>The agent recommends a venue from <strong>unstructured data<\/strong>.<\/li>\n<\/ol><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p><strong>Orchestrate multiple tools<\/strong> (Cloud Run functions, databases, pre-built APIs such as Document AI and Maps) for complex multi-step tasks.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The exam guide says <strong>Cloud Functions<\/strong>; the current product name is <strong>Cloud Run functions<\/strong>. The guide's tooling list also includes the <strong>Google Cloud API Library<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.10","title":"Building applications from your agents","kind":"concept","html":"","videos":["fDrkLfQ8KHk"],"steps":[{"title":"From prototype to app (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>From prototype to app (video)<\/h2><div class=\"bi\"><ul>\n<li>After tuning prompts and parameters in AI Studio or Agent Studio, you integrate the model into your own apps.<\/li>\n<li><strong>Credentials:<\/strong><ul>\n<li><strong>Google AI Studio<\/strong> → generate an <strong>API key<\/strong>.<\/li>\n<li><strong>Agent Studio<\/strong> → set up <strong>authentication and authorisation<\/strong> (Google Cloud).<\/li>\n<\/ul>\n<\/li>\n<li>Analogy: a <strong>backstage pass<\/strong>. Proper authorisation gives secure, controlled access.<\/li>\n<li>Then your code makes <strong>API calls<\/strong> that send the <strong>prompt plus parameters<\/strong> and receive generated output.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Where to run it","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Where to run it<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Option<\/div><div class=\"kt\"><strong>Cloud Run functions<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What<\/div><div class=\"kv\">Small pieces of code in the cloud, <strong>triggered by events<\/strong> (image upload, new message). <strong>No servers to manage<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Example<\/div><div class=\"kv\">Auto-caption uploaded images with Gemini<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Option<\/div><div class=\"kt\"><strong>Cloud Run<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What<\/div><div class=\"kv\">Runs apps in <strong>containers<\/strong> (self-contained packages with everything needed). Easy deploy and scale; suits complex apps needing specific software or configuration<\/div><\/div><div class=\"kf\"><div class=\"kl\">Example<\/div><div class=\"kv\">Host a web app with a Gemini-powered chatbot<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Option<\/div><div class=\"kt\"><strong>Anything that can make HTTP requests<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What<\/div><div class=\"kv\">Web, mobile, desktop, even <strong>embedded systems<\/strong><\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"No-code / low-code · Multi-agent applications","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>No-code / low-code<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Apps Script<\/div><div class=\"kv\">a cloud platform for <strong>automating Google Workspace<\/strong> with JavaScript plus built-in services. Use the Gemini API to build <strong>Workspace add-ons<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">AppSheet<\/div><div class=\"kv\">a <strong>no-code<\/strong> platform for custom business apps. Extend it with Apps Script or APIs; with the Gemini API you can automate tasks, generate content, add assistance inside the app.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>Multi-agent applications<\/h2><div class=\"bi\"><ul>\n<li>Several <strong>specialised agents<\/strong> together make the app more efficient and capable. They work independently or interact.<ul>\n<li>Example: a travel app with a flights agent, a hotels agent and an attractions agent.<\/li>\n<\/ul>\n<\/li>\n<li>Benefits: <strong>modular → efficiency, flexibility, scalability<\/strong>.<\/li>\n<li><strong>An agent can be a tool of another agent.<\/strong> E.g. a <strong>sentiment-analysis agent<\/strong> used by a <strong>customer-service agent<\/strong> to gauge satisfaction.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Integrate via <strong>APIs, Cloud Run functions, Cloud Run, Apps Script, AppSheet<\/strong>. Use <strong>multi-agent systems<\/strong> for complex apps.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>Exam name: <strong>Cloud Functions<\/strong> (current name Cloud Run functions).<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.11","title":"RAG and tooling","kind":"concept","html":"","videos":["-K51wRmeiKg"],"steps":[{"title":"Overview · Before RAG","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Partial gap:<\/strong> the \"Answering a question about a recent event\" click-through example only exposed its step labels (User query, Iteration).<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>Before RAG<\/h2><div class=\"bi\"><ul>\n<li>Models were <strong>static knowledge bases<\/strong>, limited to their training data, and updating them needed <strong>retraining or fine-tuning<\/strong>. Results could be <strong>outdated, irrelevant or not company-specific<\/strong>.<\/li>\n<li>Pre-RAG agents could <strong>fetch<\/strong> information with tools, but used it <strong>only for the immediate query<\/strong>. They couldn't process and integrate it.<\/li>\n<li><strong>RAG<\/strong> lets models <strong>retrieve and use tool-provided data<\/strong>. To make a real difference, your agent should work from <strong>your company's data<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"How RAG works with tools (after the user query)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>How RAG works with tools (after the user query)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Retrieval<\/div><div class=\"kv\">the LLM uses retrieval tools to find relevant documents or passages.<ul>\n<li><strong>Data stores:<\/strong> internal databases, structured and unstructured.<\/li>\n<li><strong>Vector databases:<\/strong> store <strong>embeddings<\/strong> (numerical representations of text). The query is embedded and matched to <strong>semantically similar<\/strong> content.<\/li>\n<li><strong>Search engines<\/strong> (via extensions or APIs): web pages, articles.<\/li>\n<li><strong>Knowledge graphs:<\/strong> structured stores of <strong>entities and relationships<\/strong>, queried for facts.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Augmentation<\/div><div class=\"kv\">the retrieved context is <strong>added to the prompt<\/strong> with the original query.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Generation<\/div><div class=\"kv\">the LLM answers from the augmented prompt, more informed and accurate, and can <strong>cite sources<\/strong> (transparency, trust).<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Iteration<\/div><div class=\"kv\">(in some systems): refine the query, try other retrieval tools, or ask the user <strong>clarifying questions<\/strong>.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Data stores in AI Applications","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Data stores in AI Applications<\/h2><div class=\"bi\"><ul>\n<li>Knowledge bases your agent draws on. Options:<ul>\n<li><strong>Websites:<\/strong> current events or public information.<\/li>\n<li><strong>Structured data:<\/strong> tables or <strong>JSON<\/strong> (product catalogues, customer databases, internal KBs). Agent Platform can <strong>auto-detect<\/strong> the structure, or you define it.<\/li>\n<li><strong>Unstructured data:<\/strong> <strong>HTML, PDF, DOCX<\/strong> files.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Fetch relevant documents for a query<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Retrieval<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Add context from the knowledge base to the query<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Augmentation<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Produce the natural-language answer<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Generation<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>Exam guide's RAG offerings: <strong>pre-built RAG with Agent Search<\/strong> (managed, fastest) and <strong>RAG APIs<\/strong> (building blocks for a custom pipeline when you need more control).<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.12","title":"Try it: RAG in action","kind":"usecase","html":"","videos":[],"steps":[{"title":"Lab steps (Google AI Studio)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Lab steps (Google AI Studio)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\">Log in to Google AI Studio and select <strong>Try Gemini<\/strong>.<\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">In <strong>Run settings<\/strong>, select the model <strong>Gemini 2.5 Flash<\/strong>.<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\">Prompt something time-sensitive, e.g. \"What are the latest trends in generative AI?\", then <strong>Run<\/strong>.<\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Run settings → Tools →<\/div><div class=\"kv\">toggle <strong>Grounding using Google Search<\/strong>. Rerun the same prompt.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\">Compare the two answers. The grounded one should be <strong>more current and relevant<\/strong>, with sources.<\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p><strong>Grounding with Google Search<\/strong> (RAG on real-time web data) makes answers <strong>more accurate and up to date<\/strong> than training data alone.<\/p><\/div><\/section><\/div>"}]},{"id":"5.13","title":"The power of search agents","kind":"concept","html":"","videos":["qwqqR0pb-d4"],"steps":[{"title":"Why search matters (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Why search matters (video)<\/h2><div class=\"bi\"><ul>\n<li>Search is <strong>the primary way we navigate the digital world<\/strong>.<\/li>\n<li>Bad search hurts: customers can't find products, employees waste time in internal docs, customers move to competitors.<\/li>\n<li><strong>Good search = relevance and speed<\/strong>, plus understanding <strong>what we mean, not just what we say<\/strong>.<\/li>\n<li>Google's mission (\"organise the world's information…\") applied to a <strong>business's own information<\/strong>: \"a personal Google Search for your company\".<\/li>\n<li><strong>Agent Platform Search<\/strong> combines <strong>information retrieval + natural language processing + LLMs<\/strong> to understand poorly phrased queries.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Search solutions","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agent Search on Gemini Enterprise Agent Platform: two families<\/h2><h3>Search solutions<\/h3><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">General search<\/div><div class=\"kv\">for your <strong>public website<\/strong>. Indexes <strong>structured data in BigQuery<\/strong> and <strong>unstructured documents in Cloud Storage<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Specialised variants<\/div><div class=\"kv\">| Variant | Best for |\n  |---|---|\n  | <strong>Document search<\/strong> | Large repositories of <strong>unstructured, text-heavy<\/strong> documents in Cloud Storage (knowledge bases, archives) |\n  | <strong>Media search<\/strong> | <strong>Images, video, audio<\/strong>: find assets by content, metadata or spoken words |\n  | <strong>Healthcare search<\/strong> | Healthcare data with <strong>regulatory compliance<\/strong> support (records, research, guidelines) |\n  | <strong>Search for commerce<\/strong> | <strong>Retail catalogue<\/strong> search: product discovery, attributes, complex product queries |<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recommendation solutions · How Agent Search works","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agent Search on Gemini Enterprise Agent Platform: two families<\/h2><h3>Recommendation solutions<\/h3><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">General recommendations<\/div><div class=\"kv\">similar content across websites, documents and structured content, based on <strong>user behaviour + content attributes<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Media recommendations<\/div><div class=\"kv\">streaming audio and video, digital publishing.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Retail recommendations<\/div><div class=\"kv\">personalised products from <strong>browsing history, purchase data, product attributes<\/strong>.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>How Agent Search works<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kv\">Built on <strong>intelligent data connection + grounding + gen AI<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">It acts <strong>as an agent<\/strong>: observes the query or context (the environment) and acts by retrieving or recommending, with <strong>data stores as tools<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Key strength<\/div><div class=\"kv\">grounds LLM responses in:<ul>\n<li><strong>first-party data<\/strong>;<\/li>\n<li><strong>curated third-party data<\/strong>;<\/li>\n<li><strong>Google's knowledge graph (Grounding with Google Search)<\/strong>.\n  This minimises hallucinations. <strong>This is a RAG approach.<\/strong><\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Extra gen AI features<\/div><div class=\"kv\"><ul>\n<li><strong>Search summaries:<\/strong> a document overview, a product comparison, a synthesis of findings.<\/li>\n<li><strong>Answers and follow-ups:<\/strong> AI-generated answers to natural-language questions, with follow-up questions.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Built for enterprise<\/div><div class=\"kv\"><ul>\n<li><strong>granular access controls<\/strong>;<\/li>\n<li><strong>advanced analytics<\/strong> on search trends and behaviour;<\/li>\n<li><strong>scalable infrastructure<\/strong>;<\/li>\n<li>integration through <strong>APIs and SDKs<\/strong>, for customer-facing or internal search.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Agent Search helps customers and employees <strong>find, understand and decide faster<\/strong>.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The course says Agent Search 'acts as an agent'. Mainly it is managed enterprise search, retrieval and RAG that apps and agents use.<\/li>\n<li>The exam guide groups <strong>Agent Search<\/strong> and <strong>Google Search<\/strong> as Google Cloud's external search offerings.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.14","title":"Use case: Enhancing the shopping experience with Agent Search","kind":"usecase","html":"","videos":["OJUPgiOPuRc"],"steps":[{"title":"Problem · Solution: Agent Search for commerce","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Problem<\/h2><div class=\"bi\"><ul>\n<li>Customers struggled to find items and <strong>abandoned searches<\/strong>.<\/li>\n<li><strong>Keyword search<\/strong> missed intent: shoppers use vague words and describe visual traits.<\/li>\n<li>Online search needed to replicate a <strong>store associate<\/strong> who understands what you mean without the exact product name.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Solution: Agent Search for commerce<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Semantic understanding<\/div><div class=\"kv\">synonyms, related terms, <strong>misspellings<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">AI-powered image search<\/div><div class=\"kv\">upload a photo (an old favourite, something seen on social media) and get <strong>visually similar<\/strong> catalogue items.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Retail recommendations<\/div><div class=\"kv\">personalised suggestions learned from purchases, browsing and queries.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Results (qualitative)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Results (qualitative)<\/h2><div class=\"bi\"><div class=\"chips\"><span class=\"chip\">Easier discovery → <strong>more purchases<\/strong>.<\/span><span class=\"chip\"><strong>Happier, more loyal<\/strong> customers.<\/span><span class=\"chip\">More exploration and <strong>time on site<\/strong>.<\/span><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Feature that helped customers find products they <strong>couldn't describe in words<\/strong><\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>AI-powered image search<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"5.15","title":"Gen AI for customer engagement (Gemini Enterprise for CX)","kind":"concept","html":"","videos":[],"steps":[{"title":"Context · Gemini Enterprise for Customer Experience (CX)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Context<\/h2><div class=\"bi\"><ul>\n<li>Customers often don't want to search. They want to <strong>contact the company directly<\/strong>.<\/li>\n<li>These touchpoints can be pain points but are <strong>critical connections<\/strong>. Engagement quality can make or break a company.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Gemini Enterprise for Customer Experience (CX)<\/h2><div class=\"bi\"><ul>\n<li>An <strong>agentic solution<\/strong> bringing <strong>shopping and customer service together in one intelligent interface<\/strong>.<\/li>\n<li>Built on <strong>Gemini multimodal models<\/strong>: complex reasoning to understand <strong>intent<\/strong> and do <strong>multi-step tasks<\/strong>.<\/li>\n<li><strong>Components:<\/strong><ol>\n<li><strong>Customer Experience (CX) agents:<\/strong> customer-facing chatbots, now proactive <strong>\"digital concierges\"<\/strong>.<\/li>\n<li><strong>Agent Assist:<\/strong> supports <strong>live human<\/strong> contact-centre agents.<\/li>\n<li><strong>Customer Experience Insights (CX Insights):<\/strong> insight across all customer conversations (bot or human).<\/li>\n<li>All built on <strong>Contact Center as a Service (CCaaS)<\/strong>: an enterprise-grade, <strong>cloud-native<\/strong> contact-centre foundation.<\/li>\n<\/ol>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"CX Agent Studio: three build approaches","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>CX Agent Studio: three build approaches<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Approach<\/div><div class=\"kt\"><strong>Deterministic<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\"><strong>Rule-based<\/strong> (\"if the user selects X, buy product Y\"). Every action explicitly defined. <strong>Low-to-medium code<\/strong>. <strong>Maximum predictability<\/strong> for sensitive transactions<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Approach<\/div><div class=\"kt\"><strong>Generative<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">Powered by <strong>Gemini multimodal models<\/strong>. Understands intent from <strong>text, images, voice<\/strong>. Natural, human-like flow. Chooses the best path from instructions plus <strong>grounded data<\/strong>. Mostly <strong>natural-language prompting, little or no code<\/strong><\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Approach<\/div><div class=\"kt\"><strong>Hybrid<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Description<\/div><div class=\"kv\">Combines both: <strong>deterministic control for compliance and security<\/strong> plus <strong>generative flexibility<\/strong> for nuance<\/div><\/div><\/div><\/div><ul>\n<li>Hybrid agents <strong>take actions<\/strong> (e.g. <strong>process a refund, schedule a delivery<\/strong>), not just talk.<\/li>\n<li>Build options: <strong>rapid deployment with natural-language instructions<\/strong>, or <strong>sophisticated hybrid workflows<\/strong> with custom rules and enterprise logic.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Agent Assist (for human agents) · CX Insights","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agent Assist (for human agents)<\/h2><div class=\"bi\"><ul>\n<li>Why: human agents vary in experience, and onboarding needs lots of training.<\/li>\n<li>In-the-moment help:<ul>\n<li><strong>recommended responses<\/strong>;<\/li>\n<li><strong>suggested knowledge-base content<\/strong>;<\/li>\n<li><strong>real-time transcription and translation<\/strong>;<\/li>\n<li><strong>conversation summaries<\/strong>;<\/li>\n<li><strong>real-time coaching<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>CX Insights<\/h2><div class=\"bi\"><ul>\n<li>Analyses conversational data <strong>across the customer journey<\/strong> for contact-centre leaders: efficiency, agent performance, customer experience.<\/li>\n<li>Signals:<ul>\n<li><strong>agent and caller sentiment<\/strong>;<\/li>\n<li><strong>entity identification<\/strong>;<\/li>\n<li><strong>call topics<\/strong>;<\/li>\n<li>auto-flags interactions for review;<\/li>\n<li><strong>automatic scoring with conditional scorecards<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Generative FAQ in Insights:<\/strong> shows common customer questions and how they're answered, to find <strong>FAQ gaps<\/strong>, track trends, improve responses.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"CCaaS","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>CCaaS<\/h2><div class=\"bi\"><ul>\n<li>Contact centres need <strong>24/7, multichannel<\/strong> (phone, text, email…) operation with security and privacy.<\/li>\n<li>CCaaS:<ul>\n<li>manages infrastructure;<\/li>\n<li><strong>integrates with CRMs<\/strong>;<\/li>\n<li>offers <strong>omnichannel<\/strong> support (consistent across web, apps, phone, text);<\/li>\n<li>handles simultaneous channels, <strong>channel switching<\/strong>, <strong>multimodal<\/strong> interactions, and <strong>agent routing<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li>Integrates with CX agents, Agent Assist and CX Insights.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check (answer key)<\/h2><div class=\"bi\"><div class=\"tw rtable\"><table>\n<thead>\n<tr>\n<th>Feature<\/th>\n<th>Tool<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Combines deterministic and generative<\/td>\n<td><strong>CX Agent Studio<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Supports live human agents<\/td>\n<td><strong>Agent Assist<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Analyses customer sentiment<\/td>\n<td><strong>CX Insights<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Omnichannel support<\/td>\n<td><strong>CCaaS<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>Exam guide names: <strong>Customer Engagement Suite<\/strong> = course's Gemini Enterprise for CX. Components: <strong>Conversational Agents<\/strong> (course: CX agents / CX Agent Studio), <strong>Agent Assist<\/strong>, <strong>Conversational Insights<\/strong> (course: CX Insights), <strong>Google Cloud Contact Center as a Service<\/strong> (CCaaS).<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.16","title":"Use case: Customer Experience Agent Studio (Cymbal Taxes)","kind":"usecase","html":"","videos":["aN3SVuF6p3g"],"steps":[{"title":"Problem · Solution","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Problem<\/h2><div class=\"bi\"><ul>\n<li><strong>Cymbal Taxes<\/strong>, a fast-growing online tax-prep service, couldn't keep up with the <strong>volume of inquiries in tax season<\/strong>. It needed <strong>instant, personalised, 24/7<\/strong> support.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Solution<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kv\">With <strong>Gemini Enterprise for CX → CX Agent Studio<\/strong>, they built an <strong>Agentic Tax Assistant<\/strong> for web and app:<ul>\n<li><strong>natural-language instructions<\/strong>;<\/li>\n<li>plus a <strong>data store tool<\/strong> (tax laws, FAQs, customer data).<\/li>\n<\/ul>\n<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Capabilities<\/div><div class=\"kv\"><ul>\n<li>answer questions about specific tax forms;<\/li>\n<li><strong>personalised advice<\/strong> for the user's situation;<\/li>\n<li>help with <strong>filing and payment<\/strong>.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Sample dialogue (summarised)<\/div><div class=\"kv\"><ul>\n<li>The assistant checks home-office deduction eligibility by asking clarifying questions (exclusive use, % of home, self-employed vs employee), confirms eligibility, and offers to walk through the claim.<\/li>\n<li>It also gives filing deadlines: federal <strong>April 15<\/strong>; extension to <strong>October 15<\/strong>. An extension covers filing, not payment.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Results (memorise)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Results (memorise)<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">NPS +15 points<\/div><div class=\"kv\">.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Call volume −20%<\/div><div class=\"kv\">.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Email inquiries −30%<\/div><div class=\"kv\">.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Staff refocused on complex work (<strong>audits, complaints<\/strong>). Better engagement and retention.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Primary challenge solved<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>keeping up with high inquiry volume in tax season<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>CX agents combining <strong>generative playbooks<\/strong> with the company's <strong>data stores<\/strong> give accurate, instant answers and measurable business results.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>Exam name for the product used here: <strong>Conversational Agents<\/strong> (part of the Customer Engagement Suite).<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.17","title":"Build your own agent","kind":"lab","html":"","videos":[],"steps":[{"title":"Agent instructions in CX Agent Studio · Lab: Cymbal Manufacturing chatbot (built in Google AI Studio)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agent instructions in CX Agent Studio<\/h2><div class=\"bi\"><ul>\n<li>Define the agent's <strong>goal<\/strong> (support, Q&amp;A, creative content), <strong>how it should act<\/strong>, and <strong>rules<\/strong> to follow.<\/li>\n<li>Add <strong>tools<\/strong> such as <strong>data stores<\/strong>.<\/li>\n<li>Then <strong>test and interact<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Lab: Cymbal Manufacturing chatbot (built in Google AI Studio)<\/h2><div class=\"bi\"><ul>\n<li><strong>Why AI Studio here:<\/strong><ul>\n<li><strong>CX Agent Studio would normally be recommended<\/strong> for a customer chatbot, but it needs a Google Cloud account and project.<\/li>\n<li>AI Studio teaches the concepts without infrastructure.<\/li>\n<li>For production-grade agents (e.g. <strong>adversarial defence<\/strong>), use CX Agent Studio.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"System instructions · Steps","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Lab: Cymbal Manufacturing chatbot (built in Google AI Studio)<\/h2><h3>System instructions<\/h3><div class=\"bi\"><p>Provide <strong>context, persona and constraints before any user input<\/strong>. Four benefits:\n1. <strong>Consistency:<\/strong> stable tone and persona.\n2. <strong>Accuracy:<\/strong> grounded in specific knowledge, fewer hallucinations.\n3. <strong>Relevance:<\/strong> stays in the intended domain.\n4. <strong>Safety:<\/strong> avoids inappropriate or unhelpful output.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Steps<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Set up<\/div><div class=\"kv\"><ul>\n<li>aistudio.google.com → <strong>Chat with models<\/strong> → Run settings → model <strong>Gemini 2.5 Flash<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Create an \"Agent instruction writer\"<\/div><div class=\"kv\"><ul>\n<li><strong>Enable saving<\/strong> (grant Google Drive access).<\/li>\n<li>Open <strong>System instructions<\/strong> and create one titled \"Agent instruction writer\".<\/li>\n<li>Its content: a persona that is an expert at building virtual assistants and writes a system prompt (goal plus instructions) for a given company and role.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Generate the chatbot's system prompt<\/div><div class=\"kv\"><ul>\n<li>Give the writer the use case:<ul>\n<li>Cymbal mainly builds <strong>storage containers<\/strong>, and also does <strong>custom machining<\/strong> on request (users must <strong>call the company<\/strong>).<\/li>\n<li>Answer reasonable container questions <strong>without over-guessing<\/strong>.<\/li>\n<li>Containers are usually <strong>blue or green<\/strong>, occasionally <strong>red<\/st
