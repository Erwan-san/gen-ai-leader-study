<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gen AI Leader Study Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: study desk — sticky top bar with 3 views (Course tree · Flashcards · Progress); single readable column ≤ 760px for lessons, wider grid for tree/stats. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --sunk:#eceee9; --fg:#1b1f1d; --muted:#5d6661; --line:#d9ddd6;
  --accent:#0d6b5f; --accent-ink:#ffffff; --accent-soft:#dcefe9;
  --good:#1f7a3a; --warn:#a15c00; --bad:#b3261e; --info:#2f5aa8;
  --good-soft:#e1f2e5; --warn-soft:#fbecd5; --bad-soft:#f8e1df; --info-soft:#e3eaf7;
  --display:"Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read:"Newsreader", Georgia, "Times New Roman", serif;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121614; --surface:#1a1f1d; --sunk:#222826; --fg:#e7ebe8; --muted:#9aa49f; --line:#323a36;
  --accent:#4cc3ad; --accent-ink:#06201b; --accent-soft:#173a33;
  --good:#6fd08a; --warn:#f0b35a; --bad:#ff8a80; --info:#8fb0ff;
  --good-soft:#18301f; --warn-soft:#3a2a12; --bad-soft:#3c1d1a; --info-soft:#1b2640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121614; --surface:#1a1f1d; --sunk:#222826; --fg:#e7ebe8; --muted:#9aa49f; --line:#323a36;
  --accent:#4cc3ad; --accent-ink:#06201b; --accent-soft:#173a33;
  --good:#6fd08a; --warn:#f0b35a; --bad:#ff8a80; --info:#8fb0ff;
  --good-soft:#18301f; --warn-soft:#3a2a12; --bad-soft:#3c1d1a; --info-soft:#1b2640; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--display);font-size:15px;line-height:1.5}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.01em;font-size:16px;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--mono);font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.04em}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
nav.tabs button{border:0;background:transparent;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted)}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.sync{font-family:var(--mono);font-size:11px;color:var(--muted)}
.banner{margin-top:14px;padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--fg);font-size:13px}
h1,h2,h3{text-wrap:balance;letter-spacing:-.015em;margin:0}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.v{background:var(--info-soft);color:var(--info)}
.pill.uc{background:var(--warn-soft);color:var(--warn)}
.pill.lab{background:var(--good-soft);color:var(--good)}
.bar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
/* overview */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;padding-block:28px 18px}
.hero h1{font-size:clamp(24px,4vw,34px);font-weight:800}
.hero p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums;font-weight:700}
.stat span{font-size:12px;color:var(--muted)}
.course{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-top:14px;overflow:hidden}
.chead{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.cnum{font-family:var(--mono);font-size:12px;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.ctitle{min-width:0}
.ctitle h2{font-size:16px;font-weight:700}
.ctitle .bar{margin-top:8px;max-width:340px}
.cmeta{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{transition:transform .2s;color:var(--muted)}
.course.open .chev{transform:rotate(90deg)}
.lessons{border-top:1px solid var(--line);display:none}
.course.open .lessons{display:block}
.ctools{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--sunk)}
.ctools .btn{padding:5px 10px;font-size:12px}
.lrow{display:grid;grid-template-columns:28px 46px 1fr auto;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--sunk)}
.lrow .lid{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lrow a{color:var(--fg);text-decoration:none;font-weight:500;min-width:0}
.lrow a:hover{color:var(--accent);text-decoration:underline}
.lrow.seen a{color:var(--muted)}
.lbadges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chk{appearance:none;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:5px;display:grid;place-items:center;cursor:pointer;margin:0;background:var(--surface)}
.chk:checked{background:var(--accent);border-color:var(--accent)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
/* lesson */
.lesson{max-width:880px;margin:0 auto;padding-block:20px}
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;font-weight:600}
.lesson h1{font-size:clamp(24px,4vw,32px);font-weight:800;margin-top:10px}
.lmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.videos{margin-top:18px;display:flex;flex-direction:column;gap:8px}
.vcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--fg)}
.vcard:hover{border-color:var(--accent)}
.vplay{flex:none;width:40px;height:40px;border-radius:50%;background:var(--bad);display:grid;place-items:center}
.vplay::after{content:"";border-left:13px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.vcard b{display:block;font-size:14px}
.vcard span{font-size:12px;color:var(--muted)}
.notes{margin-top:26px;display:flex;flex-direction:column;gap:18px}
.blk{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px}
.blk>h2{font-size:17px;font-weight:700;margin:0 0 12px;display:flex;align-items:center;gap:10px}
.blk.sec>h2::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg);flex:none}
.bi{display:flex;flex-direction:column;gap:12px;font-size:15.5px;line-height:1.6;overflow-wrap:anywhere}
.bi>p{margin:0;font-family:var(--read);font-size:18px;line-height:1.6}
.bi strong{font-weight:650}
.bi ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.bi ul>li{position:relative;padding-left:20px}
.bi ul>li::before{content:"";position:absolute;left:3px;top:.62em;width:7px;height:7px;border-radius:50%;border:2px solid var(--accent)}
.bi ul ul{margin-top:6px;gap:5px}
.bi ul ul>li::before{width:5px;height:5px;border:0;background:var(--muted);top:.7em;left:5px}
.bi ol:not(.steps){padding-left:22px;margin:0;display:flex;flex-direction:column;gap:6px}
.cards{display:grid;gap:12px}
.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kcard{background:var(--sunk);border-radius:12px;padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;min-width:0;border:1px solid transparent;transition:border-color .15s,transform .15s}
.kcard:hover{border-color:var(--accent);transform:translateY(-1px)}
.kt{font-weight:750;font-size:15.5px;letter-spacing:-.01em;color:var(--fg)}
.kt strong{font-weight:inherit}
.kcard:nth-child(6n+1) .kt{color:var(--accent)}
.kf{display:flex;flex-direction:column;gap:2px}
.kl{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kv{font-size:14.5px;line-height:1.55;min-width:0;overflow-wrap:anywhere}
.kv ul{margin-top:4px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px 1fr;gap:12px;position:relative;padding-bottom:14px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::after{content:"";position:absolute;left:16px;top:34px;bottom:2px;width:2px;background:var(--line)}
.sn{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-weight:600;display:grid;place-items:center;font-size:13px}
.sb{padding-top:6px;min-width:0;display:flex;flex-direction:column;gap:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--accent-soft);color:var(--fg);padding:6px 12px;border-radius:999px;font-size:14px}
.blk.takeaway{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.blk.takeaway>h2{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.blk.takeaway .bi>p,.blk.takeaway .bi{font-family:var(--read);font-size:19px;color:var(--accent-ink)}
.blk.takeaway .bi ul>li::before{border-color:var(--accent-ink)}
.blk.exam{background:var(--info-soft);border-color:transparent}
.blk.exam>h2{color:var(--info)}
.blk.exam>h2::before{content:"★";font-size:14px}
details.blk.check{padding:0;overflow:hidden}
details.blk.check summary{cursor:pointer;list-style:none;padding:16px 20px;font-weight:700;display:flex;align-items:center;gap:10px}
details.blk.check summary::-webkit-details-marker{display:none}
details.blk.check summary::before{content:"?";width:26px;height:26px;border-radius:8px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;font-family:var(--mono)}
details.blk.check summary::after{content:"Show answers";margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
details.blk.check[open] summary::after{content:"Hide"}
details.blk.check .bi{padding:0 20px 18px}
.note{margin:0;padding:12px 14px;border-radius:12px;background:var(--warn-soft);font-size:14px}
.note p{margin:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.notes table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.45}
.notes th,.notes td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.notes th{background:var(--sunk);font-weight:700;font-size:12px;letter-spacing:.02em}
.notes td:first-child{font-weight:600}
.notes tr:last-child td{border-bottom:0}
.notes code{font-family:var(--mono);font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:4px}
/* video */
.player{margin-top:18px;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--line)}
.player .frame{position:relative;aspect-ratio:16/9;width:100%;max-width:100%}
.player iframe,.player .poster{position:absolute;inset:0;width:100%;height:100%;border:0}
.poster{display:grid;place-items:center;cursor:pointer;background-size:cover;background-position:center;background-color:#111}
.poster::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgb(0 0 0 / .05),rgb(0 0 0 / .45))}
.poster .pb{position:relative;width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 24px rgb(0 0 0 / .35)}
.poster .pb::after{content:"";border-left:22px solid #111;border-top:13px solid transparent;border-bottom:13px solid transparent;margin-left:5px}
.vtabs{display:flex;gap:6px;padding:8px;background:var(--surface);flex-wrap:wrap}
.vtabs button{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer}
.vtabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.vtabs a{margin-left:auto;font-size:12px;color:var(--muted);align-self:center}
@media (max-width:760px){.cards.c2,.cards.c3{grid-template-columns:1fr}.blk{padding:16px}.bi>p{font-size:17px}}
@media (min-width:761px) and (max-width:980px){.cards.c3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lend{margin-top:34px;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lend .msg{margin-right:auto;font-size:14px;min-width:0}
.lnav{display:flex;justify-content:space-between;gap:10px;margin-top:14px;flex-wrap:wrap}
/* flashcards */
.fc-setup{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding-block:24px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.panel h2{font-size:18px;font-weight:700;margin-bottom:4px}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.scopes{display:flex;flex-direction:column;gap:8px}
.scope{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
.scope:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.scope input{accent-color:var(--accent);margin:0}
.scope .n{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scope select{margin-top:6px;width:100%;font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:flex;background:var(--sunk);padding:3px;border-radius:9px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.fieldlbl{font-size:12px;font-weight:600;color:var(--muted);margin:16px 0 6px}
.coverage{display:flex;flex-direction:column;gap:10px}
.covrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px}
.covrow .bar{grid-column:1 / -1}
.covrow b{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
.session{max-width:680px;margin:0 auto;padding-block:22px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.shead .bar{flex:1}
.shead .cnt{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;min-height:300px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 0 var(--line)}
.card .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card .q{font-size:clamp(19px,3vw,23px);font-weight:700;line-height:1.35;letter-spacing:-.01em}
.card .a{font-family:var(--read);font-size:19px;line-height:1.55;border-top:1px dashed var(--line);padding-top:14px}
.card .src{margin-top:auto;font-size:12px;color:var(--muted)}
.card .src button{border:0;background:none;color:var(--accent);padding:0;cursor:pointer;font-weight:600;font-size:12px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rate button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 6px;cursor:pointer;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.rate button span{font-family:var(--mono);font-size:10px;font-weight:400;color:var(--muted)}
.rate .again{color:var(--bad)} .rate .hard{color:var(--warn)} .rate .good{color:var(--good)} .rate .easy{color:var(--info)}
.reveal{margin-top:12px;width:100%;justify-content:center;padding:12px}
.kbd{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;margin-top:10px}
.summary{text-align:center;padding:30px 18px}
.summary h2{font-size:24px;font-weight:800}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.sgrid div{background:var(--sunk);border-radius:var(--r);padding:12px 6px}
.sgrid b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.sgrid span{font-size:12px;color:var(--muted)}
/* progress */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding-block:24px 6px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.tile b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--muted)}
.tile .bar{margin-top:10px}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-top:14px}
table.pt{border-collapse:collapse;width:100%;font-size:13px}
table.pt th,table.pt td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.pt td.num,table.pt th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.pt th{font-size:12px;color:var(--muted);font-weight:600;background:var(--sunk)}
table.pt tr:last-child td{border-bottom:0}
.weak{margin-top:14px}
.weak li{margin:6px 0;font-size:14px}
.danger{margin-top:28px;padding:14px;border:1px dashed var(--line);border-radius:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.danger .btn{font-size:12px;padding:5px 10px}
.empty{padding:20px;text-align:center;color:var(--muted);font-size:14px}
@media (max-width:760px){
  .fc-setup{grid-template-columns:1fr}
  .pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero{grid-template-columns:1fr}
  .lrow{grid-template-columns:26px 40px 1fr;padding:9px 12px}
  .lbadges{grid-column:3;justify-content:flex-start}
  .chead{padding:12px}
  .sgrid{grid-template-columns:repeat(2,1fr)}
  .brand small{display:none}
  .topin{padding-block:8px;gap:8px}
  nav.tabs{order:3;width:100%;justify-content:space-between}
  nav.tabs button{flex:1;padding:6px 6px;font-size:13px}
  .sync{order:2}
}
.exgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}

<script type="application/json" id="data">{"courses":[{"id":"1","title":"Gen AI: Beyond the Chatbot","lessons":[{"id":"1.0","title":"Executive introduction","kind":"video","html":"","videos":["_DMrYuPzUII"],"steps":[{"title":"Overview","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Short executive welcome video that opens the learning path. Watch it on YouTube; there are no separate notes for this one.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"1.1","title":"Introduction to Gen AI: Beyond the Chatbot","kind":"concept","html":"","videos":["R0429riy7wQ"],"steps":[{"title":"Overview · Learning path context","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Video: course creators' welcome (Brett &amp; Erica, curriculum developers). Notes below are a summary, not a transcript.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Learning path context<\/h2><div class=\"bi\"><ul>\n<li>The path prepares you for the <strong>Google Cloud Generative AI Leader<\/strong> certification.<\/li>\n<li>It's for all roles and backgrounds. <strong>No technical experience is required.<\/strong><\/li>\n<li>Course 1 has <strong>no prerequisites<\/strong>. Being signed in to a Google account is recommended so you can use the tools in the activities.<\/li>\n<li>The courses are best taken in order:<ol>\n<li>Gen AI: Beyond the Chatbot<\/li>\n<li>Gen AI: Unlock Foundational Concepts<\/li>\n<li>Gen AI: Navigate the Landscape<\/li>\n<li>Gen AI Apps: Transform Your Work<\/li>\n<li>Gen AI Agents: Transform Your Organization<\/li>\n<\/ol>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Why the course exists (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Why the course exists (video)<\/h2><div class=\"bi\"><ul>\n<li>Businesses want to use gen AI but don't know how. The gap is mostly <strong>non-technical<\/strong>: what gen AI can be used for, how to get <strong>buy-in<\/strong>, and how to communicate with technical and non-technical teams.<\/li>\n<li>Path storyline:<ul>\n<li>C1 introduces gen AI, its business capabilities, and how to plan a gen AI strategy.<\/li>\n<li>C2 covers foundational terminology (e.g. LLMs, responsible AI).<\/li>\n<li>C3 covers the layers of the gen AI landscape, with the opportunities and challenges at each layer.<\/li>\n<li>C4 covers gen AI apps for your individual workflow.<\/li>\n<li>C5 covers custom gen AI tools to transform the organisation.<\/li>\n<\/ul>\n<\/li>\n<li>Throughout, the path shows how Google and <strong>Google Cloud<\/strong> support building, using and adopting gen AI apps.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Questions this course answers","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Questions this course answers<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\">What is gen AI, and what can it be used for?<\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">How can gen AI transform businesses?<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\">How can Google Cloud support your gen AI journey?<\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\">What strategies help implement gen AI successfully in a business?<\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"1.2","title":"The business impact of generative AI","kind":"concept","html":"","videos":["YovkGe8FtEY"],"steps":[{"title":"Core idea (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Core idea (video)<\/h2><div class=\"bi\"><ul>\n<li><strong>Generative AI<\/strong> = a type of AI that creates new content and ideas: text, images, music, code.<\/li>\n<li>Gen AI is a <strong>technology that can be integrated into applications, not an application itself<\/strong>. A chatbot is just one application of it.<\/li>\n<li><strong>Gemini (model) vs the Gemini app:<\/strong><ul>\n<li>Gemini is one of Google's gen AI <strong>models<\/strong>.<\/li>\n<li>The <strong>Gemini app<\/strong> is Google's gen AI chatbot (help with writing, planning, learning…). It is one application built on the Gemini model.<\/li>\n<\/ul>\n<\/li>\n<li>Other products built on the Gemini model:<ul>\n<li><strong>Google Workspace with Gemini<\/strong>: Gmail, Google Meet, Google Slides, etc.<\/li>\n<li><strong>Gemini for Looker<\/strong>: analytics.<\/li>\n<li><strong>Gemini in BigQuery<\/strong>: generate, explain and troubleshoot SQL queries and Python code.<\/li>\n<li>Gemini with Google Cloud services: automate creating and modifying resources, troubleshoot issues, suggest solutions.<\/li>\n<\/ul>\n<\/li>\n<li>Headlines about \"the AI revolution\" may mean a chatbot app or the broader embeddable technology.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"The four primary ways to use gen AI","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The four primary ways to use gen AI<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Use<\/div><div class=\"kt\"><strong>Create<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Generate new content<\/div><\/div><div class=\"kf\"><div class=\"kl\">Examples &amp; named Google tools<\/div><div class=\"kv\"><strong>Text:<\/strong> articles, emails, social posts. Customer-service replies via <strong>Conversational AI<\/strong>. Client emails via <strong>Gemini in Gmail<\/strong>.<br/><strong>Images, video, audio:<\/strong> a presentation image via <strong>Gemini in Google Slides<\/strong>. Design concepts for marketing material and web pages via <strong>Nano Banana<\/strong>. Troubleshooting video tutorials via <strong>Google Vids<\/strong>.<br/><strong>Code:<\/strong> unit tests and test cases. Starter code for large projects via <strong>Gemini Code Assist<\/strong>.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Use<\/div><div class=\"kt\"><strong>Summarize<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Condense large amounts of information<\/div><\/div><div class=\"kf\"><div class=\"kl\">Examples &amp; named Google tools<\/div><div class=\"kv\">A long financial report via <strong>Gemini Notebook Enterprise<\/strong>. Customer reviews and sentiment via <strong>Gemini in Looker<\/strong>. Meeting notes with decisions and action items via <strong>Gemini in Google Meet<\/strong>. Sales call recaps and next steps. Complex data turned into visuals and graphs via <strong>Gemini in BigQuery<\/strong>.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Use<\/div><div class=\"kt\"><strong>Discover<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Find information at the right time<\/div><\/div><div class=\"kf\"><div class=\"kl\">Examples &amp; named Google tools<\/div><div class=\"kv\">Demand prediction and inventory from purchase history and web traffic via <strong>forecasting models on Agent Platform<\/strong>. Personalised streaming recommendations, raising engagement and reducing churn, via <strong>Agent Search<\/strong>. Drug-candidate identification from molecular datasets by <strong>fine-tuning models on Agent Platform<\/strong>. File search and Q&amp;A via <strong>Gemini in Google Drive<\/strong>. Enterprise expertise for employees (Gemini reasoning + Google-quality search + enterprise data, wherever it's hosted) via <strong>Gemini Enterprise<\/strong>. Monitoring real-time events: <strong>anomaly detection<\/strong> for fraudulent transactions.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Use<\/div><div class=\"kt\"><strong>Automate<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Do tasks that previously needed humans<\/div><\/div><div class=\"kf\"><div class=\"kl\">Examples &amp; named Google tools<\/div><div class=\"kv\"><strong>Format conversion:<\/strong> accessible formats in real time via Google Cloud APIs (<strong>Text-to-Speech, Speech-to-Text, Translation<\/strong>…). <strong>Documentation:<\/strong> code documentation generated with <strong>Codey<\/strong>. Contract review and information extraction with <strong>Document AI<\/strong>. <strong>Notifications and alarms:<\/strong> automated customer-feedback analysis and ticket creation.<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Multimodal gen AI","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Multimodal gen AI<\/h2><div class=\"bi\"><ul>\n<li><strong>Multimodal gen AI<\/strong> means a model can process and integrate several formats (plain text, images, video, audio, PDFs), either individually or combined at the same time.<\/li>\n<li>Course examples:<ul>\n<li><strong>Text + image:<\/strong> marketing creates on-brand social posts with images, captions, hashtags and optimal posting times.<\/li>\n<li><strong>Text + PDF:<\/strong> a legal team summarises a contract, answers clause questions, flags risks and suggests alternative wording.<\/li>\n<li><strong>Text + video + data:<\/strong> market research analyses sentiment in video testimonials together with the spoken words and survey data, to find themes, pain points and satisfaction.<\/li>\n<li><strong>Sensor data + video:<\/strong> manufacturing safety. Camera feeds and sensors detect spills or equipment malfunctions and alert workers.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Businesses already use Google Cloud gen AI to support <strong>decision-making<\/strong>, <strong>efficiency and productivity<\/strong>, <strong>creative idea generation<\/strong>, and <strong>cost reduction through automation<\/strong>.<\/p><\/div><\/section><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Know <strong>Create / Summarize / Discover / Automate<\/strong> and be able to classify a scenario into one of them.<\/li>\n<li>Gen AI is a technology. Gemini is a model. The Gemini app is an application.<\/li>\n<li>Know the definition of multimodal gen AI.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"1.3","title":"Agent Platform and multimodal gen AI","kind":"concept","html":"","videos":["-3-PNyadEh8"],"steps":[{"title":"Gemini Enterprise Agent Platform (\"Agent Platform\")","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Gemini Enterprise Agent Platform (\"Agent Platform\")<\/h2><div class=\"bi\"><ul>\n<li><strong>Formerly Vertex AI.<\/strong> It is Google Cloud's <strong>unified machine learning (ML) platform<\/strong>.<\/li>\n<li>Use it to <strong>build, train and deploy<\/strong> ML models and AI applications.<\/li>\n<li>It gives access to Google's large gen AI models for multiple modalities (text, code, images, speech) through <strong>Model Garden<\/strong>.<\/li>\n<li>You can <strong>tune<\/strong> Google's LLMs to your needs, then deploy them in AI-powered apps.<\/li>\n<li>One-liner: Agent Platform is the key to <strong>creating and deploying custom gen AI solutions<\/strong> for your business.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Use case: automotive virtual assistant (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Use case: automotive virtual assistant (video)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Why multimodal<\/div><div class=\"kv\">business workflows mix many data formats and interaction types. Multimodal gen AI processes images, audio and video alongside text and numbers, which gives a fuller understanding of a process.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Problem<\/div><div class=\"kv\">a dashboard engine warning light comes on. Today the owner finds and reads the manual, may still not understand it, goes to a mechanic, and the mechanic has to explain (maybe with images).<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Solution<\/div><div class=\"kv\">an auto company built a customer virtual assistant using:<ul>\n<li><strong>Gemini on Google Cloud<\/strong> to understand what drivers ask.<\/li>\n<li><strong>Agent Search<\/strong> (on Gemini Enterprise Agent Platform) to find the most relevant answer.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Agent Search<\/div><div class=\"kv\">is a Google Cloud service that lets developers add advanced search to their apps. It is fully managed and scalable, and handles large volumes of <strong>multimodal<\/strong> data and complex queries.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Knowledge sources indexed<\/div><div class=\"kv\">owner's manuals, customer FAQs, help-centre articles, YouTube videos, step-by-step guides.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Customer experience<\/div><div class=\"kv\"><ul>\n<li>The driver describes the problem naturally and can show the warning light with the phone camera.<\/li>\n<li><strong>Intelligent knowledge retrieval<\/strong> comes from Agent Search.<\/li>\n<li><strong>Interactive problem solving<\/strong> comes from Gemini: a dynamic dialogue with clarifying questions and step-by-step troubleshooting.<\/li>\n<li>Use cases range from engine issues to Bluetooth phone pairing.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Results<\/div><div class=\"kv\"><ol>\n<li>Reduced support costs (fewer calls to service centres).<\/li>\n<li>Improved efficiency (customers find answers fast).<\/li>\n<li>Enhanced accessibility (support regardless of technical expertise).<\/li>\n<\/ol><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Reflection prompt<\/div><div class=\"kv\">most workflows aren't single-modality end to end. Where could multimodal gen AI augment one of yours?<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Agent Platform is Google Cloud's <strong>core platform for building and deploying custom gen AI<\/strong>. It gives access to models like <strong>Gemini<\/strong> and tools like <strong>Agent Search<\/strong> for multimodal business solutions.<\/p><\/div><\/section><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Agent Platform = formerly <strong>Vertex AI<\/strong>. <strong>Model Garden<\/strong> = model access.<\/li>\n<li>Agent Search = managed enterprise search over multimodal data. Gemini = understanding and dialogue.<\/li>\n<li>Three benefits: lower support cost, efficiency, accessibility.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"1.4","title":"Foundations of gen AI","kind":"concept","html":"","videos":["ahQHKLBsE40"],"steps":[{"title":"Definitions","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Definitions<\/h2><div class=\"bi\"><div class=\"defs\"><div class=\"def\"><div class=\"term\">Foundation models:<\/div><div class=\"meaning\">large AI models trained on enormous datasets. That broad training gives them a deep understanding of the data, so they can be <strong>adapted to a wide range of downstream tasks<\/strong>. The course calls them a <strong>paradigm shift<\/strong> in AI: they streamline processes, automate tasks and unlock new possibilities across business functions.<\/div><\/div><div class=\"def\"><div class=\"term\">Artificial intelligence (AI):<\/div><div class=\"meaning\">computer systems performing tasks that typically need human intelligence (understanding language, making decisions).<\/div><\/div><div class=\"def\"><div class=\"term\">Machine learning (ML):<\/div><div class=\"meaning\">the usual way to achieve AI. Systems <strong>learn from data<\/strong> to solve specific problems.<\/div><\/div><div class=\"def\"><div class=\"term\">Traditional AI models vs foundation models:<\/div><div class=\"meaning\"><ul>\n<li>Traditional models are trained for a <strong>single purpose<\/strong> on specific data (e.g. a spam filter).<\/li>\n<li>Foundation models are trained on massive, <strong>diverse<\/strong> data (text, images, code), so they adapt to many tasks. This flexibility is what makes them groundbreaking.<\/li>\n<\/ul><\/div><\/div><div class=\"def\"><div class=\"term\">LLMs (large language models)<\/div><div class=\"meaning\">are the best-known type of foundation model. They are a <strong>specialised type of foundation model focused on language<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Key features of foundation models · Example foundation models (and their training data)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Key features of foundation models<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Trained on diverse data<\/div><div class=\"kv\">they learn general patterns and relationships that transfer across tasks.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Flexible<\/div><div class=\"kv\">one model supports a wide range of use cases.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Adaptable<\/div><div class=\"kv\">they can be specialised for domains or use cases through additional, targeted training.<\/div><\/div><\/li><\/ol><\/div><\/section><section class=\"blk sec\"><h2>Example foundation models (and their training data)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Gemini<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Training data<\/div><div class=\"kv\">Massive multimodal data: text, images, code, audio, video, more<\/div><\/div><div class=\"kf\"><div class=\"kl\">Typical tasks<\/div><div class=\"kv\">Language understanding, image generation, code generation, cross-domain tasks<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Nano Banana<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Training data<\/div><div class=\"kv\">Mainly images and text descriptions<\/div><\/div><div class=\"kf\"><div class=\"kl\">Typical tasks<\/div><div class=\"kv\">Text-to-image generation, image editing, understanding image content<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Chirp<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Training data<\/div><div class=\"kv\">Audio in many languages<\/div><\/div><div class=\"kf\"><div class=\"kl\">Typical tasks<\/div><div class=\"kv\">Speech recognition: voice assistants, transcription, translation<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge checks in the lesson (answer key in my words)<\/h2><div class=\"bi\"><ul>\n<li><strong>Foundation model or not?<\/strong><ul>\n<li>Foundation models: a deep-learning text-to-image generator; a model trained on vast image and video data that understands, generates and answers questions about visual content; a model trained on massive code data that can also translate and write creative content.<\/li>\n<li><strong>Not<\/strong> foundation models: a <strong>decision tree<\/strong> for churn prediction; a <strong>linear regression<\/strong> for house prices. These are narrow, single-task models.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Foundation model vs LLM:<\/strong> the two correct statements are \"All LLMs are foundation models\" and \"LLMs are a specialised type of foundation model\". Not every foundation model is an LLM.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Foundation models are <strong>large-scale, general-purpose<\/strong> models trained on massive data and adaptable to many downstream tasks. Traditional ML models are task-specific and trained on smaller, focused datasets.<\/p><\/div><\/section><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>AI ⊃ ML ⊃ (deep learning) ⊃ gen AI / foundation models ⊃ LLMs. The nesting is detailed further in C2.<\/li>\n<li>Know Gemini, Nano Banana and Chirp and their modalities.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"1.5","title":"Use case: Gemini in action (Morrisons)","kind":"usecase","html":"","videos":["M_OFD3sUI5I"],"steps":[{"title":"Facts","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Facts<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Morrisons<\/div><div class=\"kv\">is one of the UK's largest supermarkets. The video adds about <strong>1,600 convenience shops<\/strong> and <strong>2,700 farmers and growers<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">It built <strong>Product Finder<\/strong>, an <strong>in-app AI tool<\/strong>. Shoppers type a product name and get its <strong>aisle and precise location in-store<\/strong> in real time, even if shelves were rearranged that day.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Stack<\/div><div class=\"kv\"><strong>BigQuery<\/strong> (product and location data per store) + <strong>Vertex AI (now Agent Platform)<\/strong> + <strong>Gemini models<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">How it works<\/div><div class=\"kv\">Gemini and Vertex interpret the shopper's free-text query and translate it into Morrisons' <strong>product ID and location ID<\/strong>, then look up the location in BigQuery.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Adoption<\/div><div class=\"kv\">about <strong>50,000 hits a day over Easter 2025<\/strong>, with usage growing as shoppers come back.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Speaker: Peter Laflin, Morrisons director of data analytics and AI.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Lessons the customer drew","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Lessons the customer drew<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Motivation<\/div><div class=\"kv\">staff are often asked where products are. Hard-to-find items (the example is tahini, a small jar among similar jars) frustrate shoppers. The goal was an <strong>online-style search experience in the physical store<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Pre-trained model benefit<\/div><div class=\"kv\">you don't have to exhaustively test the model itself. You test how it behaves <strong>in your environment<\/strong> and trust Google's part.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Speed and team size<\/div><div class=\"kv\">without these products it might have taken <strong>months and a larger team<\/strong>. The platform let a <strong>small team<\/strong> do far more and focus on user experience.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Ways of working changed<\/div><div class=\"kv\">faster proof-of-concept to value, and a different style of collaboration.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway (as stated on the page)<\/h2><div class=\"bi\"><ul>\n<li>The page's takeaway calls Gemini an image-generation tool for product imagery. That wording doesn't match the Product Finder story, which is about <strong>query understanding plus data lookup<\/strong>.<\/li>\n<li>For the exam, remember the substance: business results, time and resource savings, and customer engagement through Gemini + Agent Platform + BigQuery.<\/li>\n<\/ul><\/div><\/section><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Use cases that pair a <strong>pre-trained model<\/strong> with your own <strong>enterprise data<\/strong> (BigQuery) deliver value quickly with small teams.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"1.6","title":"Prompting models","kind":"concept","html":"","videos":[],"steps":[{"title":"Key points · Input → output examples","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Key points<\/h2><div class=\"bi\"><ul>\n<li>Foundation models take <strong>inputs called prompts<\/strong> and produce <strong>outputs<\/strong>.<\/li>\n<li>Every AI model has inputs, but many have <strong>strict input requirements<\/strong>: only numbers, only emails, only images.<\/li>\n<li>Foundation models, and especially <strong>multimodal<\/strong> ones, accept a much <strong>broader set of inputs<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Input → output examples<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Input (prompt)<\/div><div class=\"kt\">A question<\/div><div class=\"kf\"><div class=\"kl\">Output<\/div><div class=\"kv\">The answer<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Input (prompt)<\/div><div class=\"kt\">A text description requesting an image<\/div><div class=\"kf\"><div class=\"kl\">Output<\/div><div class=\"kv\">The image<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Input (prompt)<\/div><div class=\"kt\">A request to summarise a file<\/div><div class=\"kf\"><div class=\"kl\">Output<\/div><div class=\"kv\">The summary<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Input (prompt)<\/div><div class=\"kt\">Sample code with errors<\/div><div class=\"kf\"><div class=\"kl\">Output<\/div><div class=\"kv\">Corrected code<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Terminology","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Terminology<\/h2><div class=\"bi\"><ul>\n<li><strong>Prompting = prompt engineering = prompt design.<\/strong> Writing prompts is \"an art and a science\", with many techniques.<\/li>\n<li>Prompting is <strong>one of the most important skills<\/strong> for getting value from gen AI models and tools.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Foundation models are accessed through prompting. Effective prompts unlock text generation, translation, creative content and informative answers.<\/p><\/div><\/section><\/div>"}]},{"id":"1.7","title":"Prompting the Gemini app","kind":"concept","html":"","videos":["dmHpUjPADR8"],"steps":[{"title":"Demo (video) · Hands-on activity (mapped to the four uses)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Demo (video)<\/h2><div class=\"bi\"><ul>\n<li>In the <strong>Gemini app<\/strong> (gemini.google.com), you type the prompt in the text box at the bottom, like a conversation with an assistant.<\/li>\n<li>You can ask questions, give creative tasks, or ask for summaries of complex information.<\/li>\n<li><strong>Demo prompt:<\/strong> a poem on why employees should attend the company-wide meeting. You press Enter and Gemini returns a unique poem.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Hands-on activity (mapped to the four uses)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Create<\/div><div class=\"kv\">ask for website text for your product.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Summarize<\/div><div class=\"kv\">ask for a summary of a long work document or email.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Discover<\/div><div class=\"kv\">ask it to research a topic.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: which input type gives this output?<\/h2><div class=\"bi\"><p>Input types listed: text description, image input, code snippet, audio file, video file.\n| Desired output | Input needed |\n|---|---|\n| Realistic image of a futuristic cityscape | <strong>Text description<\/strong> (describe the city) |\n| Fixed version of a buggy Python script | <strong>Code snippet<\/strong> (paste the code plus the request) |\n| Summary of troubleshooting steps from a customer-service call | <strong>Audio file<\/strong> (call recording plus the request) |\n| Personalised workout plan | <strong>Text description<\/strong> (goal plus fitness level) |<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Prompting is a skill built through <strong>practice and experimentation<\/strong>.<\/p><\/div><\/section><\/div>"}]},{"id":"1.8","title":"The AI-first company","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · Google as an AI-first company","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Gap:<\/strong> this page has two interactive timelines (\"select the number markers\": 7 Google AI product highlights and Google research highlights). Their text sits in images or hotspots and wasn't in the extracted page text. Check them on the page.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>Google as an AI-first company<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Since 1998<\/div><div class=\"kv\">, Google has pioneered AI-driven products (Search, Gmail, Android).<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Mission<\/div><div class=\"kv\">\"organize the world's information and make it universally accessible and useful\". Google shares its research, best practices and advances with the world.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">2008<\/div><div class=\"kv\">Google launched <strong>Google Cloud<\/strong>, making the same technology available to businesses so they don't start from scratch.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Build on Google's foundation<\/div><div class=\"kv\">a full ecosystem lets you use the latest gen AI <strong>without years of investment<\/strong> building it yourself.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Five ways to leverage Google's gen AI ecosystem","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Five ways to leverage Google's gen AI ecosystem<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Individual productivity and efficiency.<\/div><div class=\"kv\">Gen AI is built into everyday tools:<ul>\n<li><strong>Google Search<\/strong> (Gemini in Search): find information faster and more accurately.<\/li>\n<li><strong>Google Workspace with Gemini<\/strong>: draft emails in Gmail, generate presentations in Slides, summarise meeting notes in Docs, automate tasks in Sheets.<\/li>\n<li><strong>Gemini App<\/strong>: personalised assistance and creative exploration.<\/li>\n<li><strong>Gemini for Google Cloud<\/strong>: build apps and services on Google Cloud with Gemini models.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Continuous improvement.<\/div><div class=\"kv\">Google keeps you current:<ul>\n<li><strong>Automatic model upgrades<\/strong>: no infrastructure to manage, no retraining.<\/li>\n<li><strong>Access to new features<\/strong>: early access to new Gemini capabilities.<\/li>\n<li><strong>Security patches and updates<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Responsible AI.<\/div><div class=\"kv\">Google builds securely and ethically and provides education:<ul>\n<li><strong>Secure AI Framework (SAIF)<\/strong>: tools and best practices for secure AI systems.<\/li>\n<li><strong>Mandiant<\/strong>: threat intelligence and expertise against cyberattacks.<\/li>\n<li><strong>AI Principles<\/strong>: Google's published principles guiding AI development and deployment.<\/li>\n<li><strong>Responsible AI Toolkit<\/strong>: resources for fair, unbiased, socially beneficial AI.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Enterprise ready.<\/div><div class=\"kv\">Covers security, data governance and compliance:<ul>\n<li><strong>Agent Platform<\/strong>: unified ML platform (including Gemini) with enterprise-grade security, scalability and compliance.<\/li>\n<li><strong>Google Cloud's security infrastructure<\/strong>: encryption, access control, network security.<\/li>\n<li><strong>Compliance certifications<\/strong>: e.g. <strong>ISO 27001, SOC 2, HIPAA<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Open approach.<\/div><div class=\"kv\">No lock-in, so you can choose what fits:<ul>\n<li>Contributions to <strong>TensorFlow and PyTorch<\/strong>.<\/li>\n<li><strong>Open models and datasets<\/strong> released to researchers.<\/li>\n<li>Support for <strong>open standards<\/strong> for AI interoperability and data exchange.<\/li>\n<\/ul><\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Embracing gen AI · Reflection exercise","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Embracing gen AI<\/h2><div class=\"bi\"><ul>\n<li>You don't need to be a technical expert. The principles are easy to apply across functions.<\/li>\n<li>The most successful implementations have:<ul>\n<li>a <strong>clear vision<\/strong>,<\/li>\n<li>a focus on <strong>impactful use cases<\/strong>,<\/li>\n<li><strong>tracked results<\/strong>.\n  These create competitive advantage.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Reflection exercise<\/h2><div class=\"bi\"><p>List five reasons a platform like Google Cloud helps when building gen AI. The five tabs above are the model answer.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Google Cloud is a comprehensive, reliable platform: you use gen AI <strong>without managing the underlying infrastructure<\/strong> and stay at the forefront of advances.<\/p><\/div><\/section><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Memorise the five ecosystem pillars and <strong>one named example each<\/strong> (e.g. SAIF and Mandiant → responsible/secure; ISO 27001/SOC 2/HIPAA → enterprise ready; TensorFlow/PyTorch → open).<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"1.9","title":"Building a successful gen AI strategy","kind":"concept","html":"","videos":["4jUj36sO77I"],"steps":[{"title":"Core message (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Core message (video)<\/h2><div class=\"bi\"><ul>\n<li>You don't have to be AI-first like Google, but gen AI should be <strong>at the forefront of strategy<\/strong>. Only you know your business needs.<\/li>\n<li>Don't adopt new technology headfirst without a plan. Also consider how the <strong>structure of the business must change<\/strong> to implement gen AI.<\/li>\n<li><strong>Recommended: a two-fold approach, top-down AND bottom-up at the same time.<\/strong><ul>\n<li><strong>Top-down:<\/strong> set a clear, compelling AI vision aligned with <strong>strategic business priorities<\/strong>. Start with priorities and the most important use cases and workflows. <em>Only then<\/em> ask how AI supports them.<\/li>\n<li><strong>Bottom-up:<\/strong> encourage teams to share challenges and gen AI ideas. The best ideas often come from those <strong>closest to the problem<\/strong>. Encourage small-scale use, then share solutions for broader rollout.<\/li>\n<li><strong>Why both:<\/strong><ul>\n<li>Top-down alone misses opportunities.<\/li>\n<li>Top-down gives the bottom-up experiments (1) a place in the overall strategy and (2) a <strong>safe and responsible<\/strong> frame.<\/li>\n<\/ul>\n<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Roles","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Roles<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Executives and high-level management<\/div><div class=\"kv\"><ul>\n<li><strong>executive sponsorship<\/strong> and a <strong>clear vision<\/strong>;<\/li>\n<li>align initiatives with business goals;<\/li>\n<li>secure <strong>adequate resources<\/strong> and organisation-wide support;<\/li>\n<li>empower employees to experiment.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Mid-level managers and individual contributors (ICs)<\/div><div class=\"kv\"><ul>\n<li>close to daily operations and end users, which gives them insight;<\/li>\n<li>champion adoption by finding <strong>high-impact, feasible<\/strong> solutions to specific workflow challenges;<\/li>\n<li>encourage experimentation and feedback so tools fit existing processes.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Multi-directional strategy: six areas, both levels","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Multi-directional strategy: six areas, both levels<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Strategic focus<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Executives / leadership<\/div><div class=\"kv\">Focus on one high-impact area first, succeed, then expand (maximises learning and scalability). Prioritise use cases that are <strong>feasible, actionable, affordable, with high anticipated business value / ROI<\/strong>.<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mid-level managers &amp; ICs<\/div><div class=\"kv\">Start from the most pressing <strong>pain points<\/strong> (your own or customers'). Understand user needs, workflows and expectations: <strong>human-centred design<\/strong>.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Exploration<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Executives / leadership<\/div><div class=\"kv\">Explore <strong>low-risk<\/strong> areas first. Empower experimentation (e.g. <strong>hackathons<\/strong>, dedicated time and resources). Foster sharing of findings and best practices.<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mid-level managers &amp; ICs<\/div><div class=\"kv\">Experiment with different tools to learn capabilities and limits. Share results. If successful, widen scope and bring insights to leadership.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Responsible AI<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Executives / leadership<\/div><div class=\"kv\">Set <strong>ethical guidelines<\/strong> and safety mechanisms. Robust <strong>data governance<\/strong> (security, privacy, regulations) using enterprise tooling: <strong>Google Cloud Data Loss Prevention<\/strong> (discover, classify, de-identify data), <strong>Cloud Key Management Service<\/strong> (encryption keys), <strong>Google SecOps<\/strong> (detect and respond to threats). A <strong>content moderation policy<\/strong> with employee review of AI output, especially for sensitive or high-risk uses. Monitor performance and impact for unintended consequences.<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mid-level managers &amp; ICs<\/div><div class=\"kv\">Follow company AI standards and organisational values. Anticipate pitfalls proactively. Test and evaluate thoroughly for bias, safety and ethics issues.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Resourcing<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Executives / leadership<\/div><div class=\"kv\">A robust <strong>data strategy<\/strong> (high-quality, relevant data for training and fine-tuning). Don't reinvent the wheel: reuse tools and platforms. Invest in <strong>AI talent<\/strong>: upskill and hire.<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mid-level managers &amp; ICs<\/div><div class=\"kv\">Use resources already in the team (datasets, tools, platforms). If more is needed, make the case to leadership on value and ROI.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Impact<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Executives / leadership<\/div><div class=\"kv\">Set clear goals and <strong>KPIs<\/strong> (e.g. increased sales, fewer complaints). Communicate progress and impact to stakeholders to justify investment.<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mid-level managers &amp; ICs<\/div><div class=\"kv\">Demonstrate and <strong>quantify<\/strong> tangible impact (efficiency, satisfaction, cost savings). Link work to org goals. Track KPIs to refine the approach.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Continuous improvement<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Executives / leadership<\/div><div class=\"kv\"><strong>Iterative<\/strong> development driven by feedback, performance data and changing needs. A regular <strong>evaluation cadence<\/strong> for quality, accuracy and effectiveness. Feedback mechanisms from users and stakeholders.<\/div><\/div><div class=\"kf\"><div class=\"kl\">Mid-level managers &amp; ICs<\/div><div class=\"kv\">Continuous testing, measurement and refinement. Update solutions with new data and feedback. Keep learning (courses, articles, experimenting).<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: who is primarily responsible?<\/h2><div class=\"bi\"><ul>\n<li><strong>Executives / high-level management:<\/strong> setting overall vision and strategy; securing funding and resources; establishing ethical guidelines.<\/li>\n<li><strong>Mid-level managers / ICs:<\/strong> identifying use cases in daily workflows; experimenting with tools.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Success needs a <strong>combined top-down and bottom-up strategy<\/strong>. Leaders set vision and provide resources. Teams find practical applications and experiment. Collaboration and continuous improvement sustain it.<\/p><\/div><\/section><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Classic scenario: \"Who should …?\" → apply the split above.<\/li>\n<li>Prioritisation criteria: feasible, actionable, affordable, high value / ROI. Start <strong>low-risk<\/strong>.<\/li>\n<li>Data governance tools: DLP, Cloud KMS, Google SecOps.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"1.10","title":"Brainstorm gen AI use cases","kind":"usecase","html":"","videos":["670ESOA9b2k"],"steps":[{"title":"The creative matrix (recommended method)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The creative matrix (recommended method)<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Purpose<\/div><div class=\"kv\">systematically generate and then prioritise gen AI use cases.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Setup<\/div><div class=\"kv\">gather a team and draw <strong>two axes<\/strong> (they're flexible):<ul>\n<li><strong>Axis 1, gen AI options:<\/strong> organised by product, modality or another dimension.<\/li>\n<li><strong>Axis 2, business-specific items:<\/strong> personas, workflows or strategic goals.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Ideation<\/div><div class=\"kv\">team members write <strong>sticky notes<\/strong> (physical or virtual) with ideas at each intersection.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Evaluation<\/div><div class=\"kv\">score each idea for <strong>impact<\/strong> and <strong>how much work it takes to build<\/strong> (feasibility).<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Worked example: faux floral business","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Worked example: faux floral business<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Business priorities<\/div><div class=\"kv\">Enhance Customer Experience · Increase Efficiency · Drive Innovation · Enhance Employee Productivity.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Capabilities<\/div><div class=\"kv\"><ul>\n<li>in the video: Agent Search, Agent Conversation, Agent Studio;<\/li>\n<li>in the sample image: Google Workspace with Gemini, Vertex AI Conversation, Vertex AI Search, Vertex AI Studio. These are the older Vertex names.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Sample sticky notes<\/div><div class=\"kv\"><ul>\n<li><strong>Drive innovation × Agent Search:<\/strong> customers upload a photo to find similar arrangements.<\/li>\n<li><strong>Customer experience × Agent Conversation:<\/strong> a chatbot for instant support on care, arrangement and ordering.<\/li>\n<li><strong>Efficiency × Agent Studio:<\/strong> <strong>fine-tune<\/strong> a model on customer data to <strong>predict demand<\/strong> per product.<\/li>\n<\/ul><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Practice","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Practice<\/h2><div class=\"bi\"><ul>\n<li>Come up with 3–5 of your own sticky notes. You may use the Gemini app to help, but <strong>validate all ideas<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>The creative matrix links <strong>gen AI capabilities<\/strong> to <strong>business priorities<\/strong> to produce practical, impactful, workflow-specific ideas.<\/p><\/div><\/section><\/div>"}]},{"id":"1.11","title":"Keeping humans at the forefront of gen AI implementation","kind":"concept","html":"","videos":[],"steps":[{"title":"Principle · Augmentation: gen AI enhances human strategic work","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Principle<\/h2><div class=\"bi\"><p>Shift human responsibility <strong>from task execution to strategic thinking<\/strong>.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Augmentation: gen AI enhances human strategic work<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Critical thinking &amp; problem solving<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What gen AI does<\/div><div class=\"kv\">Provides data and insights<\/div><\/div><div class=\"kf\"><div class=\"kl\">What humans still do<\/div><div class=\"kv\">Interpret them and make decisions<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Creativity &amp; innovation<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What gen AI does<\/div><div class=\"kv\">Generates ideas, explores options<\/div><\/div><div class=\"kf\"><div class=\"kl\">What humans still do<\/div><div class=\"kv\">Push boundaries; true innovation<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Relationship building &amp; collaboration<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What gen AI does<\/div><div class=\"kv\">Eases communication and information sharing<\/div><\/div><div class=\"kf\"><div class=\"kl\">What humans still do<\/div><div class=\"kv\">Build trust, foster collaboration, handle human dynamics<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Area<\/div><div class=\"kt\"><strong>Strategic planning &amp; vision<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What gen AI does<\/div><div class=\"kv\">Forecasting, trend analysis<\/div><\/div><div class=\"kf\"><div class=\"kl\">What humans still do<\/div><div class=\"kv\">Set long-term vision and goals, chart the course<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Automation: gen AI takes over tasks that are · Humans-in-the-loop (HITL) are still needed, even for automation","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Automation: gen AI takes over tasks that are<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Repetitive and rule-based<\/div><div class=\"kv\">data entry, information retrieval, content formatting, basic code generation.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Time-consuming and resource-intensive<\/div><div class=\"kv\">research, data analysis, summarisation, first drafts.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>Humans-in-the-loop (HITL) are still needed, even for automation<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Data selection and preparation<\/div><div class=\"kv\">high-quality, relevant, representative training data.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Prompt design and refinement<\/div><div class=\"kv\">prompts that get accurate, useful answers.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Output evaluation and refinement<\/div><div class=\"kv\">review and edit for accuracy, relevance and brand alignment.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Continuous monitoring and feedback<\/div><div class=\"kv\">track performance, find improvements.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: augmentation or automation?<\/h2><div class=\"bi\"><div class=\"tw rtable\"><table>\n<thead>\n<tr>\n<th>Scenario<\/th>\n<th>Answer<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A chatbot answers basic pricing and availability questions for sales<\/td>\n<td><strong>Automation<\/strong><\/td>\n<td>Repetitive FAQ work; frees sales for complex deals<\/td>\n<\/tr>\n<tr>\n<td>A financial analyst uses gen AI to analyse data and draft trend reports, then advises clients<\/td>\n<td><strong>Augmentation<\/strong><\/td>\n<td>AI output informs the human's strategic advice<\/td>\n<\/tr>\n<tr>\n<td>A retailer generates catalogue product descriptions from attributes<\/td>\n<td><strong>Automation<\/strong><\/td>\n<td>Labour-intensive content at scale; resources move to marketing and service<\/td>\n<\/tr>\n<tr>\n<td>Developers generate standard code, then review and integrate it<\/td>\n<td><strong>Augmentation<\/strong> (via automated code generation)<\/td>\n<td>Boosts developer capability; human oversight ensures quality<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Best use = <strong>augment<\/strong> strategic thinking and creativity, <strong>automate<\/strong> repetitive tasks. Humans stay central in both (prompt design, output evaluation, monitoring).<\/p><\/div><\/section><\/div>"}]},{"id":"1.12","title":"Use case: AI-assisted captioning on Google Cloud (Warner Bros. Discovery)","kind":"usecase","html":"","videos":["D8F55oFJjRQ"],"steps":[{"title":"Facts","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Facts<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Warner Bros. Discovery (WBD)<\/div><div class=\"kv\">has a large, unique content library, historically its main business driver.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">With <strong>Google Cloud<\/strong> (and <strong>Accenture<\/strong>), WBD built <strong>\"Caption AI\"<\/strong>, ML-driven, more efficient captioning.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Strategic shift<\/div><div class=\"kv\">content data that was used only for distribution and viewing becomes a <strong>data asset for ML<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Workflow (hybrid, human-in-the-loop)<\/div><div class=\"kv\"><ol>\n<li>Caption AI drops a caption file into a folder, already <strong>time-coded and formatted<\/strong>.<\/li>\n<li>A human <strong>verifies the words and the sync<\/strong>, then edits.<\/li>\n<\/ol><\/div><\/div><div class=\"kcard\"><div class=\"kt\">Time per show<\/div><div class=\"kv\">a half-hour show took about <strong>4 hours<\/strong> to caption. Now it sometimes takes <strong>under 1 hour<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Headline results<\/div><div class=\"kv\">about <strong>50% reduction in overall costs<\/strong> and about <strong>80% reduction in time<\/strong> versus fully manual captioning. Quality is also higher for viewers.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Platform point<\/div><div class=\"kv\">Vertex AI (now Agent Platform) is <strong>model-agnostic<\/strong>. Beyond Google's own models, it lets WBD experiment to find the best model for each use case.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">WBD sees <strong>video as the next frontier<\/strong> for ML.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Module wrap-up · Course 1 conclusion","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Module wrap-up<\/h2><div class=\"bi\"><ul>\n<li>Gen AI solutions <strong>always involve humans<\/strong> somewhere: employees using tools, or customers using AI chatbots. Keep humans in the process to design a good experience and positive interactions.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Course 1 conclusion<\/h2><div class=\"bi\"><p>The course went beyond chatbot hype to diverse business applications, how to craft a gen AI strategy, and keeping people at the forefront.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Know the numbers: <strong>50% cost, 80% time<\/strong>.<\/li>\n<li>Human-in-the-loop = AI drafts, human verifies.<\/li>\n<li>Agent Platform / Vertex AI offers model choice (openness).<\/li>\n<\/ul><\/div><\/section><\/div>"}]}]},{"id":"2","title":"Gen AI: Unlock Foundational Concepts","lessons":[{"id":"2.1","title":"Introduction to gen AI foundational concepts","kind":"concept","html":"","videos":["gLsor1IzFLA"],"steps":[{"title":"Overview · Why gen AI is suddenly everywhere (video: Brett & Joe)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Prerequisite: Course 1 is recommended first.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Why gen AI is suddenly everywhere (video: Brett &amp; Joe)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">AI<\/div><div class=\"kv\">= creating machines that do tasks that typically need human intelligence. The field is <strong>not new<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">AI is already inside everyday tools: social media newsfeeds, voice assistants, shopping recommendations, autocomplete.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">What changed (around 2022)<\/div><div class=\"kv\"><ol>\n<li><strong>LLMs<\/strong> became dramatically more capable: they understand complex ideas and produce human-sounding text.<\/li>\n<li><strong>Computing power<\/strong> became widely available for training and deploying models: interconnected high-power computers plus hardware and tools built for AI.\n  These two together produced today's gen AI explosion.<\/li>\n<\/ol><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Questions this course answers","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Questions this course answers<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\">What's the difference between <strong>AI, ML and gen AI<\/strong>?<\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">How do <strong>data types, data requirements and ML approaches<\/strong> enable gen AI?<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\">What <strong>Google Cloud strategies<\/strong> address <strong>foundation model limitations<\/strong>?<\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\">What are the key challenges for <strong>responsible and secure AI<\/strong> in an organisation?<\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"2.2","title":"Understanding AI, ML, and generative AI","kind":"concept","html":"","videos":["9iZvFzaNwwM"],"steps":[{"title":"Definitions (course wording, condensed)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Definitions (course wording, condensed)<\/h2><div class=\"bi\"><div class=\"defs\"><div class=\"def\"><div class=\"term\">Artificial intelligence (AI):<\/div><div class=\"meaning\">the broad field of building machines that perform tasks requiring human intelligence: learning, problem-solving, decision-making.<\/div><\/div><div class=\"def\"><div class=\"term\">Machine learning (ML):<\/div><div class=\"meaning\">a <strong>subset of AI<\/strong>. Machines <strong>learn from data<\/strong> to perform specific tasks.<\/div><\/div><div class=\"def\"><div class=\"term\">Generative AI:<\/div><div class=\"meaning\">described here both as an <strong>application of AI<\/strong> and, in the video, as a <strong>subset of ML<\/strong>. It <strong>creates new content<\/strong> (images, text, music).<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"The model = the math · Predictive (traditional) AI vs generative AI","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The model = the math<\/h2><div class=\"bi\"><ul>\n<li>A <strong>model<\/strong> is essentially the math: input in, output out, like an equation.<\/li>\n<li>The model is <strong>built from the data<\/strong>, so <strong>different data creates different models<\/strong>. That's why data matters so much.<\/li>\n<li>Real models are more complex: many <strong>parameters<\/strong> and algorithms, \"more like a system of equations\".<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Predictive (traditional) AI vs generative AI<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Traditional AI<\/div><div class=\"kv\">analyses data to <strong>predict or classify<\/strong> an outcome (e.g. spam or not spam).<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Gen AI<\/div><div class=\"kv\">learns the underlying <strong>patterns and structures<\/strong> of its trainin
