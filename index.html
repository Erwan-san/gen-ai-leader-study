rong>.<\/li>\n<li><strong>Respectful tone<\/strong>; <strong>admit when you don't know<\/strong>.<\/li>\n<li>Phone <strong>(333) 333-3333<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Copy<\/strong> the output.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Create the chatbot<\/div><div class=\"kv\"><ul>\n<li><strong>New chat<\/strong> → <strong>Create new instruction<\/strong> → \"Cymbal Manufacturing chatbot\".<\/li>\n<li>Paste the generated system instructions.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Test<\/div><div class=\"kv\">say hello; ask about colour or size; ask about custom manufacturing; ask something off-topic (the weather).<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Metaprompting","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Metaprompting<\/h2><div class=\"bi\"><ul>\n<li>Steps 2–3 used <strong>metaprompting<\/strong>: prompts that guide AI to <strong>generate, modify or interpret other prompts<\/strong>.<\/li>\n<li>A key technique for dynamic, flexible, adaptable prompting.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>In <strong>CX Agent Studio<\/strong>, you write agent instructions and link <strong>tools like data stores<\/strong>. AI Studio was used here only for accessibility.<\/p><\/div><\/section><\/div>"}]},{"id":"5.18","title":"Gemini Enterprise app","kind":"concept","html":"","videos":[],"steps":[{"title":"Why · What it is","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Why<\/h2><div class=\"bi\"><ul>\n<li>A powerful transformation lever is supporting <strong>internal knowledge workers<\/strong>, not only external customers.<\/li>\n<li>Employees search across many systems: analytics, productivity, content, <strong>CRM<\/strong>, communications, portfolio management, supply chain, enterprise planning.<\/li>\n<li>Goal: make enterprise information <strong>more discoverable<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>What it is<\/h2><div class=\"bi\"><ul>\n<li>AI-built <strong>customised agents<\/strong> that access and understand data <strong>wherever it's stored<\/strong>. They can be embedded in internal sites or dashboards: a \"personal research assistant for work\".<\/li>\n<li><strong>The launch point for all your enterprise-ready expert agents.<\/strong><\/li>\n<li>What you can connect or add:<ol>\n<li><strong>Gemini Notebook Enterprise:<\/strong> upload information to analyse, get insights, <strong>audio summaries<\/strong>.<\/li>\n<li><strong>Multimodal search agents<\/strong> grounded in structured and unstructured data across systems (<strong>Google Drive, Confluence, Jira, ServiceNow<\/strong>, more).<\/li>\n<li><strong>Gen AI assistants<\/strong> grounded in enterprise data that <strong>take actions through connectors (tools)<\/strong>, e.g. create <strong>Google Calendar<\/strong> events, edit <strong>Jira Cloud<\/strong> issues.<\/li>\n<li><strong>Custom agents<\/strong> built with <strong>CX Agent Studio<\/strong>.<\/li>\n<\/ol>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Client trade idea generation · Deep market research on a complex political topic","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Use case: wealth management advisor<\/h2><h3>Client trade idea generation<\/h3><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\">Retrieve and compare the latest investment reports for market indicators.<\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">Attach <strong>Gemini Notebook \"Client Notes\"<\/strong> to personalise.<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\">An agent evaluates the research against those notes and finds <strong>insufficient regional and sector diversification<\/strong>.<\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\">Upload a spreadsheet, run it through the company's <strong>risk calculator<\/strong>.<\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\">Ask Gemini to <strong>draft the client email<\/strong>.<\/div><\/li><\/ol><\/div><\/section><section class=\"blk sec\"><h2>Deep market research on a complex political topic<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Limit sources<\/div><div class=\"kv\">to trusted, curated repositories (including a bank of <strong>government reports<\/strong>).<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">The agent first <strong>produces a research plan<\/strong>, which the advisor <strong>verifies<\/strong> (HITL).<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\">The agent executes: searches <strong>thousands of sources<\/strong>, asks new questions, continues until satisfied.<\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\">Output: a <strong>detailed report with all source links<\/strong> plus an <strong>audio summary<\/strong>.<\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Gemini Enterprise app vs Gemini Notebook Enterprise (exam favourite)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Gemini Enterprise app vs Gemini Notebook Enterprise (exam favourite)<\/h2><div class=\"bi\"><div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Gemini Notebook Enterprise<\/th>\n<th>Gemini Enterprise app<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Purpose<\/td>\n<td><strong>Deep dive into specific documents and web sources<\/strong> you add<\/td>\n<td><strong>Comprehensive enterprise AI assistant<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Scope<\/td>\n<td><strong>Only<\/strong> your uploaded sources<\/td>\n<td><strong>All connected business systems<\/strong> via <strong>agents and unified search<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Actions<\/td>\n<td>Q&amp;A, summaries, new content from those sources<\/td>\n<td><strong>Automates tasks<\/strong> and finds information across systems<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><ul>\n<li>A <strong>central, secure platform for business-specific AI agents<\/strong> on Google Cloud infrastructure.<\/li>\n<li>It helps employees find information, understand data and <strong>automate tasks<\/strong>.<\/li>\n<li>For teams across <strong>marketing, sales, HR, software, R&amp;D<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The exam guide lists Gemini Enterprise capabilities as <strong>Gemini Notebook API<\/strong>, <strong>multimodal search<\/strong> and <strong>custom agent<\/strong> capabilities. The Notebook API gives programmatic access to notebooks from your own apps and workflows.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"5.19","title":"Strategy: Planning ahead","kind":"concept","html":"","videos":["BmQyXKK6sSY","t4nCGuVvSL4"],"steps":[{"title":"Video framing · Six steps to plan gen AI integration (exam core)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Video framing<\/h2><div class=\"bi\"><ul>\n<li>Nobody is truly a gen AI \"expert\" because the field keeps evolving. Some of what you learn will date quickly.<\/li>\n<li>The skills are a <strong>foundation<\/strong>. Analogy: <strong>learning to surf<\/strong>. You learned to balance, but the waves keep changing.<\/li>\n<li>Have a plan, but stay <strong>flexible<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Six steps to plan gen AI integration (exam core)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Establish a clear vision<\/div><div class=\"kv\"><ul>\n<li>define how gen AI fits <strong>corporate strategy<\/strong>;<\/li>\n<li>secure <strong>leadership buy-in<\/strong>;<\/li>\n<li>appoint a <strong>champion<\/strong> to drive adoption.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Prioritise high-impact use cases<\/div><div class=\"kv\">aligned to business goals. Weigh <strong>technical feasibility, data readiness, transformation potential<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Invest in capabilities<\/div><div class=\"kv\"><ul>\n<li><strong>upskilling, recruitment, training<\/strong>;<\/li>\n<li>a culture of <strong>learning and experimentation<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Drive organisational change<\/div><div class=\"kv\"><ul>\n<li>proactively manage shifts in <strong>workflows, roles, mindsets<\/strong>;<\/li>\n<li><strong>agile collaboration<\/strong> and knowledge sharing to scale best practices.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Measure and demonstrate value<\/div><div class=\"kv\">track and assess impact; use data to improve and prove value.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">6<\/span><div class=\"sb\"><div class=\"kt\">Champion responsible AI<\/div><div class=\"kv\">a robust framework for <strong>fairness, transparency, privacy, security<\/strong>.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Plan for impact: how to measure","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Plan for impact: how to measure<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Define key metrics<\/div><div class=\"kv\"><ul>\n<li>aligned to objectives: <strong>ROI<\/strong>, increased revenue, reduced costs, efficiency, customer experience, security;<\/li>\n<li><strong>ROI<\/strong> = financial benefits vs costs;<\/li>\n<li>revenue = direct impact on sales and profit.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Collect and analyse data<\/div><div class=\"kv\"><ul>\n<li>tracking, surveys, existing data;<\/li>\n<li>e.g. <strong>customer satisfaction before vs after<\/strong> a gen AI chatbot;<\/li>\n<li>look for patterns.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Iterate and improve<\/div><div class=\"kv\"><ul>\n<li>if ROI is lacking, find the practical pain points;<\/li>\n<li>adjust: <strong>fine-tune models, update training data, improve prompting, integrate better into workflows<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Plan for change · Exam logistics (as stated in the course)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Plan for change<\/h2><div class=\"bi\"><p>Technology moves fast, and customers and employees expect you to keep up:\n- <strong>Regularly review and refine strategy.<\/strong>\n- <strong>Stay informed:<\/strong> industry news, research, expert opinion.\n- <strong>Engage the gen AI community:<\/strong> conferences, workshops, forums.\n- <strong>Invest in training and development<\/strong> (upskilling).\n- <strong>Attract and retain top talent<\/strong> with a creative, growth-oriented environment.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Exam logistics (as stated in the course)<\/h2><div class=\"bi\"><ul>\n<li>Register at <strong>cloud.google.com/learn/certification/generative-ai-leader<\/strong>.<\/li>\n<li><strong>Proctored<\/strong> exam, <strong>about 90 minutes<\/strong>.<\/li>\n<li>Use the course <strong>study guides<\/strong> and revisit the lessons.<\/li>\n<li>Passing earns a <strong>certification badge<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Path conclusion","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Path conclusion<\/h2><div class=\"bi\"><p>Leading with gen AI is continuous learning and adaptation. Set a clear vision, stay flexible, refine strategy with data, and build a culture of learning and innovation.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]}]}],"cards":[{"l":"1.1","t":"fact","tags":["exam"],"q":"Does the Google Cloud Generative AI Leader certification require technical experience?","a":"No. It targets all roles and backgrounds; no technical experience required.","id":"c1-001","x":"1.1"},{"l":"1.1","t":"list","tags":["exam"],"q":"List the 5 courses of the Gen AI Leader path, in order.","a":"1 Beyond the Chatbot · 2 Unlock Foundational Concepts · 3 Navigate the Landscape · 4 Gen AI Apps: Transform Your Work · 5 Gen AI Agents: Transform Your Organization","id":"c1-002","x":"1.1"},{"l":"1.2","t":"def","tags":["fundamentals"],"q":"Define generative AI (course wording, short).","a":"A type of AI that creates new content and ideas — text, images, music, code.","id":"c1-003","x":"1.1"},{"l":"1.2","t":"trap","tags":["fundamentals","products"],"q":"Gemini vs the Gemini app — what is each?","a":"Gemini = one of Google's gen AI models. The Gemini app = Google's gen AI chatbot application built on that model. Gen AI is a technology embedded into apps, not an app itself.","id":"c1-004","x":"1.1"},{"l":"1.2","t":"list","tags":["fundamentals"],"q":"What are the 4 primary ways to use gen AI?","a":"Create · Summarize · Discover · Automate","id":"c1-005","x":"1.1"},{"l":"1.2","t":"scenario","tags":["fundamentals"],"q":"A bank uses gen AI anomaly detection to flag fraudulent transactions in real time. Which of the 4 uses?","a":"Discover (monitoring real-time events / finding information at the right time).","id":"c1-006","x":"1.1"},{"l":"1.2","t":"scenario","tags":["fundamentals"],"q":"A team converts content into accessible formats in real time with Text-to-Speech and Translation APIs. Which of the 4 uses?","a":"Automate (automated format conversion).","id":"c1-007","x":"1.1"},{"l":"1.2","t":"scenario","tags":["fundamentals"],"q":"Project managers auto-generate meeting notes with decisions and action items. Which use, and which tool?","a":"Summarize — Gemini in Google Meet.","id":"c1-008","x":"1.1"},{"l":"1.2","t":"product","tags":["products"],"q":"Which tool does the course cite for generating starter code for large software projects?","a":"Gemini Code Assist.","id":"c1-009","x":"1.1"},{"l":"1.2","t":"product","tags":["products"],"q":"Which tool does the course cite for automating contract review and information extraction?","a":"Document AI.","id":"c1-010","x":"1.1"},{"l":"1.2","t":"product","tags":["products"],"q":"Which tool does the course cite for creating video tutorials for customers?","a":"Google Vids.","id":"c1-011","x":"1.1"},{"l":"1.2","t":"product","tags":["products"],"q":"Which product gives employees agents combining Gemini reasoning, Google-quality search and enterprise data wherever it's hosted?","a":"Gemini Enterprise.","id":"c1-012","x":"1.1"},{"l":"1.2","t":"product","tags":["products"],"q":"Personalised streaming recommendations to reduce churn — which Google Cloud product does the course name?","a":"Agent Search.","id":"c1-013","x":"1.1"},{"l":"1.2","t":"def","tags":["fundamentals"],"q":"What is multimodal gen AI?","a":"Gen AI that processes and integrates several formats (text, images, video, audio, PDFs) individually or combined at the same time.","id":"c1-014","x":"1.1"},{"l":"1.2","t":"scenario","tags":["fundamentals"],"q":"Manufacturing safety: camera feeds + sensor data detect spills and alert workers. What capability is this an example of?","a":"Multimodal gen AI (sensor data + video).","id":"c1-015","x":"1.1"},{"l":"1.2","t":"list","tags":["strategy"],"q":"Key takeaway of 'business impact': businesses use Google Cloud gen AI for which 4 benefits?","a":"Decision-making · efficiency & productivity · creative idea generation · cost reduction through automation.","id":"c1-016","x":"1.1"},{"l":"1.3","t":"def","tags":["products","platform"],"q":"What was Gemini Enterprise Agent Platform formerly called, and what is it?","a":"Vertex AI. Google Cloud's unified ML platform to build, train and deploy ML models and AI apps.","id":"c1-017","x":"2.4"},{"l":"1.3","t":"product","tags":["products","platform"],"q":"Through which Agent Platform service do you access Google's large gen AI models across modalities?","a":"Model Garden.","id":"c1-018","x":"2.4"},{"l":"1.3","t":"def","tags":["products","search"],"q":"What is Agent Search (as described in the automotive use case)?","a":"A fully managed, scalable Google Cloud service that lets developers add advanced search over large volumes of multimodal data to their apps.","id":"c1-019","x":"2.3"},{"l":"1.3","t":"scenario","tags":["usecase","products"],"q":"Automotive virtual assistant: which product understood the driver, and which found the answer?","a":"Gemini understood the questions; Agent Search retrieved the most relevant answer from manuals, FAQs, help articles, videos, guides.","id":"c1-020","x":"2.4"},{"l":"1.3","t":"list","tags":["usecase"],"q":"3 results of the automotive virtual assistant use case?","a":"Reduced support costs · improved efficiency · enhanced accessibility.","id":"c1-021","x":"2.4"},{"l":"1.3","t":"fact","tags":["platform"],"q":"One-liner: what is Agent Platform the key to?","a":"Creating and deploying custom gen AI solutions for your business.","id":"c1-022","x":"2.4"},{"l":"1.4","t":"def","tags":["fundamentals"],"q":"Define foundation models.","a":"Large AI models trained on enormous, diverse datasets that can be adapted to a wide range of downstream tasks.","id":"c1-023","x":"1.1"},{"l":"1.4","t":"trap","tags":["fundamentals"],"q":"Traditional AI model vs foundation model?","a":"Traditional: single purpose, specific data (e.g. spam filter). Foundation: massive diverse data, adaptable to many tasks.","id":"c1-024","x":"1.1"},{"l":"1.4","t":"list","tags":["fundamentals"],"q":"3 key features of foundation models?","a":"Trained on diverse data · flexible (one model, many use cases) · adaptable (specialise via targeted training).","id":"c1-025","x":"1.1"},{"l":"1.4","t":"trap","tags":["fundamentals"],"q":"True or false: all foundation models are LLMs.","a":"False. All LLMs are foundation models; LLMs are the language-specialised type.","id":"c1-026","x":"1.1"},{"l":"1.4","t":"product","tags":["models"],"q":"Chirp is trained on what, for what?","a":"Multilingual audio — speech recognition (voice assistants, transcription, translation).","id":"c1-027","x":"1.4"},{"l":"1.4","t":"product","tags":["models"],"q":"Nano Banana is trained primarily on what, for what?","a":"Images + text descriptions; generates and edits images from text. Course name for Gemini's native image generation/editing. Exam guide names Imagen as the image model — learn both.","id":"c1-028","x":"1.4"},{"l":"1.4","t":"scenario","tags":["fundamentals"],"q":"A decision tree that predicts customer churn — foundation model or not?","a":"Not a foundation model (narrow, single-task).","id":"c1-029","x":"1.1"},{"l":"1.5","t":"number","tags":["usecase"],"q":"Morrisons Product Finder: usage over Easter 2025?","a":"~50,000 hits per day.","id":"c1-030","x":"2.4"},{"l":"1.5","t":"scenario","tags":["usecase","products"],"q":"Morrisons Product Finder: which 3 Google components and how did it work?","a":"BigQuery (store product locations) + Vertex AI/Agent Platform + Gemini, which translates the shopper's query into product and location IDs.","id":"c1-031","x":"2.4"},{"l":"1.5","t":"fact","tags":["strategy"],"q":"Benefit of a pre-trained model cited by Morrisons regarding testing?","a":"You don't exhaustively test the model itself — you test how it works in your environment.","id":"c1-032","x":"2.4"},{"l":"1.6","t":"def","tags":["prompting"],"q":"What is a prompt?","a":"The input given to a (foundation) model to produce an output.","id":"c1-033","x":"3.2"},{"l":"1.6","t":"fact","tags":["prompting"],"q":"3 synonyms used for writing prompts?","a":"Prompting, prompt engineering, prompt design.","id":"c1-034","x":"3.2"},{"l":"1.6","t":"trap","tags":["prompting"],"q":"Why are foundation models more flexible to prompt than many AI models?","a":"Many models accept only one input type (numbers, emails, images); (multimodal) foundation models accept a much broader set of inputs.","id":"c1-035","x":"3.2"},{"l":"1.7","t":"scenario","tags":["prompting"],"q":"You want a summary of troubleshooting steps from a support call. What input type do you give the model?","a":"An audio file (the call recording) plus the request.","id":"c1-036","x":"3.2"},{"l":"1.8","t":"fact","tags":["strategy"],"q":"Google's mission statement (as quoted in the course)?","a":"Organize the world's information and make it universally accessible and useful.","id":"c1-037","x":"2.1"},{"l":"1.8","t":"number","tags":["strategy"],"q":"When did Google launch Google Cloud?","a":"2008.","id":"c1-038","x":"2.1"},{"l":"1.8","t":"list","tags":["strategy"],"q":"5 reasons to build on Google's gen AI ecosystem?","a":"Individual productivity & efficiency · continuous improvement · responsible AI · enterprise ready · open approach.","id":"c1-039","x":"2.1"},{"l":"1.8","t":"product","tags":["security"],"q":"What is SAIF?","a":"Secure AI Framework — Google's tools and best practices for building secure AI systems.","id":"c1-040","x":"4.2"},{"l":"1.8","t":"product","tags":["security"],"q":"Which Google offering provides threat intelligence to protect AI systems from cyberattacks?","a":"Mandiant.","id":"c1-041","x":"4.2"},{"l":"1.8","t":"list","tags":["strategy"],"q":"Compliance certifications cited as making Google Cloud 'enterprise ready'?","a":"ISO 27001, SOC 2, HIPAA.","id":"c1-042","x":"2.1"},{"l":"1.8","t":"list","tags":["strategy"],"q":"Examples of Google's 'open approach'?","a":"Contributions to TensorFlow and PyTorch · open models and datasets · support for open standards.","id":"c1-043","x":"2.1"},{"l":"1.8","t":"list","tags":["strategy"],"q":"Continuous improvement benefits of Google's ecosystem?","a":"Automatic model upgrades · early access to new features · security patches and updates.","id":"c1-044","x":"2.1"},{"l":"1.8","t":"list","tags":["strategy"],"q":"3 elements of the most successful gen AI implementations?","a":"Clear vision · focus on impactful use cases · tracking results.","id":"c1-045","x":"2.1"},{"l":"1.9","t":"def","tags":["strategy"],"q":"Top-down vs bottom-up gen AI strategy?","a":"Top-down: leadership sets a clear vision aligned to business priorities (priorities first, then AI). Bottom-up: teams closest to problems share challenges and experiment. Use both simultaneously.","id":"c1-046","x":"4.1"},{"l":"1.9","t":"scenario","tags":["strategy"],"q":"Who is primarily responsible for securing funding and resources for gen AI?","a":"Executives / high-level management.","id":"c1-047","x":"4.1"},{"l":"1.9","t":"scenario","tags":["strategy"],"q":"Who is primarily responsible for identifying use cases in daily workflows and experimenting with tools?","a":"Mid-level managers and individual contributors.","id":"c1-048","x":"4.1"},{"l":"1.9","t":"scenario","tags":["strategy","responsible"],"q":"Who establishes ethical guidelines for responsible AI use?","a":"Executives / high-level management.","id":"c1-049","x":"4.3"},{"l":"1.9","t":"list","tags":["strategy"],"q":"6 areas of the multi-directional gen AI strategy?","a":"Strategic focus · exploration · responsible AI · resourcing · impact · continuous improvement.","id":"c1-050","x":"4.1"},{"l":"1.9","t":"list","tags":["strategy"],"q":"Criteria for prioritising gen AI use cases (strategic focus)?","a":"Feasible, actionable, affordable, high anticipated business value / ROI.","id":"c1-051","x":"4.1"},{"l":"1.9","t":"fact","tags":["strategy"],"q":"Where should initial gen AI exploration happen?","a":"In low-risk areas of the business.","id":"c1-052","x":"4.1"},{"l":"1.9","t":"list","tags":["security","products"],"q":"Which 3 enterprise tools support data governance in the strategy lesson, and what does each do?","a":"Cloud Data Loss Prevention (discover/classify/de-identify data) · Cloud Key Management Service (encryption keys) · Google SecOps (detect/respond to threats).","id":"c1-053","x":"4.2"},{"l":"1.9","t":"fact","tags":["strategy"],"q":"Why does top-down matter even for bottom-up experiments?","a":"It gives experiments a place in the overall strategy and keeps them safe and responsible.","id":"c1-054","x":"4.1"},{"l":"1.10","t":"def","tags":["strategy"],"q":"What is the creative matrix?","a":"A brainstorming method: axis 1 = gen AI options (product/modality), axis 2 = business items (personas/workflows/goals); sticky-note ideas at intersections, then rate impact vs effort.","id":"c1-055","x":"4.1"},{"l":"1.10","t":"list","tags":["strategy"],"q":"After filling the creative matrix, what 2 dimensions do you evaluate ideas on?","a":"Impact and feasibility (how much work to build).","id":"c1-056","x":"4.1"},{"l":"1.11","t":"def","tags":["strategy"],"q":"Augmentation vs automation?","a":"Augmentation: gen AI enhances human strategic work (critical thinking, creativity, relationships, planning). Automation: gen AI takes over repetitive/rule-based or time-consuming tasks.","id":"c1-057","x":"4.1"},{"l":"1.11","t":"scenario","tags":["strategy"],"q":"A chatbot answers basic pricing/availability questions for sales. Augmentation or automation?","a":"Automation.","id":"c1-058","x":"4.1"},{"l":"1.11","t":"scenario","tags":["strategy"],"q":"An analyst uses gen AI reports to advise clients on investments. Augmentation or automation?","a":"Augmentation.","id":"c1-059","x":"4.1"},{"l":"1.11","t":"list","tags":["strategy","responsible"],"q":"4 roles for humans-in-the-loop even in automation?","a":"Data selection & preparation · prompt design & refinement · output evaluation & refinement · continuous monitoring & feedback.","id":"c1-060","x":"4.3"},{"l":"1.11","t":"fact","tags":["strategy"],"q":"Principle: shift human responsibility from ___ to ___.","a":"From task execution to strategic thinking.","id":"c1-061","x":"4.1"},{"l":"1.12","t":"number","tags":["usecase"],"q":"Warner Bros. Discovery Caption AI results?","a":"~50% reduction in overall costs; ~80% reduction in time to caption vs manual.","id":"c1-062","x":"3.1"},{"l":"1.12","t":"scenario","tags":["usecase","responsible"],"q":"Caption AI workflow — what does the human do?","a":"AI delivers a time-coded, formatted caption file; a human verifies words and sync (human-in-the-loop).","id":"c1-063","x":"4.3"},{"l":"1.12","t":"fact","tags":["platform"],"q":"What platform property did WBD value in Vertex AI / Agent Platform?","a":"It is model-agnostic — lets them pick the best model per use case beyond Google's own.","id":"c1-064","x":"3.1"},{"l":"2.1","t":"list","tags":["fundamentals"],"q":"Two developments (around 2022) behind the gen AI explosion?","a":"LLMs became far more capable · computing power for training/deploying became widely available.","id":"c2-001","x":"1.1"},{"l":"2.2","t":"def","tags":["fundamentals"],"q":"Define AI, ML and gen AI in one line each.","a":"AI: broad field of machines doing tasks needing human intelligence. ML: subset of AI where machines learn from data. Gen AI: application/subset that creates new content.","id":"c2-002","x":"1.1"},{"l":"2.2","t":"def","tags":["fundamentals"],"q":"In this course, what is 'the model'?","a":"The math (a system of equations with many parameters) built from data: input in, output out. Different data → different models.","id":"c2-003","x":"1.1"},{"l":"2.2","t":"trap","tags":["fundamentals"],"q":"Predictive (traditional) AI vs generative AI?","a":"Predictive analyses data to predict/classify (spam or not). Generative learns patterns in data and creates new, similar content.","id":"c2-004","x":"1.1"},{"l":"2.3","t":"fact","tags":["data"],"q":"How do ML models make predictions (vs humans)?","a":"They find patterns in data and calculate the likelihood (probability) of outcomes; humans use intuition.","id":"c2-005","x":"1.2"},{"l":"2.3","t":"list","tags":["data"],"q":"5 data-quality factors?","a":"Accuracy · completeness · representativeness · consistency · relevance.","id":"c2-006","x":"1.2"},{"l":"2.3","t":"list","tags":["data"],"q":"3 data-accessibility factors?","a":"Availability · cost · format.","id":"c2-007","x":"1.2"},{"l":"2.3","t":"scenario","tags":["data"],"q":"A customer-preference dataset is missing a demographic, giving biased generalisations. Which quality factor failed?","a":"Representativeness (representative/inclusive data).","id":"c2-008","x":"1.2"},{"l":"2.3","t":"scenario","tags":["data"],"q":"Some records label sizes in cm, others in inches, confusing the model. Which quality factor failed?","a":"Consistency.","id":"c2-009","x":"1.2"},{"l":"2.3","t":"scenario","tags":["data"],"q":"A meteorologist predicts from just one day of data. Which quality factor failed?","a":"Completeness (dataset size / sample).","id":"c2-010","x":"1.2"},{"l":"2.3","t":"scenario","tags":["data"],"q":"Needed data exists but is behind paywalls or privacy restrictions. Which accessibility factor?","a":"Availability.","id":"c2-011","x":"1.2"},{"l":"2.3","t":"scenario","tags":["data"],"q":"London traffic data used to predict Kansas crop yields. Which quality factor failed?","a":"Relevance.","id":"c2-012","x":"1.2"},{"l":"2.4","t":"trap","tags":["data"],"q":"Structured vs unstructured data?","a":"Structured: predefined format, rows/columns, relational DBs (orders, bank statements, CSV). Unstructured: no predefined structure — text docs, emails, images, audio, video.","id":"c2-013","x":"1.2"},{"l":"2.4","t":"scenario","tags":["data"],"q":"A medical record with date of birth, address, vaccination history fields — structured or unstructured?","a":"Structured.","id":"c2-014","x":"1.2"},{"l":"2.4","t":"scenario","tags":["data"],"q":"A free-text product review — structured or unstructured?","a":"Unstructured.","id":"c2-015","x":"1.2"},{"l":"2.4","t":"fact","tags":["data"],"q":"What is the essential first step for any AI implementation (data lesson)?","a":"Understanding your company's data — type, quality, availability, structure.","id":"c2-016","x":"1.2"},{"l":"2.5","t":"list","tags":["ml"],"q":"3 primary ML approaches and their data?","a":"Supervised (labeled data) · unsupervised (unlabeled data) · reinforcement (interaction + feedback/rewards).","id":"c2-017","x":"1.1"},{"l":"2.5","t":"def","tags":["ml"],"q":"Labeled vs unlabeled data?","a":"Labeled: has tags (name/type/number) giving meaning. Unlabeled: raw, untagged.","id":"c2-018","x":"1.1"},{"l":"2.5","t":"scenario","tags":["ml"],"q":"Spam filter trained on emails tagged spam/not spam — which learning type?","a":"Supervised.","id":"c2-019","x":"1.1"},{"l":"2.5","t":"scenario","tags":["ml"],"q":"Discovering customer segments from purchase history without predefined labels — which learning type?","a":"Unsupervised.","id":"c2-020","x":"1.1"},{"l":"2.5","t":"scenario","tags":["ml"],"q":"A game AI learns by trial and error to maximise cumulative reward — which learning type?","a":"Reinforcement.","id":"c2-021","x":"1.1"},{"l":"2.5","t":"scenario","tags":["ml"],"q":"Topic modelling on news articles — which learning type?","a":"Unsupervised.","id":"c2-022","x":"1.1"},{"l":"2.5","t":"product","tags":["ml","products"],"q":"Fraud anomaly detection on transactions — which product and learning type (course example)?","a":"BigQuery ML — unsupervised.","id":"c2-023","x":"1.1"},{"l":"2.5","t":"product","tags":["ml","products"],"q":"Predictive maintenance from machine sensor data — product and learning type?","a":"Agent Platform — supervised.","id":"c2-024","x":"1.1"},{"l":"2.5","t":"product","tags":["ml","products"],"q":"Product recommendations continuously refined to maximise engagement — product and learning type?","a":"Agent Platform — reinforcement learning.","id":"c2-025","x":"1.1"},{"l":"2.6","t":"list","tags":["ml","products"],"q":"5 stages of the ML lifecycle?","a":"Gather data (ingest) · prepare data · train model · deploy & predict · manage model.","id":"c2-026","x":"1.1"},{"l":"2.6","t":"product","tags":["products","data"],"q":"Which Google Cloud tool handles real-time streaming data ingestion?","a":"Pub/Sub.","id":"c2-027","x":"1.2"},{"l":"2.6","t":"product","tags":["products","data"],"q":"Which tool is suited to storing unstructured data?","a":"Cloud Storage.","id":"c2-028","x":"1.2"},{"l":"2.6","t":"product","tags":["products","data"],"q":"Which tools manage structured data at ingestion?","a":"Cloud SQL and Spanner.","id":"c2-029","x":"1.2"},{"l":"2.6","t":"product","tags":["products","data"],"q":"Which tool does the course name for discovering datasets across the organisation (governance)? What is it called now?","a":"Course: Data Catalog. Note: Data Catalog was discontinued on 1 June 2026, replaced by Knowledge Catalog (formerly Dataplex Universal Catalog). Not named in the exam guide.","id":"c2-030","x":"1.2"},{"l":"2.6","t":"product","tags":["products","data"],"q":"Which tool is used in data prep to filter, fix inconsistencies and handle missing values?","a":"BigQuery.","id":"c2-031","x":"1.2"},{"l":"2.6","t":"product","tags":["products","platform"],"q":"Which Agent Platform tool manages the features a model uses?","a":"Agent Platform Feature Store.","id":"c2-032","x":"1.1"},{"l":"2.6","t":"product","tags":["products","platform"],"q":"Which Agent Platform tool automates ML tasks/workflows?","a":"Agent Platform Pipelines.","id":"c2-033","x":"1.1"},{"l":"2.6","t":"list","tags":["platform"],"q":"Model management activities listed in the lifecycle?","a":"Versioning · performance tracking · drift monitoring · feature management (Feature Store) · storing models · automation (Pipelines). Course says 'store models in Model Garden'; precise: Model Registry manages your model versions; Model Garden is for discovering and deploying available models.","id":"c2-034","x":"1.1"},{"l":"2.6","t":"def","tags":["platform"],"q":"What is drift monitoring?","a":"Watching for changes in a model's accuracy/performance over time.","id":"c2-035","x":"1.1"},{"l":"2.6","t":"product","tags":["security"],"q":"Which service ensures only the right people access data across the lifecycle?","a":"Identity and Access Management (IAM).","id":"c2-036","x":"4.2"},{"l":"2.7","t":"def","tags":["fundamentals"],"q":"What is deep learning?","a":"A subset of ML using (multi-layer) artificial neural networks to process complex patterns.","id":"c2-037","x":"1.1"},{"l":"2.7","t":"def","tags":["fundamentals","ml"],"q":"What is semi-supervised learning?","a":"Training on a small amount of labeled data plus a large amount of unlabeled data.","id":"c2-038","x":"1.1"},{"l":"2.7","t":"def","tags":["models"],"q":"What are diffusion models?","a":"Foundation models that generate high-quality images, audio, video by iteratively refining noise into structured data.","id":"c2-039","x":"1.1"},{"l":"2.7","t":"fact","tags":["fundamentals"],"q":"Summary: DL, foundation models, gen AI relationship?","a":"Deep learning = core technology; foundation models = architectures built on DL; gen AI = applying them to create new content.","id":"c2-040","x":"1.1"},{"l":"2.7","t":"def","tags":["fundamentals"],"q":"Define ML as in the definitions quiz.","a":"A subset of AI that lets machines learn from data without explicit programming, improving over time.","id":"c2-041","x":"1.1"},{"l":"2.8","t":"list","tags":["models"],"q":"8 factors when choosing a gen AI model?","a":"Modality · context window · security · availability & reliability · cost · performance · fine-tuning & customisation · ease of integration.","id":"c2-042","x":"1.1"},{"l":"2.8","t":"def","tags":["models"],"q":"What is the context window, and its trade-off?","a":"How much information the model considers at once. Larger = more coherent on long tasks but higher compute cost.","id":"c2-043","x":"1.1"},{"l":"2.8","t":"fact","tags":["models","cost"],"q":"Key cost principle when choosing models?","a":"Match the model to the task — bigger isn't always better, multimodal isn't always needed.","id":"c2-044","x":"1.1"},{"l":"2.8","t":"trap","tags":["models"],"q":"Gemini vs Gemma?","a":"Gemini: multimodal model (text, images, audio, video). Gemma: family of lightweight, open models built from Gemini research, for local/specialised deployments.","id":"c2-045","x":"1.4"},{"l":"2.8","t":"trap","tags":["models"],"q":"Imagen vs Veo (exam guide's named models)?","a":"Imagen: text-to-image diffusion model (high-quality images from text, editing). Veo: video generation from text or images. The course also mentions Nano Banana for images; the exam guide names Imagen.","id":"c2-046","x":"1.4"},{"l":"2.8","t":"list","tags":["models","platform"],"q":"Which model sources can you access via Agent Platform?","a":"Google models — exam guide lists Gemini, Gemma, Imagen, Veo (course also shows Nano Banana) — plus proprietary third-party models and openly available models.","id":"c2-047","x":"1.1"},{"l":"2.8","t":"list","tags":["models"],"q":"Availability & reliability factors to check?","a":"Uptime guarantees, redundancy, disaster recovery.","id":"c2-048","x":"1.1"},{"l":"2.8","t":"scenario","tags":["models"],"q":"You need to generate image captions (image in, text out). Which model property is mandatory?","a":"Multimodality.","id":"c2-049","x":"1.1"},{"l":"2.9","t":"def","tags":["grounding"],"q":"Define grounding.","a":"Connecting/tying a model's output to specific, verifiable sources of information (e.g. company data) to improve accuracy and relevance.","id":"c2-050","x":"3.3"},{"l":"2.9","t":"list","tags":["limitations"],"q":"6 foundation model limitations?","a":"Data dependency · knowledge cutoff · bias · fairness · hallucinations · edge cases.","id":"c2-051","x":"3.1"},{"l":"2.9","t":"def","tags":["limitations"],"q":"What is a knowledge cutoff?","a":"The last date the model was trained on new information; it doesn't know later events.","id":"c2-052","x":"3.1"},{"l":"2.9","t":"def","tags":["limitations"],"q":"What is a hallucination?","a":"Output that isn't accurate or based on real information — models can't verify against external sources, so answers can sound convincing yet be wrong.","id":"c2-053","x":"3.1"},{"l":"2.9","t":"trap","tags":["limitations","responsible"],"q":"Bias vs fairness limitation?","a":"Bias: unbalanced training data that models can amplify. Fairness: even with balanced data, defining fairness is complex and assessments only cover specific bias categories.","id":"c2-054","x":"3.1"},{"l":"2.9","t":"def","tags":["limitations"],"q":"What are edge cases?","a":"Rare, atypical scenarios that expose model weaknesses (errors, unexpected results).","id":"c2-055","x":"3.1"},{"l":"2.10","t":"list","tags":["grounding"],"q":"3 benefits of grounding?","a":"Reduces hallucinations · anchors responses in your data · builds trust (citations, confidence scores).","id":"c2-056","x":"3.3"},{"l":"2.10","t":"list","tags":["grounding","rag"],"q":"3 phases of RAG?","a":"Retrieval → augmentation (add to prompt) → generation.","id":"c2-057","x":"3.3"},{"l":"2.10","t":"fact","tags":["rag"],"q":"What kind of index does RAG retrieval use?","a":"One that understands semantic meaning, not just keywords.","id":"c2-058","x":"3.3"},{"l":"2.10","t":"trap","tags":["grounding","rag"],"q":"Relationship between grounding, RAG and fine-tuning?","a":"Course framing: grounding is the goal, RAG is a technique to achieve it, fine-tuning 'improves grounding in a domain'. Precise: grounding anchors answers to verifiable sources when the model answers; fine-tuning changes the model's parameters/behaviour and does not by itself cite sources or add fresh facts.","id":"c2-059","x":"3.3"},{"l":"2.10","t":"fact","tags":["prompting"],"q":"Main limitation of prompt engineering?","a":"Limited to the model's existing knowledge — it can't produce what the model never learned.","id":"c2-060","x":"3.2"},{"l":"2.10","t":"def","tags":["tuning"],"q":"What is fine-tuning and when is it used?","a":"Further training a pre-trained model on a task-specific dataset (adjusting parameters). Used when prompting isn't enough, for specific tasks/output formats, especially with examples of desired output.","id":"c2-061","x":"3.1"},{"l":"2.10","t":"scenario","tags":["tuning","rag","prompting"],"q":"You need answers based on today's internal policy documents. Prompting, fine-tuning or RAG?","a":"RAG (grounding in up-to-date external knowledge).","id":"c2-062","x":"3.1"},{"l":"2.10","t":"scenario","tags":["tuning"],"q":"You need a model to always output in a specific style/format and you have many examples. Best technique?","a":"Fine-tuning.","id":"c2-063","x":"3.1"},{"l":"2.10","t":"scenario","tags":["prompting"],"q":"Fastest, simplest way to give a model supplementary context?","a":"Prompt engineering.","id":"c2-064","x":"3.2"},{"l":"2.10","t":"list","tags":["responsible"],"q":"5 areas where humans-in-the-loop are key?","a":"Content moderation · sensitive applications (healthcare, finance) · high-risk decisions · pre-generation review · post-generation review.","id":"c2-065","x":"4.3"},{"l":"2.10","t":"trap","tags":["responsible"],"q":"Pre-generation vs post-generation review?","a":"Pre: experts validate outputs before deployment. Post: continuous review after deployment to adapt and improve.","id":"c2-066","x":"4.3"},{"l":"2.10","t":"list","tags":["tuning"],"q":"Fine-tuning process steps?","a":"Select pre-trained model → gather data → train → evaluate & refine.","id":"c2-067","x":"3.1"},{"l":"2.11","t":"def","tags":["security"],"q":"Define Secure AI.","a":"Preventing intentional harm: protecting AI systems from malicious attacks and misuse across the full lifecycle.","id":"c2-068","x":"4.2"},{"l":"2.11","t":"def","tags":["security"],"q":"What is data poisoning?","a":"Attackers corrupt training data with manipulated data so the model learns wrong patterns and makes flawed predictions.","id":"c2-069","x":"4.2"},{"l":"2.11","t":"list","tags":["security"],"q":"AI security risks named in the Secure AI takeaway?","a":"Data poisoning · model theft · prompt injection.","id":"c2-070","x":"4.2"},{"l":"2.11","t":"list","tags":["security"],"q":"What does SAIF help organisations do?","a":"Find and stop threats · automatically strengthen defences · manage each AI system's unique risks; integrates with existing security so models are secure by default.","id":"c2-071","x":"4.2"},{"l":"2.11","t":"product","tags":["security"],"q":"Which tool gives a centralised view of security posture across Google Cloud?","a":"Security Command Center.","id":"c2-072","x":"4.2"},{"l":"2.11","t":"product","tags":["security"],"q":"Who shares threat research to identify and disrupt malicious activity?","a":"Google Threat Intelligence Group (GTIG) and Mandiant (plus Mandiant Consulting for guidance).","id":"c2-073","x":"4.2"},{"l":"2.11","t":"fact","tags":["security"],"q":"How does Google Cloud protect data at the infrastructure level?","a":"Secure-by-design infrastructure; encryption in transit and at rest; IAM for granular access.","id":"c2-074","x":"4.2"},{"l":"2.12","t":"trap","tags":["responsible","security"],"q":"Secure AI vs Responsible AI?","a":"Secure AI: intentional harm (attacks). Responsible AI: avoiding intentional AND unintentional harm. Security is the foundation of responsible AI.","id":"c2-075","x":"4.3"},{"l":"2.12","t":"list","tags":["responsible"],"q":"Responsible AI themes covered?","a":"Security foundation · transparency · privacy · data quality, bias & fairness · accountability & explainability · legal implications.","id":"c2-076","x":"4.3"},{"l":"2.12","t":"fact","tags":["responsible"],"q":"How is privacy protected in training data?","a":"Anonymising or pseudonymising data; safeguards against models leaking sensitive training data.","id":"c2-077","x":"4.3"},{"l":"2.12","t":"def","tags":["responsible"],"q":"Purpose of explainable AI?","a":"Make AI decision-making transparent and understandable — trust, debugging, uncovering hidden bias.","id":"c2-078","x":"4.3"},{"l":"2.12","t":"product","tags":["responsible","products"],"q":"Which Google Cloud tool helps understand model outputs and identify bias?","a":"Vertex Explainable AI.","id":"c2-079","x":"4.3"},{"l":"2.12","t":"list","tags":["responsible"],"q":"Key legal areas in AI development?","a":"Data privacy · non-discrimination · intellectual property · product liability.","id":"c2-080","x":"4.3"},{"l":"2.12","t":"scenario","tags":["responsible"],"q":"A resume-screening tool favours one demographic because of historical hiring data. What issue?","a":"Bias inherited from training data → fairness problem.","id":"c2-081","x":"4.3"},{"l":"2.12","t":"fact","tags":["responsible"],"q":"How can AI perpetuate societal biases?","a":"Through biased training data, biased developers, or biased deployment environments.","id":"c2-082","x":"4.3"},{"l":"2.12","t":"fact","tags":["responsible"],"q":"Fairness requires what?","a":"Accountability — knowing who is responsible and how the AI decides (explainability).","id":"c2-083","x":"4.3"},{"l":"3.1","t":"list","tags":["landscape"],"q":"3 questions Course 3 answers?","a":"What are the layers of building gen AI · what Google Cloud options exist · when to choose one solution over another.","id":"c3-001","x":"1.3"},{"l":"3.2","t":"list","tags":["landscape"],"q":"5 layers of the gen AI landscape (bottom → top)?","a":"Infrastructure · models · platform · agents · gen AI powered applications.","id":"c3-002","x":"1.3"},{"l":"3.2","t":"def","tags":["landscape","agents"],"q":"Agent layer definition (layers lesson)?","a":"Software that works out how best to achieve a goal using its inputs and available tools: autonomous action and multi-step tasks a model alone can't do. Course says agents 'independently set goals'; in practice they pursue a goal they are given.","id":"c3-003","x":"1.3"},{"l":"3.2","t":"def","tags":["landscape"],"q":"What does the platform layer provide?","a":"APIs, data management, model deployment tools — the backbone bridging models and agents and hiding infrastructure complexity.","id":"c3-004","x":"1.3"},{"l":"3.2","t":"def","tags":["landscape"],"q":"What does the infrastructure layer include?","a":"Core compute: physical hardware (servers, GPUs, TPUs) and software to store and run models and data.","id":"c3-005","x":"1.3"},{"l":"3.2","t":"fact","tags":["landscape"],"q":"Engine analogy: what is each layer?","a":"Infrastructure = foundation · models = core · platform = connects everything · agents = drivers · applications = vehicles.","id":"c3-006","x":"1.3"},{"l":"3.2","t":"fact","tags":["landscape"],"q":"Which layer is the 'brain' of the agent?","a":"The model layer.","id":"c3-007","x":"1.3"},{"l":"3.3","t":"def","tags":["agents"],"q":"Definition of a gen AI agent (memorise).","a":"An application that tries to achieve a goal by observing the world and acting upon it using the tools at its disposal.","id":"c3-008","x":"1.3"},{"l":"3.3","t":"list","tags":["agents"],"q":"3 capabilities agents bring to applications?","a":"Understanding/responding to natural language · automating complex multi-step tasks · personalisation.","id":"c3-009","x":"1.3"},{"l":"3.3","t":"def","tags":["agents"],"q":"What is a multi-agent system?","a":"Several specialised agents working together within one application.","id":"c3-010","x":"1.3"},{"l":"3.3","t":"product","tags":["agents","products"],"q":"Which Google Cloud tool lets teams create agents in natural language instead of complex code?","a":"AI Applications.","id":"c3-011","x":"1.3"},{"l":"3.3","t":"fact","tags":["agents"],"q":"Agents vs applications — roles?","a":"Agents add intelligence and automation; applications provide the UI, framework, goals and purpose.","id":"c3-012","x":"1.3"},{"l":"3.4","t":"trap","tags":["agents"],"q":"Conversational vs workflow agents?","a":"Conversational: understand intent and dialogue with users. Workflow: automate tasks/multi-step processes triggered by events.","id":"c3-013","x":"1.3"},{"l":"3.4","t":"list","tags":["agents"],"q":"5 steps of a conversational agent?","a":"You provide input → agent understands intent → calls a tool if needed → generates a response → delivers it.","id":"c3-014","x":"1.3"},{"l":"3.4","t":"scenario","tags":["agents"],"q":"An agent processes orders, updates inventory, sends shipping notices and handles returns. Which type?","a":"Workflow agent.","id":"c3-015","x":"1.3"},{"l":"3.4","t":"scenario","tags":["agents"],"q":"An agent inspects security logs, flags anomalies, opens a ticket and assigns humans. Which type and family?","a":"Workflow agent; security agent use case.","id":"c3-016","x":"1.3"},{"l":"3.4","t":"product","tags":["agents","products"],"q":"Which Gemini feature is cited for autonomous in-depth research reports?","a":"Gemini Deep Research.","id":"c3-017","x":"1.3"},{"l":"3.4","t":"list","tags":["agents"],"q":"6 agent use-case families?","a":"Customer service · employee productivity · creative · code · data · security.","id":"c3-018","x":"1.3"},{"l":"3.5","t":"list","tags":["agents"],"q":"2 elements that distinguish agents from standalone models?","a":"A reasoning loop and tools.","id":"c3-019","x":"1.3"},{"l":"3.5","t":"list","tags":["agents"],"q":"4 steps of the reasoning loop?","a":"Observe · interpret · plan · act (repeat until goal or stopping point).","id":"c3-020","x":"1.3"},{"l":"3.5","t":"def","tags":["agents","tools"],"q":"What are tools for an agent?","a":"Functionalities letting the agent interact with its environment — data, software apps, even physical robots.","id":"c3-021","x":"2.5"},{"l":"3.5","t":"list","tags":["prompting","agents"],"q":"2 prompt-engineering frameworks named for reasoning loops?","a":"ReAct and chain-of-thought (CoT).","id":"c3-022","x":"3.2"},{"l":"3.5","t":"scenario","tags":["agents"],"q":"Writing assistant: generating grammatical, stylistic text — model or agent function?","a":"Model.","id":"c3-023","x":"1.3"},{"l":"3.5","t":"scenario","tags":["agents"],"q":"Learning platform: tracking progress and adapting the learning plan — model or agent function?","a":"Agent.","id":"c3-024","x":"1.3"},{"l":"3.6","t":"list","tags":["platform"],"q":"6 key features of Agent Platform?","a":"Open & flexible (no lock-in) · powerful infrastructure · pre-trained models · comprehensive tooling · customisation (built-in IDE) · easy integration (APIs).","id":"c3-025","x":"2.4"},{"l":"3.6","t":"def","tags":["platform"],"q":"What is MLOps?","a":"Practices/tools that automate, standardise and manage the ML project lifecycle for collaboration and continuous improvement.","id":"c3-026","x":"2.4"},{"l":"3.6","t":"list","tags":["platform"],"q":"Training capabilities Agent Platform manages for you?","a":"Fully managed compute · ML-optimised training jobs · distributed training · hyperparameter optimisation · enterprise security.","id":"c3-027","x":"2.4"},{"l":"3.6","t":"scenario","tags":["platform"],"q":"You need to track experiments, manage model versions and keep a change record. Which tool?","a":"Model Registry.","id":"c3-028","x":"2.4"},{"l":"3.6","t":"scenario","tags":["platform"],"q":"A deployed model's performance is declining (drift/skew). Which tool detects it and triggers retraining?","a":"Model Monitoring.","id":"c3-029","x":"2.4"},{"l":"3.6","t":"scenario","tags":["platform"],"q":"Automate the ML pipeline from preprocessing to deployment. Which tool?","a":"Agent Platform Pipelines.","id":"c3-030","x":"2.4"},{"l":"3.6","t":"scenario","tags":["platform"],"q":"Compare candidate models' performance to pick the best. Which tool?","a":"Model Evaluation.","id":"c3-031","x":"2.4"},{"l":"3.6","t":"scenario","tags":["platform"],"q":"Share, serve and reuse ML features consistently across teams. Which tool?","a":"Agent Platform Feature Store.","id":"c3-032","x":"2.4"},{"l":"3.7","t":"number","tags":["models","platform"],"q":"What does Model Garden offer (course figure on size)?","a":"Discover, customise and deploy models from Google, partners and open source. Course said 'over 160 models'; the figure keeps changing — don't memorise the number.","id":"c3-033","x":"2.4"},{"l":"3.7","t":"def","tags":["models","platform"],"q":"What does Model Garden let you do?","a":"Discover, customise and deploy existing models from Google and partners (Google, third-party, open-source).","id":"c3-034","x":"2.4"},{"l":"3.7","t":"list","tags":["models"],"q":"4 model categories in Model Garden?","a":"First-party foundation models · first-party pre-trained APIs · open models · third-party models.","id":"c3-035","x":"2.4"},{"l":"3.7","t":"product","tags":["models"],"q":"Which model in Model Garden is for text-to-image? Text/image-to-video? Speech-to-text?","a":"Imagen · Veo · Chirp (2.0).","id":"c3-036","x":"2.4"},{"l":"3.7","t":"list","tags":["models"],"q":"Examples of open models in Model Garden?","a":"Gemma 2, CodeGemma, PaliGemma, Llama 3.1/3.2, Mistral, Falcon, BERT, FLAN-T5…","id":"c3-037","x":"2.4"},{"l":"3.7","t":"list","tags":["models"],"q":"First-party pre-trained APIs listed?","a":"Speech-to-Text, Natural Language, Translation, Vision.","id":"c3-038","x":"2.4"},{"l":"3.7","t":"trap","tags":["models","platform"],"q":"Custom training vs AutoML on Agent Platform?","a":"Custom: any framework (PyTorch, TensorFlow, scikit-learn, XGBoost), full control. AutoML: train models with minimal technical knowledge and effort.","id":"c3-039","x":"2.4"},{"l":"3.7","t":"list","tags":["platform"],"q":"AutoML objectives per data type?","a":"Image: classification, object detection. Video: action recognition, classification, object tracking. Tabular: classification/regression, forecasting.","id":"c3-040","x":"2.4"},{"l":"3.7","t":"scenario","tags":["models"],"q":"Translation for a global e-commerce site, fast, moderate budget. Build custom or Model Garden?","a":"Model Garden (existing model / pre-trained API).","id":"c3-041","x":"2.4"},{"l":"3.7","t":"scenario","tags":["models"],"q":"Researcher needs complete control of architecture and training for protein folding. Option?","a":"Build a custom model on Agent Platform.","id":"c3-042","x":"2.4"},{"l":"3.8","t":"scenario","tags":["usecase"],"q":"Cymbal Aerospace: two-layered solution for CAD files?","a":"Agent Platform AutoML extracts metadata from CAD files; Gemini (via Pipelines) turns it into natural-language summaries/answers.","id":"c3-043","x":"2.4"},{"l":"3.8","t":"number","tags":["usecase"],"q":"Cymbal Aerospace results?","a":"Product development cycles 15% faster · design review time -20% · manufacturing planning bottlenecks eliminated.","id":"c3-044","x":"2.4"},{"l":"3.8","t":"fact","tags":["usecase","platform"],"q":"How did Cymbal Aerospace deploy without managing servers?","a":"Serverless infrastructure; Agent Platform handled MLOps (scaling, infrastructure).","id":"c3-045","x":"2.4"},{"l":"3.9","t":"def","tags":["infrastructure"],"q":"Infrastructure layer = ?","a":"Hardware + software providing compute, storage and networking to train, deploy and scale models.","id":"c3-046","x":"2.1"},{"l":"3.9","t":"trap","tags":["infrastructure"],"q":"GPU vs TPU?","a":"GPU: originally for graphics, general-purpose parallel processing. TPU: Google's custom chip optimised specifically for AI.","id":"c3-047","x":"2.1"},{"l":"3.9","t":"def","tags":["infrastructure"],"q":"What is a hypercomputer?","a":"A supercomputer made by linking many nodes (with GPUs/TPUs) over high-speed networks to act as one unit.","id":"c3-048","x":"2.1"},{"l":"3.9","t":"def","tags":["infrastructure"],"q":"What does throughput mean in storage?","a":"The amount of work done within a specific period of time.","id":"c3-049","x":"2.1"},{"l":"3.9","t":"list","tags":["infrastructure"],"q":"3 benefits of Google Cloud infrastructure for teams?","a":"Scalability · performance · cost-effectiveness.","id":"c3-050","x":"2.1"},{"l":"3.9","t":"fact","tags":["infrastructure"],"q":"What network property does Google's global fiber network provide?","a":"High bandwidth, low latency.","id":"c3-051","x":"2.1"},{"l":"3.10","t":"def","tags":["edge"],"q":"Define edge computing.","a":"Running AI on devices or servers closer to the data source or point of need.","id":"c3-052","x":"2.1"},{"l":"3.10","t":"list","tags":["edge"],"q":"Benefits of edge AI?","a":"Real-time responsiveness · data privacy · less reliance on internet connectivity (offline).","id":"c3-053","x":"2.1"},{"l":"3.10","t":"product","tags":["edge","products"],"q":"What is LiteRT?","a":"Lite Runtime — Google's high-performance runtime to run ML models efficiently on-device.","id":"c3-054","x":"2.1"},{"l":"3.10","t":"product","tags":["edge","models"],"q":"What is Gemini Nano and where is it used?","a":"Google's most efficient, compact Gemini model for on-device use. Pixel (Call Notes, Recorder summaries) and Android via AI Edge SDK.","id":"c3-055","x":"2.1"},{"l":"3.10","t":"list","tags":["edge","platform"],"q":"Agent Platform steps to deploy to edge?","a":"Convert models to LiteRT · package & deploy in containers · manage & monitor.","id":"c3-056","x":"2.1"},{"l":"3.10","t":"scenario","tags":["edge"],"q":"Medical device giving real-time feedback during surgery — edge or cloud?","a":"Edge (latency).","id":"c3-057","x":"2.1"},{"l":"3.10","t":"scenario","tags":["edge"],"q":"Chatbot handling millions of e-commerce queries daily — edge or cloud?","a":"Cloud (scale).","id":"c3-058","x":"2.1"},{"l":"3.10","t":"scenario","tags":["edge"],"q":"Smart-city traffic optimisation analysis — edge or cloud?","a":"Cloud (centralised capacity).","id":"c3-059","x":"2.1"},{"l":"3.11","t":"trap","tags":["roles"],"q":"Business leaders vs developers vs AI practitioners — typical tools?","a":"Leaders: pre-built solutions (Workspace with Gemini). Developers: AI Applications, pre-trained APIs, Agent Platform to build agents. AI practitioners: customise/deploy/optimise models on Agent Platform, BigQuery integration, bias detection, adversarial testing.","id":"c3-060","x":"4.1"},{"l":"3.11","t":"list","tags":["cost"],"q":"3 activities you pay for in gen AI?","a":"Training the model · deploying it to an endpoint · using it for predictions.","id":"c3-061","x":"4.1"},{"l":"3.11","t":"list","tags":["cost"],"q":"4 pricing models for using models?","a":"Usage-based · subscription · licensing fees · free tiers.","id":"c3-062","x":"4.1"},{"l":"3.11","t":"list","tags":["cost"],"q":"4 usage pricing metrics?","a":"Tokens · characters · requests · compute time.","id":"c3-063","x":"4.1"},{"l":"3.11","t":"fact","tags":["cost"],"q":"Which metric does the course say Google charges on for some services?","a":"Number of characters processed.","id":"c3-064","x":"4.1"},{"l":"3.11","t":"list","tags":["cost"],"q":"Factors affecting cost of using models?","a":"Model size/complexity · context window · features (fine-tuning, embeddings priced separately) · deployment location.","id":"c3-065","x":"4.1"},{"l":"3.11","t":"trap","tags":["cost"],"q":"Time to deliver: pre-built app vs custom agent with AI Applications vs fully custom model?","a":"Seconds · much less time · months.","id":"c3-066","x":"4.1"},{"l":"3.11","t":"def","tags":["cost"],"q":"What is a token?","a":"A piece of text — a word or part of a word.","id":"c3-067","x":"4.1"},{"l":"3.12","t":"list","tags":["needs"],"q":"4 main needs to assess before a gen AI project?","a":"Scale · customisation · user interaction · privacy.","id":"c3-068","x":"4.1"},{"l":"3.12","t":"list","tags":["needs"],"q":"4 'other considerations' in solution needs?","a":"Latency · connectivity · accuracy · explainability.","id":"c3-069","x":"4.1"},{"l":"3.12","t":"scenario","tags":["needs"],"q":"Individual or small team needs — which approach?","a":"Leverage pre-built tools / existing gen AI apps.","id":"c3-070","x":"4.1"},{"l":"3.12","t":"scenario","tags":["needs"],"q":"Specialised domain (law, medicine) — customisation advice?","a":"Course: fine-tune with domain-specific data or use domain-trained models. Exam rule of thumb: fresh or proprietary FACTS → RAG/grounding; domain STYLE, format or behaviour → fine-tuning.","id":"c3-071","x":"4.1"},{"l":"3.12","t":"scenario","tags":["needs"],"q":"Marketing images from text, some coding skills, short on time. Best path?","a":"Use a pre-trained API.","id":"c3-072","x":"4.1"},{"l":"3.12","t":"list","tags":["needs","responsible"],"q":"Regulations named for compliance?","a":"GDPR, HIPAA.","id":"c3-073","x":"4.3"},{"l":"3.12","t":"fact","tags":["needs"],"q":"Where is explainability especially crucial?","a":"Healthcare and finance.","id":"c3-074","x":"4.1"},{"l":"3.13","t":"list","tags":["selection"],"q":"4 steps to compare providers/models?","a":"Evaluate capabilities (benchmarks) · compare pricing vs expected usage · factor in extra costs (storage, API calls, fine-tuning) · read the fine print.","id":"c3-075","x":"4.1"},{"l":"3.13","t":"list","tags":["selection"],"q":"Resources for comparing models?","a":"Provider pricing pages · research papers & independent benchmarks · community forums.","id":"c3-076","x":"4.1"},{"l":"3.13","t":"list","tags":["maintenance"],"q":"5 maintenance areas to plan?","a":"Model monitoring & retraining · data updates · software updates & bug fixes · hardware & infrastructure · security & compliance.","id":"c3-077","x":"4.1"},{"l":"3.13","t":"fact","tags":["maintenance"],"q":"Why use Google Cloud's fully managed environment for maintenance?","a":"Developers focus on agent development, not infrastructure; the platform handles deployment and model improvement, maximising ROI.","id":"c3-078","x":"4.1"},{"l":"4.1","t":"list","tags":["strategy"],"q":"2 questions to ask while experimenting with gen AI apps?","a":"Is this use case repeatable (for me/my team)? Is gen AI falling short because it lacks customisation?","id":"c4-001","x":"4.1"},{"l":"4.2","t":"fact","tags":["workspace"],"q":"What is the current name for Gemini built into Gmail, Docs, Sheets, Meet and Slides?","a":"Google Workspace with Gemini.","id":"c4-002","x":"2.2"},{"l":"4.2","t":"def","tags":["workspace"],"q":"What is Google Workspace?","a":"Cloud-based productivity and collaboration tools — Gmail, Docs, Sheets, Meet, Slides…","id":"c4-003","x":"2.2"},{"l":"4.2","t":"fact","tags":["workspace","security"],"q":"What do Workspace business/enterprise licences add for Gemini features?","a":"Enterprise-grade data protection (also for the Gemini app with Gemini Advanced) plus admin features to manage usage/access.","id":"c4-004","x":"2.2"},{"l":"4.2","t":"def","tags":["workspace"],"q":"What is the Gemini side panel?","a":"Gemini in the side of Workspace apps: summarise, analyse, generate using your emails/docs without switching apps.","id":"c4-005","x":"2.2"},{"l":"4.2","t":"scenario","tags":["workspace"],"q":"Generate a complex formula from plain language. Which Workspace app's Gemini?","a":"Gemini in Google Sheets.","id":"c4-006","x":"2.2"},{"l":"4.2","t":"scenario","tags":["workspace"],"q":"Real-time transcription/translation in multilingual meetings plus action items. Which app?","a":"Gemini in Google Meet.","id":"c4-007","x":"2.2"},{"l":"4.2","t":"scenario","tags":["workspace"],"q":"Generate photorealistic images for a presentation. Which app?","a":"Gemini in Google Slides.","id":"c4-008","x":"2.2"},{"l":"4.2","t":"product","tags":["workspace"],"q":"What is AppSheet and what does Gemini add?","a":"No-code app builder in Workspace enterprise editions; Gemini creates the app structure (tables, columns, links) from a natural-language description.","id":"c4-009","x":"2.2"},{"l":"4.2","t":"product","tags":["workspace"],"q":"What does 'Help me Create' in Google Vids do?","a":"Uses Gemini to generate a first draft of a video.","id":"c4-010","x":"2.2"},{"l":"4.2","t":"scenario","tags":["workspace"],"q":"Find the definition of a project buried in an unknown Drive doc. Which feature?","a":"Gemini in Google Drive side panel — returns the answer and the source document.","id":"c4-011","x":"2.2"},{"l":"4.3","t":"number","tags":["usecase"],"q":"Understood.org time savings with Gemini?","a":"~10 hours per research project; partnerships team ~2 hours per day.","id":"c4-012","x":"2.2"},{"l":"4.3","t":"fact","tags":["usecase"],"q":"Key benefit in the Understood.org case?","a":"Saving time on repetitive tasks and personalising communications (not replacing people).","id":"c4-013","x":"2.2"},{"l":"4.3","t":"fact","tags":["usecase","responsible"],"q":"What did Understood.org researchers do before handing Gemini outputs on?","a":"Asked Gemini to cite sources, verified outputs, exported to Google Docs.","id":"c4-014","x":"4.3"},{"l":"4.4","t":"trap","tags":["prompting"],"q":"Zero-shot vs one-shot vs few-shot prompting?","a":"Zero: no examples. One: one example. Few: multiple examples.","id":"c4-015","x":"3.2"},{"l":"4.4","t":"fact","tags":["prompting"],"q":"Mnemonics for zero/one/few-shot?","a":"Just tell it · guide it with a single example · show, don't tell.","id":"c4-016","x":"3.2"},{"l":"4.4","t":"scenario","tags":["prompting"],"q":"You give the model 3 labelled support tickets then ask it to classify a 4th. Which technique?","a":"Few-shot prompting.","id":"c4-017","x":"3.2"},{"l":"4.5","t":"def","tags":["prompting"],"q":"What is role prompting?","a":"Assigning the model a role/persona to influence the style, tone and focus of responses.","id":"c4-018","x":"3.2"},{"l":"4.5","t":"scenario","tags":["prompting"],"q":"'You are a telecom customer service agent with ten years of experience…' — which technique?","a":"Role prompting.","id":"c4-019","x":"3.2"},{"l":"4.6","t":"def","tags":["prompting"],"q":"What is prompt chaining?","a":"Breaking a task into a sequence of prompts where each output feeds the next step. The course demonstrates it as a back-and-forth conversation that refines output incrementally.","id":"c4-020","x":"3.2"},{"l":"4.7","t":"list","tags":["prompting","gems"],"q":"Ways to reuse prompts in Gemini (simple → tailored)?","a":"Prompt templates (Docs/Sheets) · prompt chaining in one thread (name/pin chats) · Saved info · Gems.","id":"c4-021","x":"3.2"},{"l":"4.7","t":"def","tags":["gems"],"q":"What is Saved info in Gemini?","a":"Persistent information Gemini always uses across ALL chats (set in Settings).","id":"c4-022","x":"2.2"},{"l":"4.7","t":"trap","tags":["gems"],"q":"Saved info vs Gems?","a":"Saved info applies to all chats. Gems give task-specific context/instructions for particular tasks.","id":"c4-023","x":"2.2"},{"l":"4.7","t":"def","tags":["gems"],"q":"What is Gemini Advanced?","a":"Upgraded Gemini, more capable at complex tasks: coding, logical reasoning, nuanced instructions, creative collaboration.","id":"c4-024","x":"2.2"},{"l":"4.7","t":"scenario","tags":["gems"],"q":"Social media manager needing a consistent brand voice across platforms. Best strategy?","a":"A Gem.","id":"c4-025","x":"2.2"},{"l":"4.7","t":"scenario","tags":["gems"],"q":"Sales rep wants pitch feedback without influence from previous practice sessions, but Gemini should know they're a sales rep. Strategy?","a":"Saved info.","id":"c4-026","x":"2.2"},{"l":"4.7","t":"scenario","tags":["gems"],"q":"Writer brainstorming a story and iterating on feedback in one conversation. Strategy?","a":"Prompt chaining.","id":"c4-027","x":"2.2"},{"l":"4.8","t":"list","tags":["gems"],"q":"3 benefits of Gems?","a":"Personalised responses · streamlined workflows · reset context (separate chats with the same Gem don't spill over).","id":"c4-028","x":"2.2"},{"l":"4.8","t":"list","tags":["gems"],"q":"What can you give a custom Gem?","a":"Instructions (ideally role prompting) and documents/resources as a focused knowledge base.","id":"c4-029","x":"2.2"},{"l":"4.8","t":"list","tags":["gems"],"q":"Best practices for Gem instructions?","a":"Clear and specific · give examples · refine over time · think about how users will interact.","id":"c4-030","x":"2.2"},{"l":"4.9","t":"def","tags":["grounding"],"q":"Grounding (Course 4 definition)?","a":"The model's ability to connect its output to verifiable, specific sources of information.","id":"c4-031","x":"3.3"},{"l":"4.9","t":"fact","tags":["grounding"],"q":"No-code ways to ground Gemini?","a":"Attach resources to a Gem, or attach documents to Gemini app prompts (Gemini Advanced).","id":"c4-032","x":"3.3"},{"l":"4.9","t":"list","tags":["rag"],"q":"Retrieval in RAG is often powered by…?","a":"Semantic search or vector databases.","id":"c4-033","x":"3.3"},{"l":"4.9","t":"list","tags":["rag"],"q":"3 benefits of RAG?","a":"Improved accuracy & relevance · improved explainability & transparency (shows sources) · extending LLM capabilities (constrain to given context).","id":"c4-034","x":"3.3"},{"l":"4.9","t":"trap","tags":["rag"],"q":"Model-only vs model-with-RAG output?","a":"Model-only: no external knowledge, may be outdated, more hallucinations. With RAG: latest external knowledge, far fewer hallucinations.","id":"c4-035","x":"3.3"},{"l":"4.10","t":"def","tags":["notebook"],"q":"What is Gemini Notebook?","a":"An AI-first notebook grounded in your own documents (docs, slides, audio, video) acting as a virtual research assistant; answers only from your sources.","id":"c4-036","x":"2.2"},{"l":"4.10","t":"list","tags":["notebook"],"q":"What does Gemini Notebook Plus add?","a":"More capacity · customisable response length & style · usage analytics.","id":"c4-037","x":"2.2"},{"l":"4.10","t":"list","tags":["notebook","security"],"q":"What does Gemini Notebook Enterprise add?","a":"Compliance and admin features: extra privacy/security, sharing only with chosen collaborators, access via IAM roles.","id":"c4-038","x":"2.2"},{"l":"4.10","t":"fact","tags":["notebook"],"q":"What does Gemini Notebook do if your sources don't cover a question?","a":"Says it can't answer — it doesn't invent or speculate.","id":"c4-039","x":"2.2"},{"l":"4.10","t":"def","tags":["notebook"],"q":"What is an Audio Overview?","a":"A podcast-like, downloadable discussion between two AI hosts summarising your sources.","id":"c4-040","x":"2.2"},{"l":"4.10","t":"list","tags":["notebook"],"q":"Source types Gemini Notebook supports (demo)?","a":"PDFs, text, Markdown, audio (MP3), Google Drive docs, website & YouTube links, pasted text.","id":"c4-041","x":"2.2"},{"l":"4.10","t":"trap","tags":["notebook","gems"],"q":"Gemini Notebook vs Gems?","a":"Gems: general tasks and workflows. Notebook: deep understanding of a specific set of sources — hyper-focused, interactive learning, source-based answers with citations.","id":"c4-042","x":"2.2"},{"l":"4.10","t":"list","tags":["notebook"],"q":"Studio panel outputs in Gemini Notebook?","a":"Audio Overviews, flashcards, quizzes, and more.","id":"c4-043","x":"2.2"},{"l":"4.11","t":"fact","tags":["notebook"],"q":"True/false: Gemini Notebook can use information from the entire internet.","a":"False — only the sources you provide.","id":"c4-044","x":"2.2"},{"l":"4.11","t":"fact","tags":["notebook","grounding"],"q":"True/false: grounding is exclusive to Gemini Notebook.","a":"False.","id":"c4-045","x":"2.2"},{"l":"4.11","t":"fact","tags":["notebook"],"q":"Key benefit of a shared notebook for the VC firm?","a":"A single source of truth breaking down information silos; collaborative analysis and faster decisions.","id":"c4-046","x":"2.2"},{"l":"4.12","t":"fact","tags":["gcloud","security"],"q":"Does Gemini for Google Cloud use your prompts/responses to train models?","a":"No. Standard Google Cloud enterprise protections apply.","id":"c4-047","x":"4.2"},{"l":"4.12","t":"product","tags":["gcloud"],"q":"Which Gemini helps design, manage and optimise apps on Google Cloud using your resources, metrics and logs?","a":"Gemini Cloud Assist.","id":"c4-048","x":"2.1"},{"l":"4.12","t":"product","tags":["gcloud"],"q":"Which Gemini acts as an AI pair programmer across 20+ languages?","a":"Gemini Code Assist.","id":"c4-049","x":"2.1"},{"l":"4.12","t":"product","tags":["gcloud"],"q":"Which Gemini helps write Python in notebooks?","a":"Gemini in Colab Enterprise.","id":"c4-050","x":"2.1"},{"l":"4.12","t":"product","tags":["gcloud"],"q":"Which Gemini manages a fleet of databases from one interface?","a":"Gemini in Databases.","id":"c4-051","x":"2.1"},{"l":"4.12","t":"product","tags":["gcloud"],"q":"Which Gemini summarises threat actors' tactics, techniques and procedures?","a":"Gemini in Security.","id":"c4-052","x":"2.1"},{"l":"4.12","t":"product","tags":["gcloud"],"q":"Which Gemini makes data analysis accessible regardless of SQL experience?","a":"Gemini in BigQuery.","id":"c4-053","x":"2.1"},{"l":"4.12","t":"product","tags":["gcloud"],"q":"Which Gemini helps create visualisations and reports from data (BI)?","a":"Gemini in Looker.","id":"c4-054","x":"2.1"},{"l":"4.13","t":"scenario","tags":["usecase","gcloud"],"q":"Cymbal Retail: how did marketers query BigQuery without SQL?","a":"Gemini in BigQuery with function calling in a user-friendly app translated natural language into SQL.","id":"c4-055","x":"2.1"},{"l":"4.13","t":"list","tags":["usecase"],"q":"3 results for Cymbal Retail?","a":"Increased agility · improved collaboration (analysts freed) · enhanced data literacy.","id":"c4-056","x":"2.1"},{"l":"5.1","t":"fact","tags":["agents"],"q":"Does needing a custom gen AI solution mean building from the ground up?","a":"No — build custom agents on existing layers (models, platform, tools).","id":"c5-001","x":"1.3"},{"l":"5.2","t":"trap","tags":["agents"],"q":"Deterministic vs generative agents?","a":"Deterministic: predefined paths, workflow/event-driven, same input → same output, high control. Generative: LLM-based intent understanding, more flexible, some randomness.","id":"c5-002","x":"2.5"},{"l":"5.2","t":"list","tags":["agents"],"q":"Order of agent evolution (oldest → newest)?","a":"Deterministic → generative without RAG → generative with RAG → today: hybrid.","id":"c5-003","x":"2.5"},{"l":"5.2","t":"fact","tags":["agents"],"q":"Which components did deterministic agents have?","a":"Only reasoning loop and tools — no foundational gen AI model.","id":"c5-004","x":"2.5"},{"l":"5.2","t":"fact","tags":["agents","rag"],"q":"What problem did RAG solve for generative agents?","a":"Models couldn't integrate tool data into their knowledge; RAG lets them access external data, giving up-to-date, grounded answers.","id":"c5-005","x":"3.3"},{"l":"5.2","t":"def","tags":["agents"],"q":"What is a hybrid agent?","a":"An agent combining deterministic and generative capabilities.","id":"c5-006","x":"2.5"},{"l":"5.2","t":"list","tags":["agents"],"q":"3 components of an agent?","a":"Foundational model · tools · reasoning loop.","id":"c5-007","x":"2.5"},{"l":"5.2","t":"list","tags":["agents","tools"],"q":"Tool types named in the agent components card?","a":"Extensions (APIs), functions (mock API calls), data stores (e.g. vector databases).","id":"c5-008","x":"2.5"},{"l":"5.3","t":"def","tags":["parameters"],"q":"What are sampling parameters?","a":"Settings ('knobs') sent with a prompt that influence model behaviour/output.","id":"c5-009","x":"3.3"},{"l":"5.3","t":"number","tags":["parameters"],"q":"Token rule of thumb in English?","a":"1 token ≈ 4 characters; 100 tokens ≈ 60–80 words.","id":"c5-010","x":"3.3"},{"l":"5.3","t":"def","tags":["parameters"],"q":"What does temperature control?","a":"Randomness/creativity. Low = focused, deterministic, repeatable. High = diverse, unpredictable.","id":"c5-011","x":"3.3"},{"l":"5.3","t":"def","tags":["parameters"],"q":"What is top-p (nucleus sampling)?","a":"Sample from the smallest set of most-likely tokens whose cumulative probability reaches p. Lower = focused; higher = diverse.","id":"c5-012","x":"3.3"},{"l":"5.3","t":"def","tags":["parameters"],"q":"What is top-k?","a":"Sample randomly from the k most likely tokens.","id":"c5-013","x":"3.3"},{"l":"5.3","t":"trap","tags":["parameters"],"q":"Why prefer top-p over top-k?","a":"Top-p's candidate set size adapts dynamically to the probability distribution; a fixed k can give strange results when the distribution is skewed.","id":"c5-014","x":"3.3"},{"l":"5.3","t":"scenario","tags":["parameters"],"q":"You need concise, factual answers (Q&A/summaries). How to set parameters?","a":"Low temperature and shorter output length (lower top-p).","id":"c5-015","x":"3.3"},{"l":"5.3","t":"scenario","tags":["parameters"],"q":"You need creative, open-ended text. How to set parameters?","a":"Raise temperature and top-p.","id":"c5-016","x":"3.3"},{"l":"5.3","t":"list","tags":["parameters"],"q":"5 common parameters listed?","a":"Token count · temperature · top-p · safety settings · output length.","id":"c5-017","x":"3.3"},{"l":"5.3","t":"def","tags":["apis"],"q":"What is an API?","a":"Application programming interface — a way for software systems to communicate and exchange information (like a messenger).","id":"c5-018","x":"3.3"},{"l":"5.4","t":"list","tags":["apis"],"q":"What do Google's gen AI APIs give access to?","a":"Pre-trained models (which can be tuned) for text completion, multi-turn chat, code generation and image generation. The API is the interface; the model behind it is pre-trained.","id":"c5-019","x":"2.5"},{"l":"5.4","t":"trap","tags":["apis","products"],"q":"Google AI Studio vs Agent Studio — users and access?","a":"AI Studio: beginners/hobbyists/early prototyping, standard Google account. Agent Studio: professionals/developers, via Google Cloud.","id":"c5-020","x":"2.5"},{"l":"5.4","t":"trap","tags":["apis","products"],"q":"Google AI Studio vs Agent Studio — limits and advantages?","a":"AI Studio: usage limits (QPM/RPM/TPM), not for production; simple. Agent Studio: usage-based charges; flexible quotas, enterprise-grade security & compliance.","id":"c5-021","x":"2.5"},{"l":"5.4","t":"scenario","tags":["apis"],"q":"Large-scale, production gen AI app with compliance needs — AI Studio or Agent Studio?","a":"Agent Studio.","id":"c5-022","x":"2.5"},{"l":"5.4","t":"list","tags":["apis"],"q":"What can you configure in Google AI Studio (demo)?","a":"System instructions · model choice · temperature, thinking level, top-P · safety settings · tools: function calling, structured output, grounding with Google Search.","id":"c5-023","x":"2.5"},{"l":"5.4","t":"fact","tags":["apis"],"q":"What do you need before using code exported from Google AI Studio?","a":"An API key.","id":"c5-024","x":"2.5"},{"l":"5.5","t":"scenario","tags":["parameters"],"q":"Your pitch sounds too formal/flat. Which parameter to raise for more enthusiasm?","a":"Temperature.","id":"c5-025","x":"3.3"},{"l":"5.6","t":"def","tags":["prompting","agents"],"q":"What is prompt engineering in the agent context?","a":"Building prompting logic (roles, directions, examples) into the agent layer before the end-user app — logical, not software engineering.","id":"c5-026","x":"3.2"},{"l":"5.6","t":"def","tags":["prompting"],"q":"What is metaprompting?","a":"Using AI to generate, modify or interpret prompts (prompting to get a prompt).","id":"c5-027","x":"3.2"},{"l":"5.6","t":"list","tags":["agents"],"q":"4 aspects of the reasoning loop?","a":"Iterative process · internal reasoning (via the LLM) · decision making (tools, inputs) · reasoning frameworks.","id":"c5-028","x":"3.2"},{"l":"5.7","t":"def","tags":["prompting"],"q":"What is ReAct?","a":"Reasoning and acting: a framework letting the LLM reason and take actions (tools) on a query, with or without in-context examples.","id":"c5-029","x":"3.2"},{"l":"5.7","t":"list","tags":["prompting"],"q":"ReAct loop steps?","a":"Think → Act → Observe → Respond.","id":"c5-030","x":"3.2"},{"l":"5.7","t":"list","tags":["prompting"],"q":"Why
