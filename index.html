g data and generates <strong>new, similar content<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Painting analogy<\/div><div class=\"kv\"><ul>\n<li>Traditional AI: the child is shown what a good painting looks like and learns to <strong>judge<\/strong> paintings.<\/li>\n<li>Gen AI: the child sees many paintings, gets brushes, and <strong>creates<\/strong> a new one.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kv\">Gen AI needs <strong>very large amounts of data<\/strong> to learn those patterns well.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap hierarchy","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Recap hierarchy<\/h2><div class=\"bi\"><p><strong>AI<\/strong> (broad field) → <strong>ML<\/strong> (a method within AI) → <strong>gen AI<\/strong> (an application or subset that creates new content).\nNon-technical leaders don't need the maths, but they do need these concepts.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"2.3","title":"What is data","kind":"concept","html":"","videos":["qXyD4l0z2BY"],"steps":[{"title":"Why data matters","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Why data matters<\/h2><div class=\"bi\"><ul>\n<li>ML models <strong>predict the future from existing data<\/strong>, much as people make educated guesses from experience. Humans use intuition. Models use <strong>probability<\/strong>.<\/li>\n<li>ML models <strong>analyse their data, identify patterns, then calculate the likelihood of outcomes<\/strong> for new inputs.<\/li>\n<li><strong>Milk analogy (video):<\/strong><ul>\n<li>You judge spoilage from the expiry date and a smell test. You're never 100% sure, but past experience makes the prediction fairly accurate.<\/li>\n<li>That pattern recognition is what ML does.<\/li>\n<li><strong>Relevant inputs<\/strong> (date, temperature) matter. <strong>Irrelevant ones<\/strong> (the song on the radio) don't.<\/li>\n<\/ul>\n<\/li>\n<li><strong>Data = information<\/strong> in many forms: numbers, dates, text descriptions, images, sounds. Which data is relevant depends on the task.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Data quality: 5 factors (exam favourite)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Data quality: 5 factors (exam favourite)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Accuracy<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Wrong data → wrong patterns → faulty predictions<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">A child learning animals from a book with mislabelled pictures<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Completeness<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Enough <strong>size<\/strong>, and representation within the dataset<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">Forecasting weather from one day of data vs a large sample<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Representative<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Inclusive data; otherwise skewed samples and <strong>biased<\/strong> outcomes<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">Customer-preference data missing a demographic<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Consistency<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Consistent formats and labels; otherwise the model is confused<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">A puzzle with some pieces numbered and others lettered<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Factor<\/div><div class=\"kt\"><strong>Relevance<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Data must fit the task<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">London traffic data for Kansas crop yields<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Data accessibility: 3 factors","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Data accessibility: 3 factors<\/h2><div class=\"bi\"><div class=\"defs\"><div class=\"def\"><div class=\"term\">Data accessibility<\/div><div class=\"meaning\">= needed data is <strong>readily available, usable and high quality<\/strong>. It enables thorough training and reduces bias. Without it, even sophisticated algorithms are limited.<ol>\n<li><strong>Availability:<\/strong> data may not exist, or may be behind <strong>paywalls<\/strong> or restricted for <strong>privacy<\/strong>.<\/li>\n<li><strong>Cost:<\/strong> gathering and cleaning high-quality data is expensive, a barrier especially for <strong>smaller organisations<\/strong>.<\/li>\n<li><strong>Format:<\/strong> data must be in a processable format. Conversion can be slow and technically hard.<\/li>\n<\/ol><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Data is the foundation of AI. Remember the <strong>8 factors<\/strong>: accuracy, completeness, representativeness, consistency, relevance (quality) plus availability, cost, format (accessibility).<\/p><\/div><\/section><\/div>"}]},{"id":"2.4","title":"Data types","kind":"concept","html":"","videos":[],"steps":[{"title":"Overview · Key points","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><blockquote class=\"note\">\n<p><strong>Partial gap:<\/strong> the page uses a click-through carousel and images. Its exact split of Cymbal Cleaning fields into structured vs unstructured is shown in a graphic. The mapping below is based on the definitions given. The page text explicitly lists free-form feedback and email content as unstructured.<\/p>\n<\/blockquote><\/div><\/section><section class=\"blk sec\"><h2>Key points<\/h2><div class=\"bi\"><ul>\n<li>Business data helps organisations <strong>understand customers, optimise operations, drive strategy<\/strong>.<\/li>\n<li><strong>Larger datasets often improve performance<\/strong>, especially for complex gen AI. But performance also depends on the data's <strong>type, volume, organisation and structure<\/strong>.<\/li>\n<li>Knowing your company's data (<strong>quality, availability, form<\/strong>) sets the boundary of what's possible with AI.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Structured vs unstructured data","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Structured vs unstructured data<\/h2><div class=\"bi\"><div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Structured<\/th>\n<th>Unstructured<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Definition<\/td>\n<td>Organised into a predefined format (rows and columns); easy to search<\/td>\n<td>No predefined structure; messy and complex; needs more sophisticated analysis<\/td>\n<\/tr>\n<tr>\n<td>Storage<\/td>\n<td>Often a <strong>relational database<\/strong> (tables, a \"digital filing cabinet\")<\/td>\n<td>Files, object storage<\/td>\n<\/tr>\n<tr>\n<td>Examples<\/td>\n<td>Phone contact list, online shopping orders, bank statements, CSV sales tables<\/td>\n<td><strong>Text<\/strong> (PDFs, emails, social posts), <strong>images<\/strong> (photos, digital art, medical scans), <strong>audio<\/strong> (speech, music), <strong>video<\/strong> (movies, YouTube, phone videos)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><p><strong>Example company: Cymbal Cleaning<\/strong> (fictitious eco-friendly cleaning supplies). Order data includes customer ID, name, purchase date, order cost, delivery address, product image, and feedback on a 1–5 star scale.\n- Structured: IDs, name, dates, cost, address, star rating.\n- Unstructured: product image, <strong>free-form feedback text<\/strong>, <strong>email content<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check answers<\/h2><div class=\"bi\"><div class=\"tw rtable\"><table>\n<thead>\n<tr>\n<th>Item<\/th>\n<th>Type<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A product review sentence on an e-commerce site<\/td>\n<td>Unstructured<\/td>\n<\/tr>\n<tr>\n<td>CSV of Date / Product ID / Quantity / Price<\/td>\n<td>Structured<\/td>\n<\/tr>\n<tr>\n<td>Audio recording of a support call<\/td>\n<td>Unstructured<\/td>\n<\/tr>\n<tr>\n<td>Digital image of a cat<\/td>\n<td>Unstructured<\/td>\n<\/tr>\n<tr>\n<td>Medical record fields: date of birth, address, vaccination history<\/td>\n<td>Structured<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Understanding your data is the <strong>first step<\/strong> of any AI implementation. The <strong>type, quality and structure<\/strong> of data determine what's possible.<\/p><\/div><\/section><\/div>"}]},{"id":"2.5","title":"Types of learning","kind":"concept","html":"","videos":[],"steps":[{"title":"Three primary ML approaches","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Three primary ML approaches<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Approach<\/div><div class=\"kt\"><strong>Supervised<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Data<\/div><div class=\"kv\"><strong>Labeled<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">How it learns<\/div><div class=\"kv\">Each input is paired with its correct output. The model learns the mapping and predicts outputs for new inputs.<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\"><strong>House price prediction<\/strong> from size, bedrooms and location, labelled with sale price<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Approach<\/div><div class=\"kt\"><strong>Unsupervised<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Data<\/div><div class=\"kv\"><strong>Unlabeled<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">How it learns<\/div><div class=\"kv\">Finds natural groupings or structure on its own: <strong>exploratory analysis<\/strong>, insights you didn't know to look for<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\"><strong>Customer segmentation<\/strong> from purchase history<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Approach<\/div><div class=\"kt\"><strong>Reinforcement<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Data<\/div><div class=\"kv\">Interaction + feedback<\/div><\/div><div class=\"kf\"><div class=\"kl\">How it learns<\/div><div class=\"kv\"><strong>Trial and error<\/strong>: maximise rewards, minimise penalties in an environment<\/div><\/div><div class=\"kf\"><div class=\"kl\">Course example<\/div><div class=\"kv\">A robot learning a maze (walls = negative, shortcuts = positive); training a pet; self-driving cars; robot optimisation in manufacturing<\/div><\/div><\/div><\/div><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Labeled data<\/div><div class=\"kv\">has tags (name, type, number), applied manually or automatically, that give the data meaning. Examples: cat/dog image labels; reviews labelled positive, negative or neutral.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Unlabeled data<\/div><div class=\"kv\">is raw and untagged. Examples: unorganised photos, audio streams, uncategorised web traffic logs.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Reinforcement learning suits cases where <strong>explicit instructions or labeled data can't be provided<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Google Cloud examples (know the mapping)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Google Cloud examples (know the mapping)<\/h2><div class=\"bi\"><div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Use case<\/th>\n<th>Product<\/th>\n<th>Approach<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Predictive maintenance<\/strong> from machine sensor data (temperature, pressure, vibration) to predict failure and reduce downtime<\/td>\n<td><strong>Agent Platform<\/strong><\/td>\n<td>Supervised<\/td>\n<\/tr>\n<tr>\n<td><strong>Anomaly detection<\/strong>: flag unusual transactions (amount, location, time) to prevent fraud<\/td>\n<td><strong>BigQuery ML<\/strong><\/td>\n<td>Unsupervised<\/td>\n<\/tr>\n<tr>\n<td><strong>Product recommendations<\/strong> from browsing and purchase behaviour, continuously refined to maximise engagement and sales<\/td>\n<td><strong>Agent Platform<\/strong><\/td>\n<td>Reinforcement<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check answers<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Game AI learning through rewards and penalties to maximise cumulative reward<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Reinforcement<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Spam filter trained on emails labelled spam / not spam<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Supervised<\/strong>. Labeled data is the defining feature.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Discovering topics in news articles (<strong>topic modelling<\/strong>)<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Unsupervised<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>The choice of approach depends on the <strong>task and the nature of the available data<\/strong>.<\/p><\/div><\/section><\/div>"}]},{"id":"2.6","title":"Turning data into learning using Google Cloud","kind":"concept","html":"","videos":[],"steps":[{"title":"Context · The ML lifecycle: 5 stages and their Google Cloud tools (exam favourite)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Context<\/h2><div class=\"bi\"><ul>\n<li>Going from scattered data to insight takes several steps. For enterprises, also consider <strong>security, robustness and scalability<\/strong>.<\/li>\n<li>Google Cloud provides data and ML tools across the <strong>entire ML lifecycle<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>The ML lifecycle: 5 stages and their Google Cloud tools (exam favourite)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Stage<\/div><div class=\"kt\"><strong>1. Gather your data<\/strong> (data ingestion)<\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\">Collect raw data from sources; decide what's needed from the desired outcome<\/div><\/div><div class=\"kf\"><div class=\"kl\">Google Cloud tools<\/div><div class=\"kv\"><strong>Pub/Sub<\/strong>: real-time <strong>streaming<\/strong>, any structure. <strong>Cloud Storage<\/strong>: <strong>unstructured<\/strong> data. <strong>Cloud SQL<\/strong> and <strong>Spanner<\/strong>: <strong>structured<\/strong> data.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Stage<\/div><div class=\"kt\"><strong>2. Prepare your data<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\">Clean and transform into a usable format; formatting and <strong>labeling<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Google Cloud tools<\/div><div class=\"kv\"><strong>BigQuery<\/strong>: analysis; filter, fix inconsistencies, handle missing values. <strong>Data Catalog<\/strong>: <strong>governance<\/strong>; a central repository to <strong>discover datasets<\/strong> across the org.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Stage<\/div><div class=\"kt\"><strong>3. Train your model<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\">Create the ML model from data<\/div><\/div><div class=\"kf\"><div class=\"kl\">Google Cloud tools<\/div><div class=\"kv\"><strong>Gemini Enterprise Agent Platform<\/strong>: managed training environment, set parameters, <strong>prebuilt containers<\/strong> for popular frameworks, <strong>custom training jobs<\/strong>, <strong>model evaluation<\/strong> tools, powerful compute for faster training<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Stage<\/div><div class=\"kt\"><strong>4. Deploy and predict<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\">Make the trained model available for use<\/div><\/div><div class=\"kf\"><div class=\"kl\">Google Cloud tools<\/div><div class=\"kv\"><strong>Agent Platform<\/strong>: serve predictions and <strong>scale<\/strong> resources to demand<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Stage<\/div><div class=\"kt\"><strong>5. Manage your model<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\">Maintain models over time<\/div><\/div><div class=\"kf\"><div class=\"kl\">Google Cloud tools<\/div><div class=\"kv\"><strong>Versioning<\/strong>. <strong>Performance tracking<\/strong> (metrics). <strong>Drift monitoring<\/strong> (accuracy changes over time). <strong>Data management<\/strong> with <strong>Agent Platform Feature Store<\/strong> (manages model features). <strong>Storage<\/strong> with <strong>Model Garden<\/strong> (store and organise models). <strong>Automation<\/strong> with <strong>Agent Platform Pipelines<\/strong> (automate ML tasks).<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Cross-cutting","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Cross-cutting<\/h2><div class=\"bi\"><ul>\n<li>The tools <strong>work together<\/strong> and connect to existing or custom tools.<\/li>\n<li>Google Cloud infrastructure provides <strong>availability and reliability<\/strong>.<\/li>\n<li><strong>Identity and Access Management (IAM)<\/strong> keeps data safe: only the right people get access.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Lifecycle = <strong>ingestion &amp; preparation → training → deployment → management<\/strong>. Agent Platform handles training and deployment; the data tools handle ingestion, preparation and management.<\/p><\/div><\/section><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Matching questions: streaming → Pub/Sub; unstructured storage → Cloud Storage; structured → Cloud SQL / Spanner; dataset discovery and governance → Data Catalog; features → Feature Store; automate ML workflow → Pipelines; drift → model management.<\/li>\n<\/ul><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>Course says 'store models in Model Garden'. Precise: <strong>Model Registry<\/strong> manages your own model versions; <strong>Model Garden<\/strong> is where you discover, customise and deploy available models.<\/li>\n<li><strong>Data Catalog<\/strong> was discontinued on 1 June 2026 and replaced by <strong>Knowledge Catalog<\/strong> (formerly Dataplex Universal Catalog). The exam guide doesn't name either.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"2.7","title":"Deep learning, generative AI, and foundation models","kind":"concept","html":"","videos":[],"steps":[{"title":"The nesting","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The nesting<\/h2><div class=\"bi\"><p><strong>AI ⊃ ML ⊃ Deep learning ⊃ (gen AI built on deep learning; foundation models → LLMs, diffusion models)<\/strong><\/p><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Machine learning<\/div><div class=\"kv\">a broad field with many techniques, one of which is deep learning.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Deep learning (DL)<\/div><div class=\"kv\">a powerful subset of ML that uses <strong>artificial neural networks<\/strong> (with multiple layers) to handle highly complex patterns and make sophisticated predictions.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Semi-supervised learning<\/div><div class=\"kv\">neural networks can train on a <strong>small amount of labeled data plus a large amount of unlabeled data<\/strong>. They learn foundational concepts and <strong>generalise<\/strong> to new examples.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Generative AI<\/div><div class=\"kv\">uses deep learning to create new content: text, images, audio and more. Neural-network deep-learning techniques are <strong>the engine<\/strong> behind generative models.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Foundation models · Types of foundation model","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Foundation models<\/h2><div class=\"bi\"><ul>\n<li>Use <strong>deep learning<\/strong>. Trained at <strong>massive scale<\/strong>, often on vast <strong>unlabeled<\/strong> data.<\/li>\n<li>They develop a broad understanding of the world and capture intricate patterns, so they handle varied tasks across domains.<\/li>\n<li><strong>Analogy:<\/strong> a student who has read an entire library and can adapt to many tasks.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Types of foundation model<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Large language models (LLMs)<\/div><div class=\"kv\">designed to <strong>understand and generate human language<\/strong>. They translate, write creative content, and answer even open-ended or strange questions. The most common type users meet (e.g. chatbots like <strong>Gemini<\/strong>). They also power many <strong>search engines<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Diffusion models<\/div><div class=\"kv\">generate high-quality <strong>images, audio, even video<\/strong> by <strong>iteratively refining noise<\/strong> (random, unstructured data) into structured data.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: definitions<\/h2><div class=\"bi\"><ul>\n<li><strong>AI:<\/strong> broad field of computer science building machines that perform tasks needing human intelligence.<\/li>\n<li><strong>ML:<\/strong> subset of AI; machines learn from data <strong>without explicit programming<\/strong> and improve over time.<\/li>\n<li><strong>DL:<\/strong> specialised subset of ML using <strong>multi-layer artificial neural networks<\/strong> for complex patterns.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p><strong>Deep learning<\/strong> = the core technology. <strong>Foundation models<\/strong> = powerful architectures built on deep learning. <strong>Generative AI<\/strong> = applying those models to create new, original content.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The exam guide also asks you to define <strong>multimodal foundation models<\/strong> (models that take in or produce several data types and combine them) and <strong>natural language processing<\/strong> (AI that understands and generates human language).<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"2.8","title":"Choosing a model","kind":"concept","html":"","videos":[],"steps":[{"title":"8 factors when choosing a gen AI model (exam favourite)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>8 factors when choosing a gen AI model (exam favourite)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Modality<\/div><div class=\"kv\">the input and output data types (text, image, video, audio).<ul>\n<li>Single-type apps need a model optimised for that modality.<\/li>\n<li>Mixed apps (image → caption, video with audio) need a <strong>multimodal<\/strong> model.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Context window<\/div><div class=\"kv\">how much information the model considers at once.<ul>\n<li>Larger = remembers more of the conversation or document, so outputs are more coherent for long or complex tasks.<\/li>\n<li>But larger usually means <strong>higher compute cost<\/strong>. Balance need against resources.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Security<\/div><div class=\"kv\">encryption, access controls, vulnerability management, compliance with industry standards and regulations. Paramount for sensitive data.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Availability and reliability<\/div><div class=\"kv\">consistent availability under load: <strong>uptime guarantees, redundancy, disaster recovery<\/strong>. Crucial in production.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Cost<\/div><div class=\"kv\">pricing by usage, compute time, etc. Weigh against budget and expected value.<ul>\n<li><strong>Match the model to the task. Bigger isn't always better, and multimodal isn't always needed.<\/strong><\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">6<\/span><div class=\"sb\"><div class=\"kt\">Performance<\/div><div class=\"kv\">accuracy, speed, efficiency. Check benchmarks and relevant datasets. There is a trade-off with cost.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">7<\/span><div class=\"sb\"><div class=\"kt\">Fine-tuning and customisation<\/div><div class=\"kv\">for specialised use cases, prefer models that can be further trained on your domain dataset.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">8<\/span><div class=\"sb\"><div class=\"kt\">Ease of integration<\/div><div class=\"kv\">well-documented <strong>APIs and SDKs<\/strong> to fit existing systems and workflows.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Google Cloud models via Agent Platform","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Google Cloud models via Agent Platform<\/h2><div class=\"bi\"><ul>\n<li>Agent Platform streamlines <strong>discovery, deployment and customisation<\/strong> of models, giving flexibility without extensive in-house model development.<\/li>\n<li>It provides access to <strong>Google models<\/strong> (Gemini, Gemma, Nano Banana, Veo), <strong>proprietary third-party models<\/strong>, and <strong>openly available models<\/strong>.<\/li>\n<\/ul><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Gemini<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\"><strong>Multimodal<\/strong> model: text, images, audio, video<\/div><\/div><div class=\"kf\"><div class=\"kl\">Uses<\/div><div class=\"kv\">Complex multimodal understanding, advanced conversational AI, content creation, nuanced Q&amp;A<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Gemma<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\">Family of <strong>lightweight, open models<\/strong> built on Gemini research and technology<\/div><\/div><div class=\"kf\"><div class=\"kl\">Uses<\/div><div class=\"kv\">Customisable; <strong>local deployments<\/strong>, specialised AI apps<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Nano Banana<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\"><strong>Text-to-image diffusion<\/strong> model<\/div><\/div><div class=\"kf\"><div class=\"kl\">Uses<\/div><div class=\"kv\">High-quality images from text: creative design, e-commerce visualisation, content creation<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Model<\/div><div class=\"kt\"><strong>Veo<\/strong><\/div><div class=\"kf\"><div class=\"kl\">What it is<\/div><div class=\"kv\"><strong>Video generation<\/strong> model, from text or still images<\/div><\/div><div class=\"kf\"><div class=\"kl\">Uses<\/div><div class=\"kv\">Film production, advertising, online content<\/div><\/div><\/div><\/div><p><strong>Collective business value:<\/strong>\n- better customer experiences (chatbots, personalised content);\n- productivity (task automation, information retrieval);\n- innovation (new ideas and designs);\n- data-driven decisions.<\/p><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check answers<\/h2><div class=\"bi\"><ul>\n<li><strong>Gemini vs Gemma:<\/strong> Gemini = multimodal. Gemma = lightweight open models for local or specialised use.<\/li>\n<li><strong>Nano Banana vs Veo:<\/strong> Nano Banana = text-to-image diffusion. Veo = video from text or images.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Choose using <strong>modality, context window, security, availability, cost, performance, fine-tuning, integration<\/strong>. Access and customise Google models through <strong>Agent Platform<\/strong>.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The exam guide's named Google foundation models are <strong>Gemini, Gemma, Imagen and Veo<\/strong>. The course replaced Imagen with Nano Banana in this lesson.<\/li>\n<li><strong>Imagen<\/strong> = Google's text-to-image diffusion model (the 'text-to-image diffusion model' description belongs to Imagen). <strong>Nano Banana<\/strong> = the course's name for Gemini's native image generation and editing.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"2.9","title":"Google strategies for foundation model limitations","kind":"concept","html":"","videos":["jXcAcnUfmSQ"],"steps":[{"title":"Grounding intro (video)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Grounding intro (video)<\/h2><div class=\"bi\"><ul>\n<li>The video stages a skit: the presenter \"hallucinates\" absurd claims (talking cats, people flying). Gen AI is creative but can <strong>hallucinate<\/strong>, losing touch with reality.<\/li>\n<li><strong>Grounding<\/strong> = a reality check. It <strong>ties a model's answers to specific sources<\/strong>, making output more <strong>accurate and relevant<\/strong>.<\/li>\n<li><strong>Enterprise context:<\/strong> connect the AI to the <strong>company's own data<\/strong> (internal documents and reports, customer data, even code). It then learns the company's language and gives <strong>tailored<\/strong>, not generic, answers.<\/li>\n<li>Grounding is a <strong>safety net<\/strong> and essential for <strong>trustworthy<\/strong> AI. The next lesson covers <strong>fine-tuning and RAG<\/strong>.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"The 6 foundation model limitations (exam favourite)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The 6 foundation model limitations (exam favourite)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Limitation<\/div><div class=\"kt\"><strong>Data dependency<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Performance depends heavily on large training data. Bias or incompleteness in the data flows into outputs (like writing an essay on a book you haven't read).<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Limitation<\/div><div class=\"kt\"><strong>Knowledge cutoff<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">The <strong>last date the model was trained on new information<\/strong>. It doesn't know later events and can give outdated or incorrect answers; models don't auto-update. Example: a 2022 cutoff means no knowledge of post-2022 events.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Limitation<\/div><div class=\"kt\"><strong>Bias<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Training data may contain bias (an <strong>unbalanced dataset<\/strong>). Statistical learning can <strong>amplify<\/strong> even subtle biases.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Limitation<\/div><div class=\"kt\"><strong>Fairness<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Even with balanced data, <strong>defining fairness is complex<\/strong> and interpreted in many ways. Fairness assessments cover only <strong>specific categories of bias<\/strong>, so benchmarks never give the full risk picture.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Limitation<\/div><div class=\"kt\"><strong>Hallucinations<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Outputs that aren't accurate or based on real information. Models <strong>can't verify against external sources<\/strong>, so answers can sound convincing yet be wrong. A major concern in accuracy-critical applications.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Limitation<\/div><div class=\"kt\"><strong>Edge cases<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Meaning<\/div><div class=\"kv\">Rare, atypical scenarios expose weaknesses: errors, misinterpretations, unexpected results.<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Know all six: <strong>data dependency, knowledge cutoff, bias, fairness, hallucinations, edge cases<\/strong>. The remedies are in 2.10.<\/p><\/div><\/section><\/div>"}]},{"id":"2.10","title":"Techniques to overcome limitations","kind":"concept","html":"","videos":[],"steps":[{"title":"1. Grounding · 2. Retrieval-augmented generation (RAG): a grounding method","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>1. Grounding<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Definition<\/div><div class=\"kv\">connecting AI output to <strong>verifiable sources of information<\/strong>. It tethers the model to real-world data and reduces invented content.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Benefits<\/div><div class=\"kv\"><ul>\n<li><strong>reduces hallucinations<\/strong>;<\/li>\n<li><strong>anchors responses<\/strong> in your provided data;<\/li>\n<li><strong>builds trust<\/strong> through <strong>citations and confidence scores<\/strong>, so you can verify.<\/li>\n<\/ul><\/div><\/div><div class=\"kcard\"><div class=\"kv\">You can ground in <strong>enterprise data<\/strong> or with <strong>Google Search<\/strong>.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>2. Retrieval-augmented generation (RAG): a grounding method<\/h2><div class=\"bi\"><p>RAG uses search to find relevant information in a knowledge base and passes it to the LLM as context. Three phases:\n1. <strong>Retrieval:<\/strong> a search engine finds relevant information. It uses an index that understands <strong>semantic meaning, not just keywords<\/strong>, so relevance is higher.\n2. <strong>Augmentation:<\/strong> the retrieved information is <strong>added to the prompt<\/strong>.\n3. <strong>Generation:<\/strong> the model answers using the augmented prompt <strong>plus its existing knowledge<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"3. Prompt engineering · 4. Fine-tuning","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>3. Prompt engineering<\/h2><div class=\"bi\"><ul>\n<li>The <strong>fastest and simplest<\/strong> way to give a model extra background: precise prompts steer it to the desired output.<\/li>\n<li><strong>Limit:<\/strong> it's bounded by the model's existing knowledge. It can't produce what the model never learned.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>4. Fine-tuning<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">When<\/div><div class=\"kv\">prompt engineering doesn't deliver; you need excellence on <strong>specific tasks<\/strong> or <strong>specific output formats<\/strong>, especially when you <strong>have examples of the desired output<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">What<\/div><div class=\"kv\"><strong>further training<\/strong> a pre-trained or foundation model on a <strong>new task-specific dataset<\/strong>, which <strong>adjusts the model's parameters<\/strong>. <strong>Agent Platform<\/strong> provides tuning tools.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Examples<\/div><div class=\"kv\">creative content in a specific style; code in a particular language; translation for specific languages or domains.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"5. Humans in the loop (HITL)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>5. Humans in the loop (HITL)<\/h2><div class=\"bi\"><p>Human input and feedback are built into the ML process for tasks needing judgement, context, or handling of incomplete data:\n- <strong>Content moderation:<\/strong> catch harmful or inappropriate user content that algorithms miss.\n- <strong>Sensitive applications:<\/strong> oversight in <strong>healthcare and finance<\/strong>.\n- <strong>High-risk decision making:<\/strong> e.g. <strong>medical diagnoses, criminal justice assessments<\/strong>. A human review and accountability layer.\n- <strong>Pre-generation review:<\/strong> experts validate outputs <strong>before deployment<\/strong>, catching errors and bias.\n- <strong>Post-generation review:<\/strong> continuous review <strong>after deployment<\/strong> to adapt to changing contexts and needs.<\/p><\/div><\/section><\/div>"},{"title":"Summary table: RAG vs fine-tuning vs grounding","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Summary table: RAG vs fine-tuning vs grounding<\/h2><div class=\"bi\"><div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>RAG<\/th>\n<th>Fine-tuning<\/th>\n<th>Grounding<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Definition<\/strong><\/td>\n<td>Retrieves relevant information from external knowledge bases and adds it to the prompt<\/td>\n<td>Further trains a pre-trained model on a new dataset for a task or domain<\/td>\n<td>Connects output to verifiable sources<\/td>\n<\/tr>\n<tr>\n<td><strong>Process<\/strong><\/td>\n<td>Retrieve → add to prompt → generate<\/td>\n<td>Select pre-trained model → gather data → train → evaluate &amp; refine<\/td>\n<td>Provide access to data sources → use RAG or fine-tuning to connect output<\/td>\n<\/tr>\n<tr>\n<td><strong>Data sources<\/strong><\/td>\n<td>External knowledge bases (databases, documents, internet)<\/td>\n<td>Task- or domain-specific datasets<\/td>\n<td>External knowledge bases or specific datasets<\/td>\n<\/tr>\n<tr>\n<td><strong>Relation to grounding<\/strong><\/td>\n<td><strong>A specific technique for<\/strong> grounding<\/td>\n<td><strong>Improves<\/strong> a model's ability to be grounded in specific domains<\/td>\n<td><strong>The overarching goal<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check answers<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Adapting the model with task-specific data<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Fine-tuning<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Crafting precise instructions<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Prompt engineering<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Augmenting the model with external knowledge<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>RAG<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Purpose of grounding<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>accuracy and reliability by connecting output to verifiable sources<\/strong> (not creativity, simplicity or speed).<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li>Decision rule:<ul>\n<li>quick improvement → prompt engineering;<\/li>\n<li>fresh or proprietary facts → RAG / grounding;<\/li>\n<li>consistent style or format, or a domain specialisation, with examples → fine-tuning;<\/li>\n<li>high stakes → HITL.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The course table says fine-tuning 'improves a model's ability to be grounded'. More precisely: grounding ties each answer to verifiable sources at answer time (e.g. RAG, Google Search); fine-tuning changes the model's parameters/behaviour and does not by itself cite sources or add fresh facts.<\/li>\n<li>Exam rule of thumb: fresh or proprietary facts → RAG/grounding; consistent style, format or task behaviour → fine-tuning.<\/li>\n<li>The exam guide also names <strong>prompt tuning<\/strong>: a lightweight tuning method that learns a small set of extra 'soft prompt' parameters while the base model stays frozen. Not the same as prompt engineering.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"2.11","title":"Secure AI","kind":"concept","html":"","videos":["CmAce0DzBy8"],"steps":[{"title":"Video framing · Definition","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Video framing<\/h2><div class=\"bi\"><ul>\n<li>Build technology responsibly: it should <strong>benefit the world and not cause harm<\/strong>, and <strong>others shouldn't be able to harm it<\/strong>.<\/li>\n<li>Harms to consider: <strong>privacy<\/strong>, <strong>misinformation<\/strong>, <strong>fair and ethical treatment<\/strong> of people.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Definition<\/h2><div class=\"bi\"><ul>\n<li><strong>Secure AI<\/strong> = <strong>preventing intentional harm<\/strong> to your applications: protecting AI systems from <strong>malicious attacks and misuse<\/strong>.<\/li>\n<li>Security must cover the <strong>full lifecycle, from development to deployment<\/strong>: data, infrastructure, and how and where apps are deployed.<\/li>\n<li>Contrast: Responsible AI (2.12) covers <strong>intentional and unintentional<\/strong> harm.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Security across the ML lifecycle","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Security across the ML lifecycle<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Gather your data<\/div><div class=\"kv\">secure data at all times. <strong>Access controls<\/strong> limit who can read the data and who can <strong>add<\/strong> to it, which prevents <strong>data poisoning<\/strong> (attackers slip manipulated data into training data so the model learns wrong, biased or harmful patterns; like secretly swapping ingredients in a recipe).<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Prepare your data<\/div><div class=\"kv\">look for confidential or sensitive data and <strong>anonymise<\/strong> it where feasible. <strong>Validate<\/strong> data with integrity checks and <strong>anomaly detection<\/strong> to catch poisoning. <strong>Encrypt<\/strong> data at rest and in use. <strong>Log<\/strong> and monitor in real time.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Train your model<\/div><div class=\"kv\">protect both the <strong>training data and the model parameters<\/strong> from unauthorised access or changes. Key threat: <strong>model theft<\/strong>, where attackers steal a proprietary model to gain advantage, exploit its weaknesses or copy sensitive functionality.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Deploy and predict<\/div><div class=\"kv\">control <strong>who can use the model and how<\/strong>. If you use a <strong>pre-built model, verify its source<\/strong> and check it for vulnerabilities.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Manage your model<\/div><div class=\"kv\">keep monitoring security. Follow current best practices for your platform and model, <strong>patch<\/strong> regularly, watch outputs for <strong>anomalies or tampering<\/strong>, and <strong>review access permissions<\/strong> regularly.<ul>\n<li>Analogy: you don't give everyone the master key to the office security system.<\/li>\n<li><strong>Adversarial attacks:<\/strong> attackers feed misleading inputs to trick the model (like a fake ID). Defence: <strong>filter, sanitise and check inputs<\/strong>, and <strong>screen outputs<\/strong> to prevent leaks of sensitive data or harmful content.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">6<\/span><div class=\"sb\"><div class=\"kt\">Stay informed<\/div><div class=\"kv\">keep up with the latest threats and security research.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Secure AI Framework (SAIF) · Google Cloud security tools","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Secure AI Framework (SAIF)<\/h2><div class=\"bi\"><ul>\n<li>Google's framework for <strong>security standards for building and deploying AI responsibly<\/strong>. A comprehensive approach to <strong>AI/ML model risk management<\/strong>.<\/li>\n<li>Helps organisations:<ul>\n<li><strong>find and stop threats<\/strong>;<\/li>\n<li><strong>automatically strengthen defences<\/strong>;<\/li>\n<li><strong>manage each AI system's unique risks<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li>Integrates with existing company security so models are <strong>secure by default<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Google Cloud security tools<\/h2><div class=\"bi\"><div class=\"cards c2\"><div class=\"kcard\"><div class=\"kt\">Secure-by-design infrastructure<\/div><div class=\"kv\">global network and hardware, <strong>encryption in transit and at rest<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Identity and Access Management (IAM)<\/div><div class=\"kv\">fine-grained control over access to and usage of resources.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Security Command Center<\/div><div class=\"kv\">a <strong>centralised view of security posture<\/strong> across the Google Cloud environment.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Workload <strong>monitoring<\/strong> tools.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Threat research and expertise","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Threat research and expertise<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Google Threat Intelligence Group (GTIG)<\/div><div class=\"kv\">and <strong>Mandiant<\/strong> share research to identify and disrupt malicious activity.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Mandiant Consulting<\/div><div class=\"kv\">specialised guidance and frontline experience to secure AI use and to use <strong>AI as a force multiplier for cyber defence<\/strong>.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Goal: move from basic protection to <strong>active validation and operational readiness<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>AI brings risks like <strong>data poisoning, model theft and prompt injection<\/strong>. <strong>SAIF<\/strong> plus Google Cloud security tools give AI apps a secure foundation.<\/p><\/div><\/section><\/div>"}]},{"id":"2.12","title":"Responsible AI","kind":"concept","html":"","videos":[],"steps":[{"title":"Definition · Security is the foundation","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Definition<\/h2><div class=\"bi\"><div class=\"defs\"><div class=\"def\"><div class=\"term\">Responsible AI<\/div><div class=\"meaning\">= ensuring AI apps <strong>avoid intentional AND unintentional harm<\/strong>. It covers ethical development and positive outcomes.<\/div><\/div><\/div><\/div><\/section><section class=\"blk sec\"><h2>Security is the foundation<\/h2><div class=\"bi\"><ul>\n<li><strong>Responsible AI is built on security.<\/strong> Secure apps protect both the company and its users.<\/li>\n<li>Analogy: a house with a weak foundation is compromised however beautiful the design.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Pillars covered","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Pillars covered<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Transparency<\/div><div class=\"kv\">users must understand <strong>how their information is used<\/strong> and <strong>how the AI works<\/strong>: data handling, decision processes, potential biases.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Privacy<\/div><div class=\"kv\"><ul>\n<li><strong>anonymise or pseudonymise<\/strong> data so individuals can't easily be identified;<\/li>\n<li>models can <strong>leak sensitive training data<\/strong>, so add safeguards.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Data quality, bias and fairness<\/div><div class=\"kv\"><ul>\n<li>Responsible AI needs <strong>high-quality data<\/strong>. Inaccurate or incomplete data produces biased outcomes.<\/li>\n<li>Technology reflects <strong>societal biases<\/strong>, and AI can <strong>amplify<\/strong> them.<\/li>\n<li>Also ask whether the data was <strong>collected consensually<\/strong> and whether it could <strong>perpetuate harmful bias<\/strong>.<\/li>\n<li>Example: a <strong>resume-screening tool<\/strong> favouring one demographic because of historical hiring data. (Analogy: a dog trained with biased commands.)<\/li>\n<li><strong>Fairness must be a core principle.<\/strong><\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Accountability and explainability<\/div><div class=\"kv\"><ul>\n<li><strong>Fairness requires accountability:<\/strong> know <strong>who is responsible<\/strong> for the AI's actions and <strong>how it decides<\/strong>.<\/li>\n<li><strong>Explainable AI<\/strong> makes model decisions <strong>transparent and understandable<\/strong>. That builds trust, helps debugging and uncovers hidden bias. (Analogy: a judge explaining a verdict.)<\/li>\n<li>Tool: <strong>Google Cloud's Vertex Explainable AI<\/strong>.<\/li>\n<\/ul><\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Legal implications<\/div><div class=\"kv\"><ul>\n<li>Key areas: <strong>data privacy, non-discrimination, intellectual property, product liability<\/strong>.<\/li>\n<li>Laws mandate responsible data handling, bias mitigation and transparency in algorithmic decisions.<\/li>\n<li>Respect the <strong>licences, rules and limitations of the models you use<\/strong>.<\/li>\n<li>The landscape is <strong>evolving fast<\/strong>: stay informed and seek <strong>legal counsel<\/strong>. Compliance is part of building <strong>trustworthy<\/strong> AI, not just a hurdle.<\/li>\n<\/ul><\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Course 2 wrap-up","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Course 2 wrap-up<\/h2><div class=\"bi\"><p>Consider <strong>safety, security and ethics at every stage<\/strong> of the lifecycle and actively mitigate issues. With the right guardrails, AI benefits society.<\/p><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Flashcard answers<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Why is data quality crucial?<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ To avoid <strong>biased or discriminatory outcomes<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Purpose of explainable AI?<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ To make <strong>AI decision-making transparent and understandable<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Key legal considerations?<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Data privacy, non-discrimination, intellectual property<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">How do AI systems perpetuate societal bias?<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ Through <strong>biased training data, biased developers, or biased deployment environments<\/strong>.<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk exam\"><h2>Exam hooks<\/h2><div class=\"bi\"><ul>\n<li><strong>Secure AI = intentional harm<\/strong> (attacks). <strong>Responsible AI = intentional + unintentional harm.<\/strong> Security is the base of responsible AI.<\/li>\n<li>Explainability tool → <strong>Vertex Explainable AI<\/strong>.<\/li>\n<\/ul><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>Exam guide wording: 'data <strong>anonymization<\/strong> and <strong>pseudonymization<\/strong>'. Anonymization removes identifiers so data can't be linked back to a person; pseudonymization swaps identifiers for tokens that can only be re-linked with separately protected information.<\/li>\n<\/ul><\/div><\/section><\/div>"}]}]},{"id":"3","title":"Gen AI: Navigate the Landscape","lessons":[{"id":"3.1","title":"Introduction to Gen AI: Navigate the Landscape","kind":"concept","html":"","videos":["wjAWGBc_4cI"],"steps":[{"title":"Overview · Video points (Erica & Brett)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><div class=\"bi\"><p>Recommended: complete Courses 1 and 2 first.<\/p><\/div><\/section><section class=\"blk sec\"><h2>Video points (Erica &amp; Brett)<\/h2><div class=\"bi\"><ul>\n<li>User-facing apps are exciting but only <strong>scratch the surface<\/strong> of gen AI.<\/li>\n<li>You can <strong>build a custom solution<\/strong> or use <strong>pre-existing tools<\/strong> (e.g. Google Cloud's).<\/li>\n<li>Whether or not you're a developer, decision-makers need to understand <strong>what's possible<\/strong> in order to decide well.<\/li>\n<li>The course covers the <strong>gen AI landscape<\/strong>: the layers gen AI is built on, at a <strong>high level<\/strong> (not technical detail).<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Questions this course answers","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Questions this course answers<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\">What are the <strong>layers<\/strong> of building gen AI solutions?<\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\">What <strong>Google Cloud options<\/strong> exist for building and using gen AI?<\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">When to choose one solution over another?<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><\/div>"}]},{"id":"3.2","title":"Understanding the layers of gen AI","kind":"concept","html":"","videos":["s9YCvQy9jZE"],"steps":[{"title":"The 5 layers (top → bottom) — exam core","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>The 5 layers (top → bottom) — exam core<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Layer<\/div><div class=\"kt\"><strong>Gen AI powered applications<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Role<\/div><div class=\"kv\">The user-facing <strong>frontend<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Key points<\/div><div class=\"kv\">Where users interact with and use AI capabilities. The layer most people know.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Layer<\/div><div class=\"kt\"><strong>Agents<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Role<\/div><div class=\"kv\"><strong>Autonomous action<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Key points<\/div><div class=\"kv\">An <strong>agent<\/strong> is software that <strong>learns how best to achieve a goal from its inputs and the tools available<\/strong>. It independently sets goals and carries them out in a defined environment: analyses situations, uses multiple tools, decides without constant human input. Handles <strong>multi-step tasks a model alone can't<\/strong> (research a topic, troubleshoot code, access a system by chaining actions). Types: customer, code, data agents and more.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Layer<\/div><div class=\"kt\"><strong>Platform<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Role<\/div><div class=\"kv\">The \"backbone\" or \"glue\"<\/div><\/div><div class=\"kf\"><div class=\"kl\">Key points<\/div><div class=\"kv\">Sits <strong>between agents and models<\/strong>, above models and infrastructure. Provides <strong>APIs, data management, model deployment tools<\/strong>. Hides infrastructure complexity.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Layer<\/div><div class=\"kt\"><strong>Models<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Role<\/div><div class=\"kv\">The agent's <strong>\"brain\"<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Key points<\/div><div class=\"kv\">Complex algorithms trained on vast data. They learn patterns to generate content, translate, answer questions.<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Layer<\/div><div class=\"kt\"><strong>Infrastructure<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Role<\/div><div class=\"kv\">The <strong>foundation<\/strong><\/div><\/div><div class=\"kf\"><div class=\"kl\">Key points<\/div><div class=\"kv\">Core compute: physical hardware (<strong>servers, GPUs, TPUs<\/strong>) and software to store and run models and training data.<\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Analogy: gen AI as an engine (recap)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Analogy: gen AI as an engine (recap)<\/h2><div class=\"bi\"><ul>\n<li>Infrastructure = <strong>foundation<\/strong><\/li>\n<li>Models = <strong>core<\/strong><\/li>\n<li>Platform = <strong>connects everything<\/strong><\/li>\n<li>Agents = <strong>drivers<\/strong> (decide and act)<\/li>\n<li>Applications = <strong>vehicles<\/strong> (take us to the destination)<\/li>\n<\/ul><blockquote class=\"note\">\n<p>Note: the page also has per-layer expand buttons. Their text restates the table above.<\/p>\n<\/blockquote><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Leaders should understand the interplay between the layers to guide teams, make informed decisions and unlock gen AI value.<\/p><\/div><\/section><section class=\"blk fix\"><h2>Exam wording &amp; corrections<\/h2><div class=\"bi\"><ul>\n<li>The course says agents 'independently set goals'. In practice an agent pursues a goal it is given, deciding its own steps and tools.<\/li>\n<\/ul><\/div><\/section><\/div>"}]},{"id":"3.3","title":"Agents and gen AI powered applications","kind":"concept","html":"","videos":[],"steps":[{"title":"Definition (memorise)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Definition (memorise)<\/h2><div class=\"bi\"><ul>\n<li>A <strong>gen AI agent<\/strong> is an <strong>application<\/strong> that tries to <strong>achieve a goal by observing the world and acting upon it<\/strong> using the <strong>tools<\/strong> at its disposal.<\/li>\n<li>Agents <strong>process information, reason over complex concepts, and take actions<\/strong>. Uses: customer service, employee productivity, creative tasks.<\/li>\n<li>You can use <strong>pre-built<\/strong> agents and apps or build <strong>custom<\/strong> ones.<\/li>\n<li><strong>AI Applications<\/strong> (Google Cloud) lets teams create agents using <strong>natural language<\/strong> instead of complex code.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"What agents bring to applications · Role split","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>What agents bring to applications<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Understanding and responding to natural language<\/div><div class=\"kv\">more intuitive interfaces, e.g. chatbots that grasp complex requests.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Automating complex tasks<\/div><div class=\"kv\">multi-step processes (gather info → decide → act).<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Personalisation<\/div><div class=\"kv\">learn user preferences and tailor the experience.<\/div><\/div><\/li><\/ol><\/div><\/section><section class=\"blk sec\"><h2>Role split<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kt\">Applications<\/div><div class=\"kv\">= the user-facing layer. They provide <strong>structure and context<\/strong>: the UI, overall goals, and the specific tasks agents help with.<\/div><\/div><div class=\"kcard\"><div class=\"kt\">Multi-agent system<\/div><div class=\"kv\">= several specialised agents working together in one app.<\/div><\/div><div class=\"kcard\"><div class=\"kv\">Examples:<ul>\n<li><strong>Travel booking app:<\/strong> one agent finds flights and hotels; another suggests activities. The app offers browsing and reservations.<\/li>\n<li><strong>Customer support app:<\/strong> an agent answers FAQs, troubleshoots, and <strong>escalates complex issues to humans<\/strong>. The app provides the chat UI and integrations.<\/li>\n<li><strong>Personalised learning app:<\/strong> an agent assesses knowledge, recommends materials, generates exercises. The app structures lessons and tracks progress.<\/li>\n<\/ul>\n<\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p><strong>Agents add intelligence and automation. Applications provide the framework and purpose.<\/strong><\/p><\/div><\/section><\/div>"}]},{"id":"3.4","title":"How agents work","kind":"concept","html":"","videos":[],"steps":[{"title":"Conversational agents","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Two categories of agents<\/h2><h3>Conversational agents<\/h3><div class=\"bi\"><p>They understand <strong>what you mean, not just what you say<\/strong>, and respond naturally. Flow:\n1. <strong>You provide input:<\/strong> typed or spoken.\n2. <strong>The agent understands:<\/strong> AI infers meaning and <strong>intent<\/strong>.\n3. <strong>The agent calls a tool:<\/strong> if needed, to get information or act (web search, database, another app).\n4. <strong>The agent generates a response:<\/strong> relevant and natural.\n5. <strong>The agent delivers the response:<\/strong> shown or spoken, matching how you interacted.<\/p><p>Examples:\n- <strong>Answering questions:<\/strong> weather in Paris, with a forecast and packing tips.\n- <strong>Casual conversation:<\/strong> jokes, books, movies.\n- <strong>Accessing information:<\/strong> the capital of Australia; a summary of the French Revolution.<\/p><\/div><\/section><\/div>"},{"title":"Workflow agents","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Two categories of agents<\/h2><h3>Workflow agents<\/h3><div class=\"bi\"><p>They streamline work by <strong>automating tasks or complex processes<\/strong> efficiently and correctly. Flow:\n1. <strong>You define a task or trigger a process:<\/strong> submit a form, upload a file, a scheduled event, an online order.\n2. <strong>The agent interprets the requirements<\/strong> and defines the series of steps.\n3. <strong>It executes actions<\/strong> per the workflow definition: data transformation, file transfer, notifications, external system integration, other automations via <strong>APIs<\/strong>.\n4. <strong>It generates a result:<\/strong> a report, data file, confirmation, or status update.\n5. <strong>It delivers the result<\/strong> to recipients or systems: email, dashboard, database, file storage.<\/p><p>Examples:\n- <strong>E-commerce order fulfilment:<\/strong> process orders, update inventory, shipping notices, returns.\n- <strong>Customer onboarding:<\/strong> account setup, tutorials, FAQs.\n- <strong>Automated research:<\/strong> browse, summarise, report. Try it with <strong>Gemini Deep Research<\/strong>.\n- <strong>Security log parsing:<\/strong> flag anomalies, open a ticket, start triage, assign to humans.<\/p><\/div><\/section><\/div>"},{"title":"Agent use-case families (both types)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agent use-case families (both types)<\/h2><div class=\"bi\"><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Customer service agents<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Does<\/div><div class=\"kv\">Answer questions, resolve issues, personalised recommendations<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Employee productivity agents<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Does<\/div><div class=\"kv\">Find information, manage tasks, automate workflows<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Creative agents<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Does<\/div><div class=\"kv\">Generate ideas and content, translate<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Code agents<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Does<\/div><div class=\"kv\">Write, review, debug code; code from natural language<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Data agents<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Does<\/div><div class=\"kv\">Analyse large datasets, find trends, extract insights<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">Type<\/div><div class=\"kt\"><strong>Security agents<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Does<\/div><div class=\"kv\">Summarise cases, research threats, generate security queries, create <strong>detection rules<\/strong><\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p><strong>Conversational<\/strong> = dialogue with users. <strong>Workflow<\/strong> = automate multi-step tasks.<\/p><\/div><\/section><\/div>"}]},{"id":"3.5","title":"Gen AI agents: Beyond just models","kind":"concept","html":"","videos":["O_TfUVbWc8o"],"steps":[{"title":"What makes an agent more than a model","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>What makes an agent more than a model<\/h2><div class=\"bi\"><ul>\n<li>Agents <strong>observe, act and achieve goals<\/strong>. They use models but go well beyond them.<\/li>\n<li>Two distinguishing elements:<ol>\n<li><strong>Reasoning loop:<\/strong> the agent's \"thinking process\", a continuous cycle that lets it analyse, plan and adapt to outcomes.<\/li>\n<li><strong>Tools:<\/strong> functions that let the agent <strong>interact with its environment<\/strong>: access and process data, use software apps, even control <strong>physical robots<\/strong>. Like apps on a phone, they connect the agent to real-world information and services.<\/li>\n<\/ol>\n<\/li>\n<li><strong>Tool examples:<\/strong><ul>\n<li>access and update company <strong>inventory<\/strong>;<\/li>\n<li><strong>schedule meetings<\/strong> by checking calendars;<\/li>\n<li><strong>auto-order supplies<\/strong> when stock is low;<\/li>\n<li>talk to a robot's <strong>sensors and actuators<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Agents vs LLMs · The reasoning loop (memorise the 4 steps)","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Agents vs LLMs<\/h2><div class=\"bi\"><ul>\n<li>Reasoning + tools take agents <strong>beyond text generation<\/strong>. They:<ul>\n<li><strong>solve complex problems<\/strong>: analyse, gather data with tools, decide with <strong>minimal human intervention<\/strong>;<\/li>\n<li><strong>manage multi-step tasks<\/strong> LLMs alone can't: in-depth research, troubleshooting code, automating across multiple systems;<\/li>\n<li>produce results <strong>beyond text or media<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>The reasoning loop (memorise the 4 steps)<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Observe<\/div><div class=\"kv\">gather information about the environment and the task.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Interpret<\/div><div class=\"kv\">process it and assess the situation.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Plan<\/div><div class=\"kv\">choose a course of action toward the goal.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Act<\/div><div class=\"kv\">execute.<\/div><\/div><\/li><\/ol><p>It <strong>repeats until the goal or a stopping point<\/strong> is reached. Complexity varies: from simple <strong>rule-based<\/strong> loops to complex logic with extra algorithms or <strong>probabilistic reasoning<\/strong>.<\/p><\/div><\/section><\/div>"},{"title":"Advanced prompt engineering frameworks used in the loop","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Advanced prompt engineering frameworks used in the loop<\/h2><div class=\"bi\"><ul>\n<li>Can include:<ul>\n<li>simple rule-based calculations;<\/li>\n<li>complex thought chains;<\/li>\n<li>ML algorithms;<\/li>\n<li>probabilistic reasoning techniques.<\/li>\n<\/ul>\n<\/li>\n<li>Named examples: <strong>ReAct<\/strong> and <strong>chain-of-thought (CoT)<\/strong> prompting. Both are covered in Course 5.<\/li>\n<\/ul><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check: model vs agent (my answer key; the page shows feedback only after you submit)<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\"><strong>Writing assistant:<\/strong><ul>\n<li>Grammatical, stylistically appropriate text<\/li><\/ul><\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Model<\/strong>.\n<li>Organising and formatting content to guidelines → <strong>Agent<\/strong>.<\/li>\n<\/div><\/div><div class=\"qa\"><div class=\"qq\"><strong>Education platform:<\/strong><ul>\n<li>Evaluating a short answer for accuracy, completeness, clarity<\/li><\/ul><\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Model<\/strong>.\n<li>Providing customised materials and exercises → <strong>Agent<\/strong>.<\/li>\n<li>Tracking progress and adapting the plan → <strong>Agent<\/strong>.<\/li>\n<\/div><\/div><\/div><p>Rule of thumb: generating or understanding content = model. Multi-step orchestration, personalisation over time, actions = agent.<\/p><\/div><\/section><\/div>"},{"title":"Recap","kind":"recap","html":"<div class=\"stepbody\"><section class=\"blk takeaway\"><h2>Key takeaway<\/h2><div class=\"bi\"><p>Agents = <strong>model + reasoning loop + tools<\/strong>. They solve complex problems and manage workflows far beyond standalone models.<\/p><\/div><\/section><\/div>"}]},{"id":"3.6","title":"The platform layer","kind":"concept","html":"","videos":["TinIYVJC1mE"],"steps":[{"title":"Video · Agent Platform: 6 key features and benefits","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>Video<\/h2><div class=\"bi\"><ul>\n<li>Building ML solutions alone \"in the wild\" is very complex. A good platform brings all the pieces together <strong>easily and scalably<\/strong>. The platform is <strong>\"the glue\"<\/strong>.<\/li>\n<li>Example: Google Cloud's unified ML platform, <strong>Vertex AI<\/strong>, now called <strong>Agent Platform<\/strong>. It provides <strong>infrastructure, pre-trained models and tools<\/strong> to build, deploy and manage ML and gen AI.<\/li>\n<\/ul><\/div><\/section><section class=\"blk sec\"><h2>Agent Platform: 6 key features and benefits<\/h2><div class=\"bi\"><ol class=\"steps\"><li class=\"step\"><span class=\"sn\">1<\/span><div class=\"sb\"><div class=\"kt\">Open and flexible<\/div><div class=\"kv\">supports open frameworks, your preferred tools and models, <strong>no vendor lock-in<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">2<\/span><div class=\"sb\"><div class=\"kt\">Powerful infrastructure<\/div><div class=\"kv\">Google Cloud's scalable, reliable infrastructure.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">3<\/span><div class=\"sb\"><div class=\"kt\">Pre-trained models<\/div><div class=\"kv\">choose many, or build your own.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">4<\/span><div class=\"sb\"><div class=\"kt\">Comprehensive tooling<\/div><div class=\"kv\">integrated tools to develop, deploy and manage.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">5<\/span><div class=\"sb\"><div class=\"kt\">Customisation<\/div><div class=\"kv\">fine-tune and adapt models using the <strong>built-in IDE<\/strong>.<\/div><\/div><\/li><li class=\"step\"><span class=\"sn\">6<\/span><div class=\"sb\"><div class=\"kt\">Easy integration<\/div><div class=\"kv\">put models into apps via <strong>APIs<\/strong>.<\/div><\/div><\/li><\/ol><\/div><\/section><\/div>"},{"title":"MLOps on Agent Platform","kind":"content","html":"<div class=\"stepbody\"><section class=\"blk sec\"><h2>MLOps on Agent Platform<\/h2><div class=\"bi\"><ul>\n<li>Operationalising training is hard (infrastructure, security). Agent Platform gives you:<ul>\n<li><strong>fully managed compute<\/strong>;<\/li>\n<li><strong>high-performance, ML-optimised training jobs<\/strong>;<\/li>\n<li><strong>distributed training<\/strong>;<\/li>\n<li><strong>hyperparameter optimisation<\/strong>;<\/li>\n<li><strong>enterprise security<\/strong>.<\/li>\n<\/ul>\n<\/li>\n<li><strong>MLOps<\/strong> automates, standardises and manages the ML project lifecycle, which improves collaboration and continuous improvement.<\/li>\n<li>MLOps capabilities: orchestrate end-to-end workflows, feature engineering, experiments, manage and iterate models, track ML metadata, monitor and evaluate quality.<\/li>\n<\/ul><div class=\"cards c3\"><div class=\"kcard\"><div class=\"kl\">MLOps tool<\/div><div class=\"kt\"><strong>Agent Platform Feature Store<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Purpose<\/div><div class=\"kv\"><strong>Share, serve and reuse ML features<\/strong> for consistency and efficiency<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">MLOps tool<\/div><div class=\"kt\"><strong>Model Registry<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Purpose<\/div><div class=\"kv\"><strong>Manage model versions<\/strong>, track changes, organise models across the lifecycle<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">MLOps tool<\/div><div class=\"kt\"><strong>Model Evaluation<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Purpose<\/div><div class=\"kv\"><strong>Evaluate and compare<\/strong> model performance to pick the best<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">MLOps tool<\/div><div class=\"kt\"><strong>Agent Platform Pipelines<\/strong> (workflow orchestration)<\/div><div class=\"kf\"><div class=\"kl\">Purpose<\/div><div class=\"kv\"><strong>Automate ML workflows<\/strong> from preprocessing to deployment<\/div><\/div><\/div><div class=\"kcard\"><div class=\"kl\">MLOps tool<\/div><div class=\"kt\"><strong>Model Monitoring<\/strong><\/div><div class=\"kf\"><div class=\"kl\">Purpose<\/div><div class=\"kv\">Detect <strong>performance degradation, input skew and drift<\/strong>; trigger updates or <strong>retraining<\/strong><\/div><\/div><\/div><\/div><\/div><\/section><\/div>"},{"title":"Check yourself","kind":"check","html":"<div class=\"stepbody\"><section class=\"blk check\"><h2>Knowledge check (answer key)<\/h2><div class=\"bi\"><div class=\"qas\"><div class=\"qa\"><div class=\"qq\">Track experiments, manage versions, keep a change record<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><div class=\"qans\">→ <strong>Model Registry<\/strong>.<\/div><\/div><div class=\"qa\"><div class=\"qq\">Deployed model's performance declining; find the cause and retrain<\/div><button class=\"reveal\" type=\"button\">Show answer<\/button><di
