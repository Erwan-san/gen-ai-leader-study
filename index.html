 ReAct matters?","a":"Dynamic problem solving · reduced hallucination · increased trustworthiness.","id":"c5-031","x":"3.2"},{"l":"5.7","t":"def","tags":["prompting"],"q":"What is chain-of-thought (CoT) prompting?","a":"Guiding a model with examples showing intermediate reasoning steps so it reasons step by step.","id":"c5-032","x":"3.2"},{"l":"5.7","t":"list","tags":["prompting"],"q":"Benefits of CoT?","a":"Improved reasoning · better accuracy · explainability (course claim). Caveat: shown reasoning steps aren't a guaranteed explanation of how the model reached its answer.","id":"c5-033","x":"3.2"},{"l":"5.7","t":"list","tags":["prompting"],"q":"CoT variants?","a":"Self-consistency · active-prompting · multimodal CoT.","id":"c5-034","x":"3.2"},{"l":"5.7","t":"def","tags":["prompting"],"q":"What is self-consistency (CoT)?","a":"Generate multiple solutions and choose the most consistent one.","id":"c5-035","x":"3.2"},{"l":"5.7","t":"trap","tags":["prompting"],"q":"CoT vs ReAct focus?","a":"CoT = internal reasoning. ReAct = external interaction (gather info, take actions). They can be combined.","id":"c5-036","x":"3.2"},{"l":"5.7","t":"scenario","tags":["prompting"],"q":"Find a highly rated restaurant near the user now — CoT or ReAct?","a":"ReAct.","id":"c5-037","x":"3.2"},{"l":"5.7","t":"scenario","tags":["prompting"],"q":"Solve a multi-step math word problem with explained steps — CoT or ReAct?","a":"CoT.","id":"c5-038","x":"3.2"},{"l":"5.8","t":"list","tags":["tools"],"q":"4 types of agent tools?","a":"Extensions (APIs) · functions · data stores · plugins.","id":"c5-039","x":"2.5"},{"l":"5.8","t":"trap","tags":["tools"],"q":"Extension vs function vs data store vs plugin?","a":"Extension: standardised bridge to external APIs. Function: a specific defined action. Data store: access to information. Plugin: adds new skills/integrations.","id":"c5-040","x":"2.5"},{"l":"5.8","t":"scenario","tags":["tools"],"q":"A 'calculate_price' routine the agent calls with flight details. Which tool type?","a":"Function.","id":"c5-041","x":"2.5"},{"l":"5.8","t":"scenario","tags":["tools"],"q":"Agent connects to a payment gateway to process transactions. Which tool type?","a":"Plugin.","id":"c5-042","x":"2.5"},{"l":"5.8","t":"scenario","tags":["tools"],"q":"Agent reads current stock prices or a customer database. Which tool type?","a":"Data store.","id":"c5-043","x":"2.5"},{"l":"5.8","t":"list","tags":["tools","agents"],"q":"ReAct cycle with tools?","a":"Reasoning (tool selection) → acting (tool execution) → observation → iteration.","id":"c5-044","x":"2.5"},{"l":"5.9","t":"product","tags":["tools","gcloud"],"q":"Serverless functions acting as agent tools (call APIs, calculations), auto-scaling — which service?","a":"Cloud Run functions.","id":"c5-045","x":"2.5"},{"l":"5.9","t":"product","tags":["tools","gcloud"],"q":"Serverless platform for stateless containers for complex custom tools — which service?","a":"Cloud Run.","id":"c5-046","x":"2.5"},{"l":"5.9","t":"fact","tags":["tools","agents"],"q":"Can agents use other agents as tools?","a":"Yes — e.g. via Agent Platform, agents/models called as tooling by other agents.","id":"c5-047","x":"2.5"},{"l":"5.9","t":"list","tags":["tools","gcloud"],"q":"Databases named as agent tooling?","a":"Cloud SQL, Spanner, Firestore.","id":"c5-048","x":"2.5"},{"l":"5.9","t":"number","tags":["apis"],"q":"How many languages does the Translation API support (course figure)?","a":"More than 135.","id":"c5-049","x":"2.5"},{"l":"5.9","t":"product","tags":["apis"],"q":"Which API translates formatted documents while keeping layout?","a":"Document Translation API.","id":"c5-050","x":"2.5"},{"l":"5.9","t":"product","tags":["apis"],"q":"Which API extracts data from invoices, contracts, medical records and can summarise large documents?","a":"Document AI API.","id":"c5-051","x":"2.5"},{"l":"5.9","t":"product","tags":["apis"],"q":"Which API detects objects, faces, landmarks and reads text in images (OCR)?","a":"Cloud Vision API.","id":"c5-052","x":"2.5"},{"l":"5.9","t":"product","tags":["apis"],"q":"Which API identifies objects, actions and events in video and transcribes speech?","a":"Cloud Video Intelligence API.","id":"c5-053","x":"2.5"},{"l":"5.9","t":"product","tags":["apis"],"q":"Which API derives sentiment, classifies content and extracts entities from text?","a":"Natural Language API.","id":"c5-054","x":"2.5"},{"l":"5.9","t":"scenario","tags":["tools"],"q":"Meeting location planner: which two Google tools?","a":"Document AI (extract addresses from the uploaded doc) + Google Maps API (location analysis).","id":"c5-055","x":"2.5"},{"l":"5.10","t":"trap","tags":["apis"],"q":"Credentials to call Gemini: Google AI Studio vs Agent Studio?","a":"AI Studio: API key. Agent Studio: Google Cloud authentication & authorisation.","id":"c5-056","x":"2.4"},{"l":"5.10","t":"trap","tags":["gcloud"],"q":"Cloud Run functions vs Cloud Run for deploying agent apps?","a":"Functions: small event-triggered code, no servers (e.g. caption uploaded images). Cloud Run: containerised apps needing specific software/config (e.g. chatbot web app).","id":"c5-057","x":"2.4"},{"l":"5.10","t":"product","tags":["workspace"],"q":"Which platform automates Workspace tasks with JavaScript and can use the Gemini API for add-ons?","a":"Apps Script.","id":"c5-058","x":"2.2"},{"l":"5.10","t":"fact","tags":["apis"],"q":"Where can the Gemini API be integrated?","a":"Virtually any app that can make HTTP requests — web, mobile, desktop, embedded.","id":"c5-059","x":"2.4"},{"l":"5.10","t":"scenario","tags":["agents"],"q":"A customer-service agent calls a sentiment-analysis agent during conversations. What concept?","a":"Multi-agent system / an agent used as a tool of another agent.","id":"c5-060","x":"2.4"},{"l":"5.11","t":"fact","tags":["rag"],"q":"Pre-RAG limitation of tool use?","a":"Tool-retrieved data was used only for the immediate query; models couldn't process/integrate it; knowledge static to training data.","id":"c5-061","x":"3.3"},{"l":"5.11","t":"list","tags":["rag"],"q":"Retrieval tools in RAG?","a":"Data stores · vector databases · search engines · knowledge graphs.","id":"c5-062","x":"3.3"},{"l":"5.11","t":"def","tags":["rag"],"q":"What do vector databases store?","a":"Embeddings — numerical representations of text — enabling semantic similarity search.","id":"c5-063","x":"3.3"},{"l":"5.11","t":"def","tags":["rag"],"q":"What is a knowledge graph?","a":"A structured database of entities and their relationships, queried for facts.","id":"c5-064","x":"3.3"},{"l":"5.11","t":"list","tags":["rag"],"q":"Data store options in AI Applications?","a":"Websites · structured data (tables, JSON) · unstructured data (HTML, PDF, DOCX).","id":"c5-065","x":"3.3"},{"l":"5.11","t":"scenario","tags":["rag"],"q":"Adding knowledge-base context to the user's query — which RAG stage?","a":"Augmentation.","id":"c5-066","x":"3.3"},{"l":"5.11","t":"fact","tags":["rag"],"q":"How can some RAG systems iterate?","a":"Refine the query, try other retrieval tools, or ask the user clarifying questions.","id":"c5-067","x":"3.3"},{"l":"5.12","t":"fact","tags":["rag","apis"],"q":"How do you turn on RAG with live web data in Google AI Studio?","a":"Run settings → Tools → Grounding using Google Search.","id":"c5-068","x":"3.3"},{"l":"5.13","t":"list","tags":["search"],"q":"What does Agent Platform Search combine?","a":"Information retrieval + natural language processing + LLMs. It is mainly enterprise search and retrieval (RAG) that apps and agents use.","id":"c5-069","x":"2.3"},{"l":"5.13","t":"list","tags":["search"],"q":"Specialised Agent Search search options?","a":"Document search · media search · healthcare search · search for commerce.","id":"c5-070","x":"2.3"},{"l":"5.13","t":"list","tags":["search"],"q":"Agent Search recommendation options?","a":"General recommendations · media recommendations · retail recommendations.","id":"c5-071","x":"2.3"},{"l":"5.13","t":"scenario","tags":["search"],"q":"Search across a large repository of unstructured text docs in Cloud Storage. Which option?","a":"Document search.","id":"c5-072","x":"2.3"},{"l":"5.13","t":"scenario","tags":["search"],"q":"Search patient records and guidelines with regulatory compliance. Which option?","a":"Healthcare search.","id":"c5-073","x":"2.3"},{"l":"5.13","t":"list","tags":["search","grounding"],"q":"What does Agent Search ground responses in?","a":"First-party data · curated third-party data · Google's knowledge graph (Grounding with Google Search) — a RAG approach.","id":"c5-074","x":"2.3"},{"l":"5.13","t":"list","tags":["search"],"q":"Extra gen AI features of Agent Search?","a":"Search summaries · answers and follow-ups.","id":"c5-075","x":"2.3"},{"l":"5.13","t":"list","tags":["search"],"q":"Enterprise features of Agent Search?","a":"Granular access controls · advanced analytics · scalable infrastructure · APIs/SDKs integration.","id":"c5-076","x":"2.3"},{"l":"5.14","t":"scenario","tags":["search","usecase"],"q":"Clothing retailer: feature helping customers find items they couldn't describe in words?","a":"AI-powered image search (upload a photo → visually similar products).","id":"c5-077","x":"2.3"},{"l":"5.14","t":"list","tags":["search","usecase"],"q":"3 Agent Search for commerce features in the clothing case?","a":"Semantic understanding (synonyms, misspellings) · image search · personalised retail recommendations.","id":"c5-078","x":"2.3"},{"l":"5.15","t":"list","tags":["cx"],"q":"Components of Gemini Enterprise for CX?","a":"CX agents (built in CX Agent Studio) · Agent Assist (for human agents) · CX Insights (conversation analytics) · all on Contact Center as a Service (CCaaS).","id":"c5-079","x":"2.3"},{"l":"5.15","t":"trap","tags":["cx"],"q":"Deterministic vs generative vs hybrid in CX Agent Studio?","a":"Deterministic: explicit rules, low-to-medium code, max predictability. Generative: Gemini, intent from text/image/voice, little/no code. Hybrid: rules for compliance/security + generative flexibility.","id":"c5-080","x":"2.3"},{"l":"5.15","t":"product","tags":["cx"],"q":"Which tool supports live human agents with suggested responses, KB articles, transcription/translation and summaries?","a":"Agent Assist.","id":"c5-081","x":"2.3"},{"l":"5.15","t":"product","tags":["cx"],"q":"Which tool analyses sentiment, entities and topics across conversations and scores interactions?","a":"CX Insights.","id":"c5-082","x":"2.3"},{"l":"5.15","t":"product","tags":["cx"],"q":"Which component provides omnichannel support, CRM integration and agent routing?","a":"Contact Center as a Service (CCaaS).","id":"c5-083","x":"2.3"},{"l":"5.15","t":"product","tags":["cx"],"q":"What does Generative FAQ in Insights show?","a":"Common customer questions and how they're answered — to find FAQ gaps and trends.","id":"c5-084","x":"2.3"},{"l":"5.15","t":"scenario","tags":["cx"],"q":"An agent must process refunds with strict compliance yet handle nuanced requests. Which build approach?","a":"Hybrid agent in CX Agent Studio.","id":"c5-085","x":"2.3"},{"l":"5.16","t":"number","tags":["usecase","cx"],"q":"Cymbal Taxes results?","a":"NPS +15 points · call volume -20% · email inquiries -30%.","id":"c5-086","x":"2.3"},{"l":"5.16","t":"scenario","tags":["usecase","cx"],"q":"Cymbal Taxes: how was the tax assistant built?","a":"CX Agent Studio with natural-language instructions + a data store tool (tax laws, FAQs, customer data).","id":"c5-087","x":"2.3"},{"l":"5.16","t":"fact","tags":["usecase"],"q":"Primary challenge solved for Cymbal Taxes?","a":"Keeping up with high inquiry volume during tax season.","id":"c5-088","x":"2.3"},{"l":"5.17","t":"list","tags":["agents"],"q":"What do you define in CX Agent Studio agent instructions?","a":"The goal, how the agent should act, rules to follow; then add tools like data stores.","id":"c5-089","x":"2.3"},{"l":"5.17","t":"def","tags":["prompting"],"q":"What are system instructions?","a":"Context, persona and constraints given before any user input to guide model behaviour.","id":"c5-090","x":"3.2"},{"l":"5.17","t":"list","tags":["prompting"],"q":"4 benefits of system instructions?","a":"Consistency · accuracy · relevance · safety.","id":"c5-091","x":"3.2"},{"l":"5.17","t":"fact","tags":["cx"],"q":"Recommended tool for production customer chatbots (e.g. adversarial defence)?","a":"CX Agent Studio.","id":"c5-092","x":"2.3"},{"l":"5.18","t":"def","tags":["enterprise"],"q":"What is the Gemini Enterprise app?","a":"A launch point for enterprise-ready expert agents that find information, understand data and automate tasks across all connected business systems.","id":"c5-093","x":"2.2"},{"l":"5.18","t":"list","tags":["enterprise"],"q":"What can you connect or add in the Gemini Enterprise app?","a":"Gemini Notebook Enterprise · multimodal search agents (Drive, Confluence, Jira, ServiceNow…) · gen AI assistants taking actions via connectors · custom agents from CX Agent Studio.","id":"c5-094","x":"2.2"},{"l":"5.18","t":"trap","tags":["enterprise","notebook"],"q":"Gemini Enterprise app vs Gemini Notebook Enterprise?","a":"Notebook: deep dive into specific uploaded sources only. Enterprise app: comprehensive assistant using agents and unified search across all connected systems to automate tasks.","id":"c5-095","x":"2.2"},{"l":"5.18","t":"scenario","tags":["enterprise"],"q":"Employees need one assistant that searches Confluence, Jira and Drive and can create calendar events. Which product?","a":"Gemini Enterprise app.","id":"c5-096","x":"2.2"},{"l":"5.19","t":"list","tags":["strategy"],"q":"6 steps to plan gen AI integration?","a":"Establish a clear vision · prioritise high-impact use cases · invest in capabilities · drive organisational change · measure and demonstrate value · champion responsible AI.","id":"c5-097","x":"4.1"},{"l":"5.19","t":"list","tags":["strategy"],"q":"3 steps to plan for impact?","a":"Define key metrics · collect and analyse data · iterate and improve.","id":"c5-098","x":"4.1"},{"l":"5.19","t":"list","tags":["strategy"],"q":"Factors to weigh when prioritising high-impact use cases?","a":"Technical feasibility · data readiness · potential for transformation.","id":"c5-099","x":"4.1"},{"l":"5.19","t":"scenario","tags":["strategy"],"q":"How would you measure a new gen AI chatbot's customer-experience impact?","a":"Compare satisfaction scores before vs after implementation.","id":"c5-100","x":"4.1"},{"l":"5.19","t":"list","tags":["strategy"],"q":"If ROI is lacking, what adjustments does the course suggest?","a":"Fine-tune models · update training data · improve prompting · integrate better into workflows.","id":"c5-101","x":"4.1"},{"l":"5.19","t":"list","tags":["strategy"],"q":"Ways to plan for change / stay ahead?","a":"Review strategy regularly · stay informed · engage the community · invest in training · attract and retain talent.","id":"c5-102","x":"4.1"},{"l":"5.19","t":"fact","tags":["exam"],"q":"Exam format stated in the course?","a":"Proctored, about 90 minutes; register at cloud.google.com/learn/certification/generative-ai-leader.","id":"c5-103","x":"4.1"},{"l":"2.2","x":"1.1","t":"def","tags":["fundamentals","exam"],"q":"What is natural language processing (NLP)?","a":"The branch of AI that lets computers understand, interpret and generate human language (text and speech). LLMs are a modern, foundation-model approach to NLP.","id":"e-001"},{"l":"2.10","x":"1.1","t":"trap","tags":["tuning","prompting","exam"],"q":"Prompt tuning vs prompt engineering?","a":"Prompt engineering: writing better text instructions; the model is unchanged. Prompt tuning: a lightweight tuning method that learns a small set of extra 'soft prompt' parameters added to the input while the base model's weights stay frozen — cheaper than full fine-tuning.","id":"e-002"},{"l":"2.10","x":"3.1","t":"trap","tags":["tuning","grounding","exam"],"q":"Fine-tuning vs grounding — what does each actually change?","a":"Fine-tuning changes the model itself (parameters) to shift style, format or task behaviour. Grounding leaves the model as is and connects each answer to verifiable sources at answer time (e.g. RAG, Google Search).","id":"e-003"},{"l":"2.10","x":"3.3","t":"scenario","tags":["rag","tuning","exam"],"q":"A bank wants answers based on this week's internal policy updates, with citations. Fine-tuning or RAG?","a":"RAG / grounding — fresh, proprietary facts with sources. Fine-tuning would bake in a snapshot and can't cite.","id":"e-004"},{"l":"2.7","x":"1.1","t":"def","tags":["models","exam"],"q":"What is a multimodal foundation model?","a":"A foundation model that can take in and/or produce several data types — text, images, audio, video, code — and combine them (e.g. Gemini).","id":"e-005"},{"l":"2.8","x":"1.4","t":"product","tags":["models","exam"],"q":"Imagen — what is it and when would you pick it?","a":"Google's text-to-image diffusion model: high-quality images from text descriptions, plus image editing. Use for marketing visuals, product imagery, creative content.","id":"e-006"},{"l":"2.8","x":"1.4","t":"trap","tags":["models","exam"],"q":"Exam guide's four Google foundation models and one strength each?","a":"Gemini — multimodal reasoning/understanding · Gemma — lightweight open models for local/custom use · Imagen — text-to-image · Veo — video generation.","id":"e-007"},{"l":"2.8","x":"1.4","t":"scenario","tags":["models","exam"],"q":"A startup needs a model it can run on its own hardware and customise freely. Which Google model family?","a":"Gemma (lightweight, open models).","id":"e-008"},{"l":"2.8","x":"1.4","t":"trap","tags":["models","exam"],"q":"Imagen vs Nano Banana?","a":"Both make images. Imagen is the dedicated text-to-image model named in the exam guide. Nano Banana is the course's name for Gemini's native image generation/editing. On the exam, expect Imagen.","id":"e-009"},{"l":"2.6","x":"3.1","t":"trap","tags":["platform","exam"],"q":"Model Garden vs Model Registry?","a":"Model Garden: catalogue to discover, test, customise and deploy available models (Google, partner, open). Model Registry: manage YOUR models' versions and lifecycle.","id":"e-010"},{"l":"2.6","x":"1.1","t":"fact","tags":["data","exam"],"q":"Data Catalog status in 2026?","a":"Discontinued 1 June 2026; replaced by Knowledge Catalog (formerly Dataplex Universal Catalog). The course still names Data Catalog.","id":"e-011"},{"l":"2.11","x":"4.2","t":"list","tags":["security","exam"],"q":"Security measure per ML lifecycle stage (Secure AI lesson)?","a":"Gather data: access controls on who reads/adds data (stops data poisoning) · Prepare: anonymise sensitive data, validate integrity, anomaly detection, encrypt, log/monitor · Train: protect training data and model parameters (model theft) · Deploy: control who can use the model, verify pre-built model sources · Manage: monitor for tampering/anomalies, patch, review access.","id":"e-012"},{"l":"2.11","x":"4.2","t":"scenario","tags":["security","exam"],"q":"What is the key security concern in the model TRAINING phase?","a":"Protecting training data and model parameters from unauthorised access or modification — including model theft.","id":"e-013"},{"l":"2.11","x":"4.2","t":"def","tags":["security","exam"],"q":"What is an adversarial attack, and what defends against it?","a":"Feeding the model misleading inputs to trick it. Defend by filtering, sanitising and checking inputs, and monitoring outputs to stop leaks or harmful content.","id":"e-014"},{"l":"2.11","x":"4.2","t":"list","tags":["security","exam"],"q":"Google Cloud security tools named in the exam guide?","a":"Secure-by-design infrastructure · Identity and Access Management (IAM) · Security Command Center · workload monitoring tools.","id":"e-015"},{"l":"2.12","x":"4.3","t":"trap","tags":["responsible","exam"],"q":"Anonymization vs pseudonymization?","a":"Anonymization removes identifying details so data can't be linked back to a person. Pseudonymization replaces identifiers with substitutes (tokens) that can be re-linked only with separately protected information.","id":"e-016"},{"l":"2.12","x":"4.3","t":"list","tags":["responsible","exam"],"q":"Privacy risks to consider in gen AI?","a":"Personal data in training data · models leaking sensitive training data in outputs · re-identification · using data without consent.","id":"e-017"},{"l":"4.9","x":"3.3","t":"list","tags":["grounding","exam"],"q":"Three grounding data sources in the exam guide?","a":"First-party enterprise data (your own documents, databases) · third-party data (external datasets from partners/providers) · world data (public, general knowledge, e.g. Google Search).","id":"e-018"},{"l":"4.9","x":"3.3","t":"scenario","tags":["grounding","exam"],"q":"A chatbot must answer from the company's HR policies. Which grounding source?","a":"First-party enterprise data.","id":"e-019"},{"l":"4.9","x":"3.3","t":"scenario","tags":["grounding","exam"],"q":"An assistant must answer questions about today's news. Which grounding option?","a":"World data — Grounding with Google Search.","id":"e-020"},{"l":"5.11","x":"3.3","t":"list","tags":["rag","exam"],"q":"Google Cloud's three grounding offerings (exam guide)?","a":"Pre-built RAG with Agent Search · RAG APIs · Grounding with Google Search.","id":"e-021"},{"l":"5.11","x":"2.4","t":"trap","tags":["rag","exam"],"q":"Pre-built RAG with Agent Search vs RAG APIs?","a":"Agent Search: ready-made, managed search and retrieval over your data — fastest path. RAG APIs: building blocks for a custom RAG pipeline when you need more control over indexing, retrieval and generation.","id":"e-022"},{"l":"5.11","x":"2.4","t":"scenario","tags":["rag","exam"],"q":"A team wants grounded answers over company documents quickly, with minimal engineering. Which offering?","a":"Pre-built RAG with Agent Search.","id":"e-023"},{"l":"5.13","x":"2.3","t":"list","tags":["search","exam"],"q":"External search offerings named in the exam guide?","a":"Agent Search on Gemini Enterprise Agent Platform · Google Search.","id": Us · data centres · cloud computing.","id":"e-031"},{"l":"1.8","x":"2.1","t":"list","tags":["strategy","exam"],"q":"How does Google Cloud's AI platform give users control over their data?","a":"Security · privacy · governance · open and leading first-party models · pre-built and customisable solutions · agents.","id":"e-032"},{"l":"1.8","x":"2.1","t":"list","tags":["strategy","exam"],"q":"How does Google Cloud democratise AI development?","a":"Low-code and no-code tools · pre-trained models · APIs.","id":"e-033"},{"l":"1.8","x":"2.1","t":"list","tags":["strategy","exam"],"q":"What makes Google Cloud an 'enterprise-ready' AI platform (exam guide)?","a":"Responsible, secure, private, reliable, scalable.","id":"e-034"},{"l":"3.13","x":"3.1","t":"list","tags":["maintenance","exam"],"q":"Google-recommended practices for continuous monitoring and evaluation of gen AI models?","a":"Automatic model upgrades · KPIs · security patches and updates · versioning · performance tracking · drift monitoring · Agent Platform Feature Store.","id":"e-035"},{"l":"3.12","x":"4.1","t":"list","tags":["needs","exam"],"q":"Two key factors that influence gen AI needs (exam guide)?","a":"Business requirements and technical constraints.","id":"e-036"},{"l":"3.12","x":"4.1","t":"list","tags":["needs","exam"],"q":"Types of gen AI solutions named in the exam guide?","a":"Text generation · image generation · code generation · personalised user experiences.","id":"e-037"},{"l":"4.7","x":"2.2","t":"scenario","tags":["gems","exam"],"q":"Which Gemini app feature lets you save a reusable, task-specific assistant with its own instructions and files?","a":"Gems (in the Gemini app / Gemini Advanced).","id":"e-038"},{"l":"5.13","x":"2.3","t":"trap","tags":["search","agents","exam"],"q":"Is Agent Search an agent?","a":"The course describes it as acting like an agent (observes the query, uses data stores as tools). Mainly it is managed enterprise search, retrieval and RAG that apps and agents use.","id":"e-039"},{"l":"5.7","x":"3.2","t":"fact","tags":["prompting","exam"],"q":"Caveat on chain-of-thought 'explainability'?","a":"The course lists explainability as a CoT benefit, and the exam may too. But visible reasoning steps are not a guaranteed account of how the model actually reached its answer.","id":"e-040"},{"id":"n-001","l":"1.3","x":"2.4","t":"trap","tags":["names","exam"],"q":"What is Vertex AI called now?","a":"Gemini Enterprise Agent Platform (Agent Platform)."},{"id":"n-002","l":"5.13","x":"2.3","t":"trap","tags":["names","exam"],"q":"What is Vertex AI Search called now?","a":"Agent Search (on Gemini Enterprise Agent Platform)."},{"id":"n-003","l":"5.4","x":"2.5","t":"trap","tags":["names","exam"],"q":"What is Vertex AI Studio called now?","a":"Agent Studio."},{"id":"n-004","l":"4.10","x":"2.2","t":"trap","tags":["names","exam"],"q":"A course quiz mentions NotebookLM Enterprise. What is the current name?","a":"Gemini Notebook Enterprise."},{"id":"n-005","l":"5.15","x":"2.3","t":"trap","tags":["names","exam"],"q":"The exam guide says 'Customer Engagement Suite'. What is the current product name?","a":"Gemini Enterprise for CX."},{"id":"n-006","l":"5.15","x":"2.3","t":"trap","tags":["names","exam"],"q":"The exam guide says 'Conversational Agents'. What is the current name?","a":"CX agents, built in CX Agent Studio."},{"id":"n-007","l":"5.15","x":"2.3","t":"trap","tags":["names","exam"],"q":"The exam guide says 'Conversational Insights'. What is the current name?","a":"CX Insights."},{"id":"n-008","l":"5.9","x":"2.5","t":"trap","tags":["names","exam"],"q":"The exam guide says 'Cloud Functions'. What is the current name?","a":"Cloud Run functions."},{"id":"n-009","l":"4.2","x":"2.2","t":"trap","tags":["names","exam"],"q":"The exam guide says 'Gemini for Google Workspace'. What is the current name?","a":"Google Workspace with Gemini."},{"id":"n-010","l":"5.18","x":"2.2","t":"trap","tags":["names","exam"],"q":"What did Google Agentspace become?","a":"The Gemini Ent function makeQueue(write){ let pending=null, running=false, timer=null;
  const run = async () => { if (running || !pending) return; running=true; const body=pending; pending=null; setSync('saving…');
    try { await write(body); setSync('saved'); } catch(e){ setSync('save failed'); console.warn(e); if (e && e.code==='unavailable'){ pending=pending||body; setTimeout(run, 1500+Math.random()*1000);} }
    running=false; if (pending) run(); };
  return body => { pending=body; clearTimeout(timer); timer=setTimeout(run, 500); };
}
function initLocal(reason){
  const k1='gail-seen', k2='gail-stats';
  try { seen = JSON.parse(localStorage.getItem(k1)||'{}'); stats = JSON.parse(localStorage.getItem(k2)||'{}'); } catch(e){}
  store = { saveSeen(){ try{localStorage.setItem(k1,JSON.stringify(seen));}catch(e){} setSync('saved on this device'); },
            saveStats(){ try{localStorage.setItem(k2,JSON.stringify(stats));}catch(e){} setSync('saved on this device'); } };
  const b=$('#banner'); if (reason){ b.hidden=false; b.textContent = reason; }
  setSync('this device only'); renderAll();
}
async function initDb(){
  if (MODE==='standalone') { initLocal(''); return; }
  const api = window.claude;
  if (!api || !api.use) { initLocal('Progress is being saved in this browser only (the shared progress store is not available in this view).'); return; }
  const [db, user] = await Promise.all([api.use('db'), api.use('user')]);
  const uid = user ? await user.id() : null;
  if (!db || !uid) { initLocal('Progress is being saved in this browser only. Open the page signed in to claude.ai to sync it across devices.'); return; }
  const seenRef = db.doc(`data/users/${uid}/progress`);
  const statsRef = db.doc(`data/users/${uid}/cards`);
  const qSeen = makeQueue(b => seenRef.set(b));
  const qStats = makeQueue(b => statsRef.set(b));
  let dirtySeen=false, dirtyStats=false;
  store = { saveSeen(){ dirtySeen=true; qSeen({seen, at:Date.now()}); setTimeout(()=>dirtySeen=false,3000); },
            saveStats(){ dirtyStats=true; qStats({stats, at:Date.now()}); setTimeout(()=>dirtyStats=false,3000); } };
  let first=2;
  const done = () => { if (--first===0) { setSync('synced'); renderAll(); } else if (first<0) rerenderSoft(); };
  seenRef.onSnapshot(s => { if (!dirtySeen && !s.metadata.hasPendingWrites) seen = (s.exists && s.data().seen) || {}; done(); }, e => { setSync('sync stopped'); });
  statsRef.onSnapshot(s => { if (!dirtyStats && !s.metadata.hasPendingWrites) stats = (s.exists && s.data().stats) || {}; done(); }, e => { setSync('sync stopped'); });
}
function markSeen(id, on=true){ if (on) { if (!seen[id]) { seen[id]=Date.now(); store.saveSeen(); } } else if (seen[id]) { delete seen[id]; store.saveSeen(); } }

// ---------- flashcards ----------
let cfg = {scope:'seen', course:'1', lesson:null, tag:'products', exam:'1', size:20, order:'smart'};
let session = null;
function poolFor(scope, value){
  const un = unlockedCards();
  switch(scope){
    case 'seen': return un;
    case 'course': return un.filter(c=>c.l.split('.')[0]===value);
    case 'lesson': return un.filter(c=>c.l===value);
    case 'tag': return un.filter(c=>c.tags.includes(value));
    case 'exam': return un.filter(c=> value.includes('.') ? c.x===value : (c.x||'').split('.')[0]===value);
    case 'weak': return un.filter(isWeak);
    case 'never': return un.filter(c=>!(stats[c.id]&&stats[c.id].n));
    case 'due': return un.filter(c=>{ const s=stats[c.id]; return s && s.n && s.d <= Date.now(); });
  }
  return un;
}
function isWeak(c){ const s=stats[c.id]; return !!(s && s.n && (s.r==='again' || s.r==='hard' || (s.a||0) > (s.g||0))); }
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function orderDeck(pool, mode){
  if (mode==='random') return shuffle([...pool]);
  const now=Date.now();
  const tier = c => { const s=stats[c.id]; if (!s||!s.n) return 0; if (isWeak(c)) return 1; if (s.d<=now) return 2; return 3; };
  const groups=[[],[],[],[]]; pool.forEach(c=>groups[tier(c)].push(c));
  groups[0]=shuffle(groups[0]); groups[1]=shuffle(groups[1]); groups[2].sort((a,b)=>stats[a.id].d-stats[b.id].d);
  groups[3].sort((a,b)=>(stats[a.id].n-stats[b.id].n)||(stats[a.id].t-stats[b.id].t));
  return groups.flat();
}

  selT.addEventListener('change',()=>{ cfg.tag=selT.value; cfg.scope='tag'; renderSetup(); }); selT.addEventListener('click',e=>e.stopPropagation());
  opt('tag','One topic', selT);
  const exOpts=[]; EXAM.sections.forEach(s=>{ exOpts.push([s.id,`§${s.id} ${s.title} (${s.weight}%)`]); s.subs.forEach(x=>exOpts.push([x.id,`   §${x.id} ${x.title}`])); });
  const selE = el('select',{id:'sel-exam','aria-label':'Exam section'}, exOpts.map(([v,txt])=>{ const o=el('option',{value:v,text:`${txt} · ${poolFor('exam',v).length}`}); if (v===cfg.exam) o.selected=true; return o; }));
  selE.addEventListener('change',()=>{ cfg.exam=selE.value; cfg.scope='exam'; renderSetup(); }); selE.addEventListener('click',e=>e.stopPropagation());
  opt('exam','One exam-guide section', selE);
  left.append(scopes);
  left.append(el('div',{class:'fieldlbl',text:'Session length'}));
  const sizes = el('div',{class:'seg',role:'group','aria-label':'Session length'});
  [[10,'10'],[20,'20'],[40,'40'],[0,'All']].forEach(([v,t]) => sizes.append(el('button',{'aria-pressed':cfg.size===v?'true':'false',onclick:()=>{cfg.size=v; renderSetup();}},t)));
  left.append(sizes);
  left.append(el('div',{class:'fieldlbl',text:'Order'}));
  const ord = el('div',{class:'seg',role:'group','aria-label':'Order'});
  [['smart','Never-shown and weak first'],['random','Random']].forEach(([v,t]) => ord.append(el('button',{'aria-pressed':cfg.order===v?'true':'false',onclick:()=>{cfg.order=v; renderSetup();}},t)));
  left.append(ord);
  const valueOf = cfg.scope==='course'?cfg.course:cfg.scope==='lesson'?cfg.lesson:cfg.scope==='tag'?cfg.tag:cfg.scope==='exam'?cfg.exam:null;
  const n = poolFor(cfg.scope, valueOf).length;
  left.append(el('div',{class:'row',style:'margin-top:18px'}, el('button',{class:'btn primary',disabled:n===0,onclick:()=>startSession({scope:cfg.scope,value:valueOf,size:cfg.size,order:cfg.order})}, n ? `Start · ${cfg.size && cfg.size<n ? cfg.size : n} cards` : 'No cards in this selection')));
  // coverage panel
  const shown = un.filter(c=>stats[c.id]&&stats[c.id].n).length;
  const right = el('div',{class:'panel'}, el('h2',{text:'Coverage'}), el('p',{class:'sub',text:'How much of your unlocked deck you have actually been shown.'}));
  const cov = el('div',{class:'coverage'});
  const covrow = (label, a, b) => cov.append(el('div',{class:'covrow'}, el('span',{text:label}), el('b',{text:`${a}/${b}`}), el('div',{class:'bar'}, el('i',{style:`width:${b?Math.round(a/b*100):0}%`}))));
  covrow('All unlocked cards', shown, un.length);
  coursesSeen.forEach(c => { const u=un.filter(x=>x.l.split('.')[0]===c.id); covrow(`C${c.id} · ${c.title}`, u.filter(x=>stats[x.id]&&stats[x.id].n).length, u.length); });
  right.append(cov);
  right.append(el('p',{class:'sub',style:'margin-top:14px',text:`${un.length-shown} unlocked cards have never been shown. ${un.filter(isWeak).length} are weak.`}));
  root.append(el('div',{class:'fc-setup'}, left, right));
}
function startSession({scope,value,size,order='smart'}){
  const deck = orderDeck(poolFor(scope,value), order);
  const cards = size ? deck.slice(0,size) : deck;
  if (!cards.length) return;
  session = {cards, i:0, flipped:false, tally:{again:0,hard:0,good:0,easy:0}, label: scopeLabel(scope,value)};
  show('cards'); renderCard();
}
function scopeLabel(scope,value){ return {seen:'Everything seen',never:'Never shown',weak:'Weak cards',due:'Due for review',course:`Course ${value}`,lesson:`Lesson ${value}`,tag:TAG_LABEL[value]||value,exam:`Exam §${value}`}[scope]; }
function renderCard(){
  const root=$('#v-cards'); root.replaceChildren();
  const s=session; const wrap=el('div',{class:'session'});
  if (s.i >= s.cards.length){
    const t=s.tally;
    wrap.append(el('div',{class:'panel summary'}, el('div',{class:'eyebrow',text:s.label}), el('h2',{text:'Session complete'}),
      el('div',{class:'sgrid'}, ...[['again','Again'],['hard','Hard'],['good','Good'],['easy','Easy']].map(([k,l])=>el('div',{}, el('b',{text:t[k]}), el('span',{text:l})))),
      el('div',{class:'row',style:'justify-content:center'},
        t.again+t.hard ? el('button',{class:'btn primary',onclick:()=>startSession({scope:'weak',size:0})},'Drill weak cards') : null,
        el('button',{class:'btn',onclick:()=>{session=null; renderSetup();}},'New session'))));
    root.append(wrap); return;
  }
  const c=s.cards[s.i]; const st=stats[c.id];
  const pct = Math.round(s.i/s.cards.length*100);
  wrap.append(el('div',{class:'shead'}, el('button',{class:'btn ghost',onclick:()=>{session=null; renderSetup();}},'End'), el('div',{class:'bar'}, el('i',{style:`width:${pct}%`})), el('span',{class:'cnt',text:`${s.i+1} / ${s.cards.length}`})));
  const card = el('div',{class:'card'});
  card.append(el('div',{class:'meta'}, c.x?el('span',{class:'pill v',text:`Exam §${c.x}`}):null, el('span',{class:'pill',text:TYPE_LABEL[c.t]||c.t}), ...c.tags.slice(0,2).map(t=>el('span',{class:'pill',text:TAG_LABEL[t]||t})),
    el('span',{class:'pill',text: st&&st.n ? `shown ${st.n}×` : 'new'})));
  card.append(el('div',{class:'q',text:c.q}));
  if (s.flipped) card.append(el('div',{class:'a',text:c.a}));
  if (s.flipped){ const hs=aliasHits(c.q+' '+c.a).filter(a=>!c.tags.includes('names'));
    if (hs.length) card.append(el('div',{class:'namecheck'}, el('b',{text:'Name check'}), ...hs.map(a=>el('div',{}, el('strong',{text:a.cur}), ` · also seen as: ${a.old.map(o=>`${o[0]} (${o[1]})`).join('; ')}`)))); }
  const l=LBYID[c.l];
  card.append(el('div',{class:'src'}, `Lesson ${c.l} · ${l?l.title:''} · `, el('button',{onclick:()=>openLesson(c.l)},'open lesson')));
  wrap.append(card);
  if (!s.flipped){
    wrap.append(el('button',{class:'btn primary reveal',onclick:flip},'Show answer'));
    wrap.append(el('div',{class:'kbd',text:'Space or Enter to reveal'}));
  } else {
    const nextDays = r => { const b = st ? st.b||0 : 0; return r==='again'?'10 min':r==='hard'?'1 day':r==='good'?`${BOX_DAYS[Math.min(5,b+1)]||1} d`:`${BOX_DAYS[Math.min(5,b+2)]} d`; };
    wrap.append(el('div',{class:'rate'}, ...[['again','Again','1'],['hard','Hard','2'],['good','Good','3'],['easy','Easy','4']].map(([k,lab,key])=>
      el('button',{class:k,onclick:()=>rate(k)}, lab, el('span',{text:`${key} · ${nextDays(k)}`})))));
    wrap.append(el('div',{class:'kbd',text:'Keys 1–4 to rate'}));
  }
  root.append(wrap);
}
function flip(){ if (session && !session.flipped){ session.flipped=true; renderCard(); } }
function rate(r){
  const s=session; const c=s.cards[s.i]; const now=Date.now();
  const st = stats[c.id] ? {...stats[c.id]} : {n:0,a:0,g:0,b:0,d:now,t:0};
  st.n=(st.n||0)+1; st.t=now; st.r=r;
  if (r==='again'){ st.a=(st.a||0)+1; st.b=0; st.d=now+10*60*1000; }
  else if (r==='hard'){ st.a=(st.a||0); st.b=Math.max(1,Math.min(st.b||0,1)); st.d=now+DAY; }
  else if (r==='good'){ st.g=(st.g||0)+1; st.b=Math.min(5,(st.b||0)+1); st.d=now+BOX_DAYS[st.b]*DAY; }
  else { st.g=(st.g||0)+1; st.b=Math.min(5,(st.b||0)+2); st.d=now+BOX_DAYS[st.b]*DAY; }
  stats[c.id]=st; store.saveStats();
  s.tally[r]++; s.i++; s.flipped=false; renderCard();
}
document.addEventListener('keydown', e => {
  if (view!=='cards' || !session || session.i>=session.cards.length) return;
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (!session.flipped && (e.key===' '||e.key==='Enter')) { e.preventDefault(); flip(); }
  else if (session.flipped && ['1','2','3','4'].includes(e.key)) { e.preventDefault(); rate(['again','hard','good','easy'][+e.key-1]); }
});

// ---------- exam guide ----------
function renderExam(){
  const root=$('#v-exam'); root.replaceChildren();
  const un=unlockedCards();
  root.append(el('div',{class:'hero'}, el('div',{}, el('div',{class:'eyebrow',text:'Official exam guide · 4 sections'}), el('h1',{text:'Exam guide map'}),
    el('p',{text:'Every flashcard is mapped to the exam-guide section it prepares you for. Use this to check you are covering the exam in proportion to its weights, then drill a weak section.'}))));
  const grid=el('div',{class:'exgrid'});
  EXAM.sections.forEach(s=>{
    const all=CARDS.filter(c=>(c.x||'').split('.')[0]===s.id); const u=all.filter(c=>isSeen(c.l)); const sh=u.filter(c=>stats[c.id]&&stats[c.id].n);
    const g=u.reduce((a,c)=>a+((stats[c.id]||{}).g||0),0), a=u.reduce((x,c)=>x+((stats[c.id]||{}).a||0),0);
    const box=el('div',{class:'exsec'},
      el('div',{class:'exhead'}, el('span',{class:'exw',text:`${s.weight}%`}), el('div',{}, el('div',{class:'eyebrow',text:`Section ${s.id}`}), el('h2',{text:s.title}))),
      el('div',{class:'exstats'}, el('span',{text:`${all.length} cards`}), el('span',{text:`${u.length} unlocked`}), el('span',{text:`${sh.length} shown`}), el('span',{text: g+a?`${Math.round(g/(g+a)*100)}% correct`:'no reviews yet'})),
      el('div',{class:'bar'}, el('i',{style:`width:${u.length?Math.round(sh.length/u.length*100):0}%`})));
    const list=el('div',{class:'exsubs'});
    s.subs.forEach(x=>{ const cc=CARDS.filter(c=>c.x===x.id), uu=cc.filter(c=>isSeen(c.l));
      list.append(el('div',{class:'exsub'}, el('span',{class:'lid',text:`§${x.id}`}), el('span',{class:'ext',text:x.title}), el('span',{class:'pill',text:`${uu.length}/${cc.length}`}),
        el('button',{class:'btn',disabled:!uu.length,onclick:()=>startSession({scope:'exam',value:x.id,size:0})},'Drill'))); });
    box.append(list); grid.append(box);
  });
  root.append(grid);
  root.append(el('h2',{style:'margin-top:26px;font-size:18px',text:'Product names: current vs exam, quiz and older'}));
  root.append(el('p',{class:'sub',style:'color:var(--muted);margin:4px 0 0',text:'Learn the current name. The exam guide, the course quizzes and older documentation still use some older names, so recognise those too.'}));
  const tw=el('div',{class:'tblw'}); const tb=el('table',{class:'pt alias'});
  tb.append(el('thead',{}, el('tr',{}, el('th',{text:'Current name (learn this)'}), el('th',{text:'Also seen as'}), el('th',{text:'Where'}))));
  const body=el('tbody'); ALIASES.forEach(a=>a.old.forEach((o,i)=>body.append(el('tr',{}, el('td',{text:i?'':a.cur}), el('td',{text:o[0]}), el('td',{text:o[1]})))));
  tb.append(body); tw.append(tb); root.append(tw);
}

// ---------- progress ----------
let confirmReset=false;
function renderStats(){
  const root=$('#v-stats'); root.replaceChildren();
  const un=unlockedCards(); const shown=un.filter(c=>stats[c.id]&&stats[c.id].n); const weak=un.filter(isWeak);
  const seenN=LESSONS.filter(l=>isSeen(l.id)).length;
  const reviews = Object.values(stats).reduce((a,s)=>a+(s.n||0),0);
  const tile=(b,span,a,t)=>el('div',{class:'tile'}, el('b',{text:b}), el('span',{text:span}), t!=null?el('div',{class:'bar'}, el('i',{style:`width:${t?Math.round(a/t*100):0}%`})):null);
  root.append(el('div',{class:'pgrid'},
    tile(`${seenN}/${LESSONS.length}`,'lessons seen',seenN,LESSONS.length),
    tile(`${un.length}/${CARDS.length}`,'cards unlocked',un.length,CARDS.length),
    tile(`${shown.length}/${un.length}`,'unlocked cards shown at least once',shown.length,un.length),
    tile(`${reviews}`,'card reviews in total')));
  const tw=el('div',{class:'tblw'}); const t=el('table',{class:'pt'});
  t.append(el('thead',{}, el('tr',{}, el('th',{text:'Course'}), el('th',{class:'num',text:'Lessons'}), el('th',{class:'num',text:'Cards unlocked'}), el('th',{class:'num',text:'Shown'}), el('th',{class:'num',text:'Never shown'}), el('th',{class:'num',text:'Weak'}))));
  const tb=el('tbody');
  COURSES.forEach(c=>{ const cc=CARDS.filter(x=>x.l.split('.')[0]===c.id); const u=cc.filter(x=>isSeen(x.l)); const sh=u.filter(x=>stats[x.id]&&stats[x.id].n);
    tb.append(el('tr',{}, el('td',{text:`C${c.id} · ${c.title}`}), el('td',{class:'num',text:`${courseProgress(c).s}/${c.lessons.length}`}), el('td',{class:'num',text:`${u.length}/${cc.length}`}), el('td',{class:'num',text:sh.length}), el('td',{class:'num',text:u.length-sh.length}), el('td',{class:'num',text:u.filter(isWeak).length}))); });
  t.append(tb); tw.append(t); root.append(el('h2',{style:'margin-top:22px;font-size:18px',text:'By course'}), tw);
  // by topic
  const tw2=el('div',{class:'tblw'}); const t2=el('table',{class:'pt'});
  t2.append(el('thead',{}, el('tr',{}, el('th',{text:'Topic'}), el('th',{class:'num',text:'Unlocked'}), el('th',{class:'num',text:'Shown'}), el('th',{class:'num',text:'Weak'}), el('th',{class:'num',text:'Correct rate'}))));
  const tb2=el('tbody');
  Object.keys(TAG_LABEL).forEach(tag=>{ const u=un.filter(c=>c.tags.includes(tag)); if(!u.length) return; const g=u.reduce((a,c)=>a+((stats[c.id]||{}).g||0),0), a=u.reduce((x,c)=>x+((stats[c.id]||{}).a||0),0);
    tb2.append(el('tr',{}, el('td',{text:TAG_LABEL[tag]}), el('td',{class:'num',text:u.length}), el('td',{class:'num',text:u.filter(c=>stats[c.id]&&stats[c.id].n).length}), el('td',{class:'num',text:u.filter(isWeak).length}), el('td',{class:'num',text: g+a ? `${Math.round(g/(g+a)*100)}%` : '–'}))); });
  t2.append(tb2); tw2.append(t2); root.append(el('h2',{style:'margin-top:22px;font-size:18px',text:'By topic'}), tw2);
  root.append(el('h2',{style:'margin-top:22px;font-size:18px',text:`Weak cards (${weak.length})`}));
  if (weak.length){ const ul=el('ul',{class:'weak'}); weak.slice(0,40).forEach(c=>ul.append(el('li',{}, el('strong',{text:c.l+' '}), c.q))); root.append(ul,
      el('button',{class:'btn primary',onclick:()=>startSession({scope:'weak',size:0})},'Drill weak cards'));
  } else root.append(el('p',{class:'empty',text:'No weak cards yet. Cards you rate Again or Hard appear here.'}));
  root.append(el('div',{class:'danger'}, el('span',{text: confirmReset ? 'This clears every card rating and the shown-count tracker. Lesson ticks stay. Confirm?' : 'Start the flashcard statistics over.'}),
    confirmReset ? el('button',{class:'btn',onclick:()=>{ stats={}; store.saveStats(); confirmReset=false; renderStats(); }},'Yes, reset card stats') : el('button',{class:'btn',onclick:()=>{confirmReset=true; renderStats();}},'Reset card stats'),
    confirmReset ? el('button',{class:'btn ghost',onclick:()=>{confirmReset=false; renderStats();}},'Cancel') : null));
}

// ---------- boot ----------
renderTree();
setTimeout(()=>{ if (!store) setSync('connecting…'); }, 0);
initDb().catch(e => { console.warn(e); initLocal('Progress is being saved in this browser only.'); });
setTimeout(()=>{ if (!store) initLocal('Progress is being saved in this browser only (the shared progress store did not answer).'); }, 12000);
})();
</script>
